name: Selenium Automated E2E Testing

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  selenium-test:
    runs-on: ubuntu-latest

    services:
      # Khởi động Redis service container cho cache / lock ghế
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Verify Chrome Installation
        run: |
          google-chrome --version

      - name: Run Spring Boot & Selenium Tests
        env:
          # Kiểm thử sử dụng in-memory H2 database độc lập
          # Chuyển đổi Redis trỏ về Container Service
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          JWT_SECRET: 12345678901234567890123456789012
          TMDB_API_KEY: test_tmdb_api_key_placeholder
          GEMINI_API_KEY: test-key
        run: |
          mvn test -Dtest=BookingSeleniumTest,BookingControllerTest -Dspring.profiles.active=test
