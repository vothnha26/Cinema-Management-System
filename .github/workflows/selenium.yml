name: Selenium Automated E2E Testing

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  selenium-test:
    runs-on: ubuntu-latest

    services:
      # Khởi động MySQL service container cho test database
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: cinema_db
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      # Khởi động Redis service container cho cache / lock ghế
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Setup ChromeDriver
        uses: browser-actions/setup-chromedriver@latest

      - name: Verify Chrome Installation
        run: |
          google-chrome --version
          chromedriver --version

      - name: Run Spring Boot & Selenium Tests
        env:
          # Truyền các biến môi trường để test kết nối đến các Service Container
          DB_URL: jdbc:mysql://127.0.0.1:3306/cinema_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
          DB_USERNAME: root
          DB_PASSWORD: root
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          JWT_SECRET: cinema-management-super-secret-key-2024-at-least-256-bit-for-github-actions
          TMDB_API_KEY: 919a2431095ad1d5a5a0bfe94b56acb3
          GEMINI_API_KEY: test-key
        run: |
          mvn test -Dtest=BookingSeleniumTest,BookingControllerTest -Dspring.profiles.active=test
