version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: cinema-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: cinema_db
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      timeout: 20s
      retries: 10
    networks:
      - cinema-network

  redis:
    image: redis:alpine
    container_name: cinema-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 5
    networks:
      - cinema-network

  backend:
    build: ./backend
    container_name: cinema-backend
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_URL=jdbc:mysql://db:3306/cinema_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=12345678901234567890123456789012
      - TMDB_API_KEY=test_tmdb_api_key_placeholder
    networks:
      - cinema-network

  frontend:
    build: ./frontend
    container_name: cinema-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8082/api
    networks:
      - cinema-network

volumes:
  mysql-data:

networks:
  cinema-network:
    driver: bridge
