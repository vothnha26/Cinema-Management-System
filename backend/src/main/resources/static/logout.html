<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang đăng xuất – StarCinema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <style>
        :root {
          --bg: #080B14; --surface: #0F1320; --card: #161B2E; --border: #252A3D;
          --accent: #E5133A; --text: #E8EAF0; --text-muted: #7B82A0;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; }
        .logout-card { text-align: center; animation: fadeIn 0.8s ease-out; }
        .brand { font-family: 'Bebas Neue', sans-serif; font-size: 3.5rem; letter-spacing: 5px; margin-bottom: 20px; }
        .brand span { color: var(--accent); }
        .spinner { width: 3rem; height: 3rem; color: var(--accent); margin-bottom: 20px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="logout-card">
    <div class="brand">STAR<span>CINEMA</span></div>
    <div class="spinner-border spinner" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <h4 class="fw-bold">Đang đăng xuất an toàn...</h4>
    <p class="text-muted">Cảm ơn bạn đã sử dụng dịch vụ của StarCinema.</p>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Xóa tất cả thông tin đăng nhập
        localStorage.removeItem('cinemaToken');
        localStorage.removeItem('cinemaRole');
        localStorage.removeItem('cinemaUsername');
        localStorage.removeItem('cinemaBranchId');
        
        // Chuyển hướng sau 1.5 giây để tạo cảm giác mượt mà
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 1500);
    });
</script>
</body>
</html>
