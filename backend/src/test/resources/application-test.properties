# Server Port for Test
server.port=0

# H2 Database configuration for test profile
spring.datasource.url=jdbc:h2:mem:cinema_db;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=KEY,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Enable Flyway migration for in-memory H2 tests to create schema
spring.flyway.enabled=true
spring.flyway.clean-disabled=false

# Redis configuration (will fall back to safe error logs when unreachable during tests)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Mock static settings
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test
jwt.secret=12345678901234567890123456789012
jwt.expiration=86400000
gemini.api.key=test-key


# TMDB & Pay settings
tmdb.api.key=test
tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.api.image-base=https://image.tmdb.org/t/p/w500
app.base-url=http://localhost:8082
vietqr.bank-bin=970415
vietqr.bank-number=109879673245
vietqr.account-name=STAR CINEMA
sepay.secret=test

# Data Initializer settings
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
