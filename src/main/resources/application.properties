# Server configuration
server.port=8080

# MySQL Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/cinema_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Mysql@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT configuration
jwt.secret=cinema-management-super-secret-key-2024-at-least-256-bit
jwt.expiration=86400000

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cloudinary Configuration
cloudinary.cloud-name=your_cloud_name
cloudinary.api-key=your_api_key
cloudinary.api-secret=your_api_secret


# Data Initialization
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-clean.sql
spring.jpa.defer-datasource-initialization=true

# TMDB Configuration
tmdb.api.key=058774dd092d154b205d2212e0da8775
tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.api.image-base=https://image.tmdb.org/t/p/w500

# Show detailed errors (Chỉ dùng để debug)
server.error.include-message=always
server.error.include-binding-errors=always

# Payment / VietQR configuration
