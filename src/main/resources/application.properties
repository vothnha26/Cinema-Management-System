# Server configuration
server.port=8082

# MySQL Database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cinema_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# JWT configuration
jwt.secret=${JWT_SECRET:12345678901234567890123456789012}
jwt.expiration=86400000

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# JavaMailSender configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USER}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Data Initialization
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=false

# TMDB Configuration
tmdb.api.key=${TMDB_API_KEY:919a2431095ad1d5a5a0bfe94b56acb3}
tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.api.image-base=https://image.tmdb.org/t/p/w500

# Show detailed errors
server.error.include-message=always
server.error.include-binding-errors=always

# Payment / VietQR configuration
app.base-url=${app.base-url:http://localhost:8082}
vietqr.bank-bin=${VIETQR_BANK_BIN:970415}
vietqr.bank-number=${VIETQR_BANK_NUMBER:109879673245}
vietqr.account-name=${VIETQR_ACCOUNT_NAME:STAR CINEMA}

# SePay configuration (Take from .env)
sepay.secret=${SEPAY_SECRET:}
sepay.bank-name=${SEPAY_BANK_NAME:VietinBank}
sepay.bank-account=${SEPAY_BANK_ACCOUNT:109879673245}
sepay.bank-bin=${SEPAY_BANK_BIN:970415}
sepay.prefix=${SEPAY_PREFIX:SEVQR }
sepay.callback-path=${SEPAY_CALLBACK_PATH:/api/public/payments/webhook}

# Redis configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Gemini AI Config
gemini.api.key=${GEMINI_API_KEY}
gemini.api.endpoint=https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false
