# Server configuration
server.port=8081

# MySQL Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/cinema_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT configuration
jwt.secret=${JWT_SECRET:cinema-management-super-secret-key-2024-at-least-256-bit}
jwt.expiration=86400000

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# JavaMailSender configuration (Fix startup error)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USER}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Data Initialization
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

# TMDB Configuration
tmdb.api.key=${TMDB_API_KEY:058774dd092d154b205d2212e0da8775}
tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.api.image-base=https://image.tmdb.org/t/p/w500

# Show detailed errors (Chỉ dùng để debug)
server.error.include-message=always
server.error.include-binding-errors=always

# Payment / VietQR configuration
app.base-url=http://localhost:8080
vietqr.bank-bin=970422
vietqr.bank-number=1900123456789
vietqr.account-name=STAR CINEMA
sepay.secret=
sepay.callback-path=/api/payments/webhook
