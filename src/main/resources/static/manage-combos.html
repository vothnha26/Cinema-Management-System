<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Combo & Tồn kho | FlashCinema Elite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
          --bg: #080B14; --surface: #0F1320; --card: #161B2E; --border: #252A3D;
          --accent: #E5133A; --text: #E8EAF0; --text-muted: #7B82A0;
          --gradient: linear-gradient(135deg, #E5133A, #8B0020);
        }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; margin: 0; display: flex; }
        
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.8rem; letter-spacing: 2px; margin: 0; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .combo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .combo-card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 25px; transition: 0.3s; position: relative; overflow: hidden; }
        .combo-card:hover { border-color: var(--accent); transform: translateY(-5px); }
        
        .combo-image { width: 100%; height: 180px; object-fit: cover; border-radius: 16px; margin-bottom: 20px; background: var(--surface); }
        .combo-name { font-size: 1.2rem; font-weight: 800; color: #fff; margin-bottom: 5px; }
        .combo-price { color: var(--accent); font-weight: 700; font-size: 1.1rem; margin-bottom: 20px; display: block; }

        .stock-section { background: var(--surface); padding: 15px; border-radius: 16px; border: 1px solid var(--border); }
        .stock-label { font-size: 0.7rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; display: block; }
        .stock-control { display: flex; align-items: center; gap: 15px; }
        .stock-control input { background: #000; border: 1px solid var(--border); color: #fff; text-align: center; font-weight: 800; width: 80px; padding: 8px; border-radius: 10px; }
        .btn-update { background: var(--accent); color: #fff; border: none; padding: 8px 20px; border-radius: 10px; font-weight: 700; font-size: 0.85rem; flex: 1; transition: 0.2s; }
        .btn-update:hover { opacity: 0.9; }

        .badge-status { position: absolute; top: 20px; right: 20px; padding: 5px 12px; border-radius: 30px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; }
        .bg-active { background: rgba(80,200,100,0.15); color: #50C864; border: 1px solid rgba(80,200,100,0.2); }
        .bg-inactive { background: rgba(229,19,58,0.15); color: var(--accent); border: 1px solid rgba(229,19,58,0.2); }

        .toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; }
    </style>
</head>
<body>

<aside class="sidebar" id="sidebar"></aside>

<main class="main-content">
    <div class="header-section">
        <div>
            <h1 class="page-title">QUẢN LÝ TỒN KHO COMBO</h1>
            <p class="text-muted m-0 fw-500">Cập nhật số lượng bắp nước và thực phẩm tại chi nhánh</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary px-4 fw-bold" style="border-radius: 12px" onclick="loadCombos()">
                <i class="bi bi-arrow-clockwise me-2"></i>LÀM MỚI
            </button>
        </div>
    </div>

    <div class="combo-grid" id="comboGrid">
        <!-- Combo cards will be loaded here -->
    </div>
</main>

<div class="toast-container" id="toastContainer"></div>

<script src="/js/auth-guard.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/api.js"></script>
<script>
    AuthGuard.requireRole(['MANAGER', 'ADMIN']);
    let allCombos = [];

    async function loadCombos() {
        const res = await api.get('/combos');
        if (res.success) {
            allCombos = res.data;
            renderCombos();
        }
    }

    function renderCombos() {
        const grid = document.getElementById('comboGrid');
        grid.innerHTML = allCombos.map(c => `
            <div class="combo-card animate__animated animate__fadeIn">
                <span class="badge-status ${c.active ? 'bg-active' : 'bg-inactive'}">${c.active ? 'Kinh doanh' : 'Ngừng bán'}</span>
                <img src="${c.imageUrl || 'https://placehold.co/300x180/161B2E/E8EAF0?text=Combo'}" class="combo-image" onerror="this.src='https://placehold.co/300x180/161B2E/E8EAF0?text=Combo'">
                <div class="combo-name">${c.name}</div>
                <span class="combo-price">${c.price.toLocaleString()}đ</span>
                
                <div class="stock-section">
                    <span class="stock-label">Số lượng tồn kho</span>
                    <div class="stock-control">
                        <input type="number" id="stock-${c.id}" value="${c.stockQuantity}" min="0">
                        <button class="btn-update" onclick="updateStock(${c.id})">CẬP NHẬT</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    async function updateStock(id) {
        const newStock = document.getElementById(`stock-${id}`).value;
        const res = await api.patch(`/combos/${id}/stock?quantity=${newStock}`);
        if (res.success) {
            showNotify('Thành công', 'Đã cập nhật số lượng tồn kho');
            loadCombos();
        } else {
            showNotify('Lỗi', res.message, 'error');
        }
    }

    function showNotify(title, msg, type='success') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `alert alert-${type==='success'?'success':'danger'} shadow-lg border-0 d-flex align-items-center gap-3 py-3 px-4 animate__animated animate__fadeInUp`;
        toast.style.borderRadius = '16px';
        toast.innerHTML = `<i class="bi ${type==='success'?'bi-check-circle-fill':'bi-exclamation-triangle-fill'} fs-4"></i>
                           <div><div class="fw-bold">${title}</div><div class="small">${msg}</div></div>`;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    }

    loadCombos();
</script>
</body>
</html>
