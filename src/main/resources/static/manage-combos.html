<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Combo – StarCinema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
          --bg: #080B14; --surface: #0F1320; --card: #161B2E; --border: #252A3D;
          --accent: #E5133A; --accent-gold: #F5A623; --text: #E8EAF0; --text-muted: #7B82A0;
          --gradient: linear-gradient(135deg, #E5133A, #8B0020);
          --sidebar-width: 260px;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; overflow-x: hidden; }
        
        /* ── SIDEBAR ── */
        .sidebar {
          width: var(--sidebar-width); background: var(--surface); border-right: 1px solid var(--border);
          height: 100vh; position: fixed; top: 0; left: 0; z-index: 1000; padding: 24px;
          display: flex; flex-direction: column;
        }
        .brand { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 3px; color: var(--text); margin-bottom: 40px; text-decoration: none; display: block; }
        .brand span { color: var(--accent); }
        .nav-menu { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
        .nav-item { margin-bottom: 8px; }
        .nav-link-admin {
          display: flex; align-items: center; gap: 12px; padding: 12px 16px;
          color: var(--text-muted); text-decoration: none; border-radius: 10px;
          transition: all 0.2s; font-weight: 500;
        }
        .nav-link-admin i { font-size: 1.2rem; }
        .nav-link-admin:hover, .nav-link-admin.active { background: rgba(229,19,58,0.1); color: var(--accent); }
        .nav-link-admin.active { background: var(--gradient); color: #fff; }

        /* ── MAIN CONTENT ── */
        .main-content { margin-left: var(--sidebar-width); padding: 40px; min-height: 100vh; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; letter-spacing: 1px; margin: 0; }

        .btn-add {
          background: var(--gradient); color: #fff; border: none; padding: 10px 24px;
          border-radius: 10px; font-weight: 600; display: flex; align-items: center; gap: 8px;
        }

        /* ── COMBO CARDS ── */
        .combo-card {
          background: var(--card); border: 1px solid var(--border); border-radius: 16px;
          overflow: hidden; transition: transform 0.2s; height: 100%;
        }
        .combo-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .combo-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: var(--surface); }
        .combo-body { padding: 20px; }
        .combo-name { font-weight: 700; font-size: 1.1rem; margin-bottom: 8px; color: var(--text); }
        .combo-desc { font-size: 0.85rem; color: var(--text-muted); height: 40px; overflow: hidden; margin-bottom: 16px; }
        .combo-price { font-weight: 700; color: var(--accent-gold); font-size: 1.2rem; }

        /* ── MODAL ── */
        .modal-content { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; color: var(--text); }
        .modal-header, .modal-footer { border-color: var(--border); padding: 20px 24px; }
        .form-control, .form-select { background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px 14px; }
        
        .img-preview-box {
          width: 100%; aspect-ratio: 16/9; border: 2px dashed var(--border);
          border-radius: 12px; display: flex; flex-direction: column;
          align-items: center; justify-content: center; color: var(--text-muted);
          cursor: pointer; overflow: hidden; position: relative;
        }
        .img-preview-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
    </style>
</head>
<body>

<aside class="sidebar">
    <a href="index.html" class="brand">STAR<span>CINEMA</span></a>
    <ul class="nav-menu">
        <li class="nav-item"><a href="dashboard.html" class="nav-link-admin"><i class="bi bi-grid-1x2-fill"></i> Bảng điều khiển</a></li>
        <li class="nav-item"><a href="manage-movies.html" class="nav-link-admin"><i class="bi bi-film"></i> Quản lý phim</a></li>
        <li class="nav-item"><a href="manage-showtimes.html" class="nav-link-admin"><i class="bi bi-calendar-event"></i> Suất chiếu</a></li>
        <li class="nav-item"><a href="manage-rooms.html" class="nav-link-admin"><i class="bi bi-door-open"></i> Phòng chiếu</a></li>
        <li class="nav-item"><a href="#" class="nav-link-admin"><i class="bi bi-ticket-perforated"></i> Quản lý vé</a></li>
        <li class="nav-item"><a href="manage-combos.html" class="nav-link-admin active"><i class="bi bi-cup-straw"></i> Combo đồ ăn</a></li>
        <li class="nav-item"><a href="manage-users.html" class="nav-link-admin"><i class="bi bi-people"></i> Người dùng</a></li>
    </ul>
</aside>

<main class="main-content">
    <div class="header-section">
        <h1 class="page-title">Quản lý Combo</h1>
        <button class="btn-add" data-bs-toggle="modal" data-bs-target="#comboModal" onclick="resetForm()">
            <i class="bi bi-plus-lg"></i> Thêm combo mới
        </button>
    </div>

    <div class="row g-4" id="comboList">
        <!-- Combo cards loaded via JS -->
    </div>
</main>

<!-- MODAL -->
<div class="modal fade" id="comboModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="modalTitle">Thiết lập Combo mới</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="comboForm">
                    <input type="hidden" id="comboId">
                    <div class="mb-3">
                        <label class="form-label">Ảnh minh họa</label>
                        <div class="img-preview-box" onclick="document.getElementById('imgInput').click()">
                            <i class="bi bi-image mb-2" style="font-size:2rem"></i>
                            <span style="font-size:0.8rem">Tải ảnh lên (16:9)</span>
                            <img src="" id="imgPreview">
                        </div>
                        <input type="file" id="imgInput" hidden accept="image/*" onchange="previewImg(this)">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tên Combo</label>
                        <input type="text" id="comboName" class="form-control" placeholder="Ví dụ: Combo Bắp + Nước lớn" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mô tả chi tiết</label>
                        <textarea id="comboDesc" class="form-control" rows="2" placeholder="Ví dụ: 1 bắp rang bơ 60oz + 2 nước ngọt 32oz..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Giá bán (VNĐ)</label>
                        <input type="number" id="comboPrice" class="form-control" placeholder="Ví dụ: 99000" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-link text-muted text-decoration-none" data-bs-dismiss="modal">Hủy bỏ</button>
                <button type="button" class="btn btn-add px-4" onclick="saveCombo()">Lưu thông tin</button>
            </div>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', loadCombos);

    const comboModal = new bootstrap.Modal(document.getElementById('comboModal'));

    async function loadCombos() {
        const res = await api.get('/combos');
        if (res.success) renderCombos(res.data);
    }

    function renderCombos(combos) {
        const container = document.getElementById('comboList');
        container.innerHTML = combos.map(c => `
            <div class="col-md-4 col-lg-3">
                <div class="combo-card">
                    <img src="${c.imageUrl || 'https://placehold.co/600x400?text=Combo'}" class="combo-img">
                    <div class="combo-body">
                        <div class="combo-name">${c.name}</div>
                        <div class="combo-desc">${c.description || ''}</div>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="combo-price">${new Intl.NumberFormat('vi-VN').format(c.price)}đ</div>
                            <div class="d-flex gap-2">
                                <button class="btn btn-sm btn-outline-light p-1" style="border-radius:6px" onclick="editCombo(${c.id})"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-outline-danger p-1" style="border-radius:6px" onclick="deleteCombo(${c.id})"><i class="bi bi-trash"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function resetForm() {
        document.getElementById('comboForm').reset();
        document.getElementById('comboId').value = '';
        document.getElementById('imgPreview').style.display = 'none';
        document.querySelector('.img-preview-box i').style.display = 'block';
        document.querySelector('.img-preview-box span').style.display = 'block';
        document.getElementById('modalTitle').textContent = 'Thiết lập Combo mới';
    }

    async function editCombo(id) {
        const res = await api.get(`/combos/${id}`);
        if (res.success) {
            const c = res.data;
            document.getElementById('comboId').value = c.id;
            document.getElementById('comboName').value = c.name;
            document.getElementById('comboDesc').value = c.description;
            document.getElementById('comboPrice').value = c.price;
            if (c.imageUrl) {
                const preview = document.getElementById('imgPreview');
                preview.src = c.imageUrl;
                preview.style.display = 'block';
                document.querySelector('.img-preview-box i').style.display = 'none';
                document.querySelector('.img-preview-box span').style.display = 'none';
            }
            document.getElementById('modalTitle').textContent = 'Chỉnh sửa Combo';
            comboModal.show();
        }
    }

    async function saveCombo() {
        const id = document.getElementById('comboId').value;
        const formData = new FormData();
        const comboData = {
            name: document.getElementById('comboName').value,
            description: document.getElementById('comboDesc').value,
            price: parseFloat(document.getElementById('comboPrice').value)
        };
        
        formData.append('combo', new Blob([JSON.stringify(comboData)], { type: 'application/json' }));
        const fileInput = document.getElementById('imgInput');
        if (fileInput.files[0]) formData.append('image', fileInput.files[0]);

        const res = await (id ? api.put(`/combos/${id}`, formData, true) : api.post('/combos', formData, true));
        if (res.success) {
            comboModal.hide(); loadCombos();
        }
    }

    async function deleteCombo(id) {
        if (confirm('Xóa combo này?')) {
            const res = await api.delete(`/combos/${id}`);
            if (res.success) loadCombos();
        }
    }

    function previewImg(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const preview = document.getElementById('imgPreview');
                preview.src = e.target.result;
                preview.style.display = 'block';
                document.querySelector('.img-preview-box i').style.display = 'none';
                document.querySelector('.img-preview-box span').style.display = 'none';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
</body>
</html>
