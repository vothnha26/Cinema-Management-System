<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Combo – StarCinema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <link rel="icon" type="image/png" href="/favicon.png?v=2">
    <style>
        :root {
          --bg: #080B14; --surface: #0F1320; --card: #161B2E; --border: #252A3D;
          --accent: #E5133A; --accent-gold: #F5A623; --text: #E8EAF0; --text-muted: #7B82A0;
          --gradient: linear-gradient(135deg, #E5133A, #8B0020);
          --sidebar-width: 260px;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; overflow-x: hidden; }
        .sidebar { width: var(--sidebar-width); background: var(--surface); border-right: 1px solid var(--border); height: 100vh; position: fixed; top: 0; left: 0; z-index: 1000; padding: 24px; display: flex; flex-direction: column; }
        .brand { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 3px; color: var(--text); margin-bottom: 40px; text-decoration: none; }
        .brand span { color: var(--accent); }
        .nav-link-admin { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text-muted); text-decoration: none; border-radius: 10px; transition: all 0.2s; font-weight: 500; margin-bottom: 8px; }
        .nav-link-admin:hover, .nav-link-admin.active { background: rgba(229,19,58,0.1); color: var(--accent); }
        .nav-link-admin.active { background: var(--gradient); color: #fff; }
        .user-panel { border-top: 1px solid var(--border); padding-top: 20px; margin-top: auto; }

        .main-content { margin-left: var(--sidebar-width); padding: 40px; min-height: 100vh; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; letter-spacing: 1px; margin: 0; }

        .btn-add { background: var(--gradient); border: none; color: #fff; padding: 10px 24px; border-radius: 10px; font-weight: 600; transition: opacity 0.2s; }
        .combo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
        .combo-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; transition: 0.3s; }
        .combo-card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .combo-img { width: 100%; height: 180px; object-fit: cover; background: var(--surface); }
        .combo-body { padding: 20px; }
        .combo-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
        .combo-price { color: var(--accent-gold); font-weight: 700; font-size: 1.1rem; }
        
        .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 20px; color: var(--text); }
        .form-control { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 10px; }
        .form-control:focus { border-color: var(--accent); background: var(--surface); color: #fff; outline: none; box-shadow: none; }

        .image-preview-box { width: 100%; height: 180px; border: 2px dashed var(--border); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; }
        .image-preview-box img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
        
        .stock-badge { font-size: 0.75rem; padding: 4px 10px; border-radius: 6px; font-weight: 600; }
        .stock-low { background: rgba(229,19,58,0.1); color: var(--accent); }
        .stock-ok { background: rgba(80,200,100,0.1); color: #50C864; }
    </style>
</head>
<body>

<aside class="sidebar"></aside>

<main class="main-content">
    <div class="header-section">
        <div>
            <h1 class="page-title">Quản lý Combo</h1>
            <p class="text-muted m-0">Bắp nước và các gói dịch vụ đi kèm.</p>
        </div>
        <button class="btn-add" onclick="openAddModal()">
            <i class="bi bi-plus-lg me-2"></i> THÊM COMBO MỚI
        </button>
    </div>

    <div class="combo-grid" id="comboGrid">
        <div class="col-12 text-center py-5">Đang tải dữ liệu...</div>
    </div>
</main>

<!-- MODAL -->
<div class="modal fade" id="comboModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">THÔNG TIN COMBO</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form id="comboForm">
                    <input type="hidden" id="comboId">
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-muted">Hình ảnh Combo</label>
                        <div class="image-preview-box" onclick="document.getElementById('imageInput').click()">
                            <i class="bi bi-image fs-1 text-muted"></i>
                            <span class="text-muted small">Nhấp để chọn ảnh</span>
                            <img id="imagePreview" style="display: none;">
                        </div>
                        <input type="file" id="imageInput" class="d-none" accept="image/*" onchange="previewImage(this)">
                        <input type="hidden" id="imageUrl">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Tên combo</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Mô tả</label>
                        <textarea name="description" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label small fw-bold text-muted">Giá bán (VNĐ)</label>
                            <input type="number" name="price" class="form-control" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-bold text-muted">Số lượng tồn kho</label>
                            <input type="number" name="stockQuantity" class="form-control" value="100" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Hủy</button>
                <button type="button" class="btn btn-danger px-4 fw-bold" onclick="saveCombo()">LƯU COMBO</button>
            </div>
        </div>
    </div>
</div>

<script src="/js/auth-guard.js"></script>
<script>AuthGuard.requireRole(['MANAGER']);</script>
<script src="/js/sidebar.js"></script>
<script src="/js/api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const comboModal = new bootstrap.Modal(document.getElementById('comboModal'));
    let allCombos = [];

    document.addEventListener('DOMContentLoaded', loadCombos);

    async function loadCombos() {
        try {
            const res = await api.get('/combos');
            if (res.success) {
                allCombos = res.data;
                renderCombos(allCombos);
            }
        } catch (e) { console.error(e); }
    }

    function renderCombos(combos) {
        document.getElementById('comboGrid').innerHTML = combos.map(c => {
            const stockClass = (c.stockQuantity || 0) < 10 ? 'stock-low' : 'stock-ok';
            return `
                <div class="combo-card">
                    <img src="${c.imageUrl || 'https://placehold.co/300x180?text=Combo'}" class="combo-img" onerror="this.src='https://placehold.co/300x180?text=Combo'">
                    <div class="combo-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div class="combo-name">${c.name}</div>
                            <span class="stock-badge ${stockClass}">Kho: ${c.stockQuantity || 0}</span>
                        </div>
                        <div class="text-muted small mb-3">${c.description || 'Không có mô tả'}</div>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="combo-price">${new Intl.NumberFormat('vi-VN').format(c.price)}đ</span>
                            <div class="btn-group">
                                <button class="btn btn-sm btn-outline-light" onclick="editCombo(${c.id})"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteCombo(${c.id})"><i class="bi bi-trash"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function openAddModal() {
        document.getElementById('comboForm').reset();
        document.getElementById('comboId').value = '';
        document.getElementById('imagePreview').style.display = 'none';
        document.getElementById('modalTitle').innerText = 'THÊM COMBO MỚI';
        comboModal.show();
    }

    function editCombo(id) {
        const c = allCombos.find(x => x.id === id);
        if (!c) return;
        const f = document.getElementById('comboForm');
        document.getElementById('comboId').value = c.id;
        f.querySelector('[name="name"]').value = c.name;
        f.querySelector('[name="description"]').value = c.description || '';
        f.querySelector('[name="price"]').value = c.price;
        f.querySelector('[name="stockQuantity"]').value = c.stockQuantity || 0;
        document.getElementById('imageUrl').value = c.imageUrl || '';
        
        if (c.imageUrl) {
            const prev = document.getElementById('imagePreview');
            prev.src = c.imageUrl; prev.style.display = 'block';
        } else {
            document.getElementById('imagePreview').style.display = 'none';
        }
        
        document.getElementById('modalTitle').innerText = 'CẬP NHẬT COMBO';
        comboModal.show();
    }

    async function saveCombo() {
        const id = document.getElementById('comboId').value;
        const f = document.getElementById('comboForm');
        
        const data = {
            name: f.querySelector('[name="name"]').value.trim(),
            description: f.querySelector('[name="description"]').value.trim(),
            price: parseFloat(f.querySelector('[name="price"]').value),
            stockQuantity: parseInt(f.querySelector('[name="stockQuantity"]').value) || 0,
            imageUrl: document.getElementById('imageUrl').value
        };

        if (!data.name || isNaN(data.price)) return alert('Vui lòng nhập đủ thông tin!');

        const fd = new FormData();
        fd.append('combo', new Blob([JSON.stringify(data)], { type: 'application/json' }));
        
        const fileInput = document.getElementById('imageInput');
        if (fileInput.files.length > 0) {
            fd.append('image', fileInput.files[0]);
        }

        try {
            const res = await (id ? api.put(`/combos/${id}`, fd, true) : api.post('/combos', fd, true));
            if (res.success) {
                comboModal.hide();
                loadCombos();
                alert('Lưu combo thành công!');
            } else alert('Lỗi: ' + res.message);
        } catch (e) { alert('Lỗi máy chủ khi lưu combo.'); }
    }

    async function deleteCombo(id) {
        if (confirm('Xóa combo này?')) {
            const res = await api.delete(`/combos/${id}`);
            if (res.success) loadCombos();
        }
    }

    function previewImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const prev = document.getElementById('imagePreview');
                prev.src = e.target.result;
                prev.style.display = 'block';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
</body>
</html>
