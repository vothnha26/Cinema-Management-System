<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu – StarCinema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <style>
        :root {
          --bg: #080B14; --surface: #0F1320; --card: #161B2E; --border: #252A3D;
          --accent: #E5133A; --text: #E8EAF0; --text-muted: #7B82A0;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .reset-card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 40px; width: 100%; max-width: 450px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .brand { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; letter-spacing: 4px; text-align: center; margin-bottom: 30px; }
        .brand span { color: var(--accent); }
        .form-control-custom { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 12px 16px; margin-bottom: 20px; }
        .form-control-custom:focus { border-color: var(--accent); background: var(--surface); color: var(--text); box-shadow: none; }
        .btn-reset { background: linear-gradient(135deg, #E5133A, #8B0020); border: none; color: #fff; width: 100%; padding: 14px; border-radius: 12px; font-weight: 700; letter-spacing: 1px; transition: all 0.3s; }
        .btn-reset:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="reset-card">
    <div class="brand">STAR<span>CINEMA</span></div>
    <h4 class="text-center fw-bold mb-4">ĐẶT LẠI MẬT KHẨU</h4>
    <p class="text-center text-muted small mb-4">Vui lòng nhập mật khẩu mới cho tài khoản: <br><strong id="displayEmail" class="text-white">...</strong></p>
    
    <div id="resetForm">
        <label class="form-label small fw-bold text-muted">MẬT KHẨU MỚI</label>
        <input type="password" id="newPassword" class="form-control form-control-custom" placeholder="Nhập ít nhất 6 ký tự">
        
        <label class="form-label small fw-bold text-muted">XÁC NHẬN MẬT KHẨU</label>
        <input type="password" id="confirmPassword" class="form-control form-control-custom" placeholder="Nhập lại mật khẩu mới">
        
        <button class="btn-reset mt-2" onclick="handleReset()">XÁC NHẬN THAY ĐỔI</button>
    </div>

    <div id="successMsg" class="text-center d-none">
        <div class="display-1 text-success mb-3"><i class="bi bi-check-circle-fill"></i></div>
        <h5>Thành công!</h5>
        <p class="text-muted">Mật khẩu của bạn đã được cập nhật.</p>
        <a href="auth.html" class="btn btn-outline-light w-100 mt-3" style="border-radius: 12px;">ĐĂNG NHẬP NGAY</a>
    </div>
</div>

<script src="/js/api.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    document.addEventListener('DOMContentLoaded', () => {
        if (!token) {
            alert('Đường dẫn không hợp lệ hoặc đã hết hạn.');
            window.location.href = 'auth.html';
            return;
        }
        document.getElementById('displayEmail').textContent = "Xác thực qua Token";
    });

    async function handleReset() {
        const pass = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;

        if (pass.length < 6) return alert('Mật khẩu phải có ít nhất 6 ký tự!');
        if (pass !== confirm) return alert('Mật khẩu xác nhận không khớp!');

        try {
            // Gọi API reset password với Token
            const res = await api.post(`/auth/reset-password?token=${encodeURIComponent(token)}&newPassword=${encodeURIComponent(pass)}`, {});
            
            if (res.success) {
                document.getElementById('resetForm').classList.add('d-none');
                document.getElementById('successMsg').classList.remove('d-none');
            } else {
                alert('Lỗi: ' + res.message);
            }
        } catch (err) {
            alert('Đã có lỗi xảy ra hoặc Token đã hết hạn.');
        }
    }
</script>
</body>
</html>
