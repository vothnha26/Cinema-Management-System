<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Vé – StarCinema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
          --bg: #080B14; --surface: #0F1320; --card: #161B2E; --border: #252A3D;
          --accent: #E5133A; --accent-gold: #F5A623; --text: #E8EAF0; --text-muted: #7B82A0;
          --gradient: linear-gradient(135deg, #E5133A, #8B0020);
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; overflow-x: hidden; }
        
        /* ── MAIN CONTENT ── */
        .main-content { padding: 40px; min-height: 100vh; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; letter-spacing: 1px; margin: 0; }

        .toolbar { display: flex; gap: 16px; margin-bottom: 24px; }
        .search-box { position: relative; flex: 1; max-width: 400px; }
        .search-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-box input {
          width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text);
          padding: 10px 16px 10px 44px; border-radius: 12px; outline: none;
        }

        /* ── TICKET TABLE ── */
        .custom-table { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
        .table { margin: 0; color: var(--text); border-color: var(--border); }
        .table thead { background: var(--surface); }
        .table th { border: none; padding: 16px 24px; color: var(--text-muted); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; }
        .table td { border-top: 1px solid var(--border); padding: 16px 24px; vertical-align: middle; }
        
        .booking-code { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; color: var(--accent-gold); letter-spacing: 1px; }
        .status-badge { padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
        .status-pending { background: rgba(245,166,35,0.1); color: var(--accent-gold); }
        .status-confirmed { background: rgba(80,200,100,0.1); color: #50C864; }
        .status-checkedin { background: rgba(100,180,255,0.1); color: #64B4FF; }
        .status-cancelled { background: rgba(255,255,255,0.05); color: var(--text-muted); }

        .btn-checkin { background: var(--gradient); border: none; color: #fff; padding: 6px 16px; border-radius: 8px; font-weight: 600; font-size: 0.8rem; }
        .btn-checkin:disabled { opacity: 0.5; cursor: not-allowed; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    </style>
</head>
<body>

<aside class="sidebar"></aside>

<main class="main-content">
    <div class="header-section">
        <h1 class="page-title">Quản lý đặt vé</h1>
    </div>

    <div class="toolbar">
        <div class="search-box">
            <i class="bi bi-search"></i>
            <input type="text" id="searchInput" placeholder="Tìm theo mã vé hoặc SĐT khách hàng..." oninput="handleSearch(this.value)">
        </div>
        <button class="btn btn-outline-info" onclick="loadBookings()"><i class="bi bi-arrow-clockwise"></i> Làm mới</button>
    </div>

    <div class="custom-table">
        <table class="table">
            <thead>
                <tr>
                    <th>Mã đặt vé</th>
                    <th>Khách hàng</th>
                    <th>Phim & Suất chiếu</th>
                    <th>Ghế / Combo</th>
                    <th>Tổng tiền</th>
                    <th>Trạng thái</th>
                    <th class="text-end">Thao tác</th>
                </tr>
            </thead>
            <tbody id="bookingTableBody">
                <tr><td colspan="7" class="text-center py-5 text-muted">Đang tải danh sách vé...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/sidebar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let allBookings = [];

    document.addEventListener('DOMContentLoaded', loadBookings);

    async function loadBookings() {
        const res = await api.get('/admin/bookings');
        if (res.success) {
            allBookings = res.data;
            renderBookings(allBookings);
        } else {
            const resUser = await api.get('/bookings/my'); 
            if (resUser.success) {
                allBookings = resUser.data;
                renderBookings(allBookings);
            }
        }
    }

    function renderBookings(bookings) {
        const tbody = document.getElementById('bookingTableBody');
        if (!bookings || bookings.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">Không có dữ liệu đặt vé.</td></tr>';
            return;
        }

        tbody.innerHTML = bookings.map(b => `
            <tr>
                <td><span class="booking-code">${b.bookingCode}</span></td>
                <td>
                    <div class="fw-bold">${b.customerName || 'Khách vãng lai'}</div>
                    <div class="small text-muted">${b.customerPhone || ''}</div>
                </td>
                <td>
                    <div style="font-size:0.9rem; font-weight:600">${b.movieTitle}</div>
                    <div class="small text-muted">${new Date(b.showTime).toLocaleString('vi-VN')} | Phòng: ${b.roomName}</div>
                </td>
                <td>
                    <div class="small text-info">Ghế: ${(b.seatCodes || []).join(', ')}</div>
                    <div class="small text-muted">${(b.comboSummary || []).join(', ')}</div>
                </td>
                <td><div class="fw-bold text-accent-gold">${new Intl.NumberFormat('vi-VN').format(b.totalPrice)}đ</div></td>
                <td><span class="status-badge ${getStatusClass(b.status)}">${translateStatus(b.status)}</span></td>
                <td class="text-end">
                    ${b.status === 'CONFIRMED' ? 
                        `<button class="btn-checkin" onclick="checkIn('${b.bookingCode}')">SOÁT VÉ</button>` : 
                        `<button class="btn-checkin" disabled><i class="bi bi-check-all"></i> OK</button>`
                    }
                </td>
            </tr>
        `).join('');
    }

    function getStatusClass(s) {
        if (s === 'PENDING') return 'status-pending';
        if (s === 'CONFIRMED') return 'status-confirmed';
        if (s === 'CHECKED_IN') return 'status-checkedin';
        return 'status-cancelled';
    }

    function translateStatus(s) {
        const map = { 'PENDING': 'Chờ TT', 'CONFIRMED': 'Đã mua', 'CHECKED_IN': 'Đã vào', 'CANCELLED': 'Đã hủy' };
        return map[s] || s;
    }

    async function checkIn(code) {
        if (!confirm('Xác nhận khách đã vào phòng chiếu cho mã vé: ' + code)) return;
        const res = await api.post(`/bookings/check-in?bookingCode=${code}`, {});
        if (res.success) {
            alert('Soát vé thành công!');
            loadBookings();
        } else {
            alert('Lỗi: ' + res.message);
        }
    }

    function handleSearch(q) {
        const filtered = allBookings.filter(b => 
            b.bookingCode.toLowerCase().includes(q.toLowerCase()) || 
            (b.customerPhone && b.customerPhone.includes(q))
        );
        renderBookings(filtered);
    }
</script>
</body>
</html>
