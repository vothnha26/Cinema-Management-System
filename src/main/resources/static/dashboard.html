<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarCinema – Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
          --bg: #080B14; --surface: #0F1320; --card: #161B2E; --border: #252A3D;
          --accent: #E5133A; --accent-gold: #F5A623; --text: #E8EAF0; --text-muted: #7B82A0;
          --gradient: linear-gradient(135deg, #E5133A, #8B0020);
          --sidebar-width: 260px;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; overflow-x: hidden; }
        
        .sidebar {
          width: var(--sidebar-width); background: var(--surface); border-right: 1px solid var(--border);
          height: 100vh; position: fixed; top: 0; left: 0; z-index: 1000; padding: 24px;
          display: flex; flex-direction: column;
        }
        .brand { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 3px; color: var(--text); margin-bottom: 40px; text-decoration: none; display: block; }
        .brand span { color: var(--accent); }
        .nav-menu { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
        .nav-item { margin-bottom: 8px; }
        .nav-link-admin {
          display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text-muted);
          text-decoration: none; border-radius: 10px; transition: all 0.2s; font-weight: 500;
        }
        .nav-link-admin:hover, .nav-link-admin.active { background: rgba(229,19,58,0.1); color: var(--accent); }
        .nav-link-admin.active { background: var(--gradient); color: #fff; }

        .user-panel { border-top: 1px solid var(--border); padding-top: 20px; margin-top: 20px; }
        .admin-profile { display: flex; align-items: center; gap: 12px; }
        .admin-avatar { width: 40px; height: 40px; border-radius: 10px; background: var(--gradient); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; }

        .main-content { margin-left: var(--sidebar-width); padding: 40px; min-height: 100vh; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; letter-spacing: 1px; margin: 0; }

        .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; transition: transform 0.3s; height: 100%; }
        .stat-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .stat-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 16px; }
        .icon-1 { background: rgba(80,200,100,0.1); color: #50C864; }
        .icon-2 { background: rgba(100,180,255,0.1); color: #64B4FF; }
        .icon-3 { background: rgba(245,166,35,0.1); color: var(--accent-gold); }
        .icon-4 { background: rgba(229,19,58,0.1); color: var(--accent); }
        
        .stat-value { font-size: 1.8rem; font-weight: 700; margin-bottom: 4px; }
        .stat-label { color: var(--text-muted); font-size: 0.9rem; }

        .chart-container { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 30px; }
        .chart-title { font-weight: 600; font-size: 1.1rem; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }

        .custom-table { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
        .table { margin: 0; color: var(--text); border-color: var(--border); }
        .table thead { background: var(--surface); }
        .table th { border: none; padding: 16px 24px; color: var(--text-muted); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; }
        .table td { border-top: 1px solid var(--border); padding: 16px 24px; vertical-align: middle; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    </style>
</head>
<body>

<aside class="sidebar">
    <!-- Rendered by sidebar.js -->
</aside>

<main class="main-content">
    <div class="header-section">
        <div>
            <h1 class="page-title" id="dashboardTitle">Dashboard</h1>
            <p class="text-muted m-0" id="dashboardSubtitle">Chào mừng trở lại hệ thống quản trị.</p>
        </div>
        <div class="text-end">
            <div style="font-size:0.8rem;color:var(--text-muted)">Hôm nay</div>
            <div style="font-weight:600" id="currentDate">--/--/----</div>
        </div>
    </div>

    <!-- STATS ROW (Dàn hàng ngang) -->
    <div class="row g-4 mb-5" id="statsRow">
        <!-- Will be populated by JS based on role -->
    </div>

    <!-- CHARTS ROW -->
    <div class="row g-4 mb-5">
        <div class="col-lg-8">
            <div class="chart-container">
                <div class="chart-title" id="mainChartTitle"><i class="bi bi-graph-up text-accent"></i> Hoạt động hệ thống</div>
                <div style="height: 300px;"><canvas id="mainChart"></canvas></div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="chart-container">
                <div class="chart-title" id="subChartTitle"><i class="bi bi-pie-chart text-warning"></i> Phân bổ dữ liệu</div>
                <div style="height:300px;"><canvas id="subChart"></canvas></div>
            </div>
        </div>
    </div>

    <!-- LIST ROW -->
    <div class="chart-title mb-3" id="listTitle"><i class="bi bi-clock-history text-primary"></i> Hoạt động gần đây</div>
    <div class="custom-table">
        <table class="table">
            <thead id="tableHead">
                <!-- Header dynamic -->
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="6" class="text-center py-4 text-muted">Đang tải dữ liệu...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<script src="/js/auth-guard.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/api.js"></script>
<script>
    const role = localStorage.getItem('cinemaRole');

    document.addEventListener('DOMContentLoaded', () => {
        if (!AuthGuard.requireRole(['ADMIN', 'MANAGER'])) return;

        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('vi-VN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        
        setupDashboardByRole();
    });

    function setupDashboardByRole() {
        const statsRow = document.getElementById('statsRow');
        const title = document.getElementById('dashboardTitle');
        const subtitle = document.getElementById('dashboardSubtitle');

        if (role === 'MANAGER') {
            title.innerHTML = 'QUẢN LÝ <span>NGHIỆP VỤ</span>';
            subtitle.textContent = 'Thống kê doanh thu và vận hành rạp chiếu phim.';
            
            statsRow.innerHTML = `
                <div class="col-md-3"><div class="stat-card"><div class="stat-icon icon-1"><i class="bi bi-currency-dollar"></i></div><div class="stat-value" id="val1">0đ</div><div class="stat-label">Doanh thu hôm nay</div></div></div>
                <div class="col-md-3"><div class="stat-card"><div class="stat-icon icon-2"><i class="bi bi-ticket-detailed"></i></div><div class="stat-value" id="val2">0</div><div class="stat-label">Vé đã bán</div></div></div>
                <div class="col-md-3"><div class="stat-card"><div class="stat-icon icon-3"><i class="bi bi-play-btn"></i></div><div class="stat-value" id="val3">0</div><div class="stat-label">Phim đang chiếu</div></div></div>
                <div class="col-md-3"><div class="stat-card"><div class="stat-icon icon-4"><i class="bi bi-calendar-check"></i></div><div class="stat-value" id="val4">0</div><div class="stat-label">Suất chiếu sắp tới</div></div></div>
            `;
            
            document.getElementById('mainChartTitle').innerHTML = '<i class="bi bi-graph-up text-accent"></i> Doanh thu 7 ngày qua';
            document.getElementById('subChartTitle').innerHTML = '<i class="bi bi-pie-chart text-warning"></i> Tỷ trọng doanh thu phim';
            document.getElementById('listTitle').innerHTML = '<i class="bi bi-clock-history text-primary"></i> Giao dịch vé mới nhất';
            
            document.getElementById('tableHead').innerHTML = `
                <tr><th>Mã đơn</th><th>Phim</th><th>Suất chiếu</th><th>Giá trị</th><th>Trạng thái</th></tr>
            `;
            
            loadManagerData();
        } 
        else if (role === 'ADMIN') {
            title.innerHTML = 'QUẢN TRỊ <span>HỆ THỐNG</span>';
            subtitle.textContent = 'Quản lý người dùng, phân quyền và giám sát bảo mật.';
            
            statsRow.innerHTML = `
                <div class="col-md-3"><div class="stat-card"><div class="stat-icon icon-1"><i class="bi bi-people"></i></div><div class="stat-value" id="val1">0</div><div class="stat-label">Tổng người dùng</div></div></div>
                <div class="col-md-3"><div class="stat-card"><div class="stat-icon icon-2"><i class="bi bi-person-badge"></i></div><div class="stat-value" id="val2">0</div><div class="stat-label">Nhân viên & Quản lý</div></div></div>
                <div class="col-md-3"><div class="stat-card"><div class="stat-icon icon-3"><i class="bi bi-person-plus"></i></div><div class="stat-value" id="val3">0</div><div class="stat-label">Đăng ký mới (tháng)</div></div></div>
                <div class="col-md-3"><div class="stat-card"><div class="stat-icon icon-4"><i class="bi bi-shield-lock"></i></div><div class="stat-value" id="val4">0</div><div class="stat-label">Cảnh báo hệ thống</div></div></div>
            `;

            document.getElementById('mainChartTitle').innerHTML = '<i class="bi bi-activity text-info"></i> Lượt truy cập hệ thống';
            document.getElementById('subChartTitle').innerHTML = '<i class="bi bi-pie-chart text-success"></i> Phân bổ vai trò người dùng';
            document.getElementById('listTitle').innerHTML = '<i class="bi bi-shield-check text-warning"></i> Nhật ký truy cập (Audit Logs)';
            
            document.getElementById('tableHead').innerHTML = `
                <tr><th>Thời gian</th><th>Người dùng</th><th>Hành động</th><th>Đối tượng</th><th>Kết quả</th></tr>
            `;
            
            loadAdminData();
        }
    }

    async function loadManagerData() {
        try {
            const res = await api.get('/statistics/summary');
            if (res.success) {
                const d = res.data;
                document.getElementById('val1').textContent = new Intl.NumberFormat('vi-VN').format(d.todayRevenue) + 'đ';
                document.getElementById('val2').textContent = d.todayTickets;
                document.getElementById('val3').textContent = d.showingMovies;
                document.getElementById('val4').textContent = d.upcomingShowtimes || 0;
            }
            initCharts('manager');
            loadRecentBookings();
        } catch (e) { console.error(e); }
    }

    async function loadAdminData() {
        try {
            // Giả lập API cho Admin (sau này bạn thay bằng API thật)
            document.getElementById('val1').textContent = '1,240';
            document.getElementById('val2').textContent = '45';
            document.getElementById('val3').textContent = '12';
            document.getElementById('val4').textContent = '0';
            
            initCharts('admin');
            loadAuditLogs();
        } catch (e) { console.error(e); }
    }

    async function loadRecentBookings() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">Dữ liệu mẫu cho Manager...</td></tr>';
    }

    async function loadAuditLogs() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">Dữ liệu mẫu cho Admin...</td></tr>';
    }

    function initCharts(roleType) {
        const mainCtx = document.getElementById('mainChart').getContext('2d');
        const subCtx = document.getElementById('subChart').getContext('2d');

        if (roleType === 'manager') {
            new Chart(mainCtx, {
                type: 'line',
                data: { labels: ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'], datasets: [{ label: 'Doanh thu', data: [12, 19, 3, 5, 2, 3, 10], borderColor: '#E5133A', fill: true, tension: 0.4 }] }
            });
            new Chart(subCtx, {
                type: 'doughnut',
                data: { labels: ['Hành động', 'Hài', 'Kinh dị'], datasets: [{ data: [40, 30, 30], backgroundColor: ['#E5133A', '#F5A623', '#64C8FF'] }] }
            });
        } else {
            new Chart(mainCtx, {
                type: 'bar',
                data: { labels: ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'], datasets: [{ label: 'Lượt truy cập', data: [100, 120, 90, 150, 200, 300, 250], backgroundColor: '#64C8FF' }] }
            });
            new Chart(subCtx, {
                type: 'pie',
                data: { labels: ['Khách hàng', 'Staff', 'Manager'], datasets: [{ data: [80, 15, 5], backgroundColor: ['#50C864', '#F5A623', '#E5133A'] }] }
            });
        }
    }
</script>
</body>
</html>
