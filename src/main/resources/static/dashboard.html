<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng điều khiển Manager | StarCinema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
          --bg: #080B14; --surface: #0F121F; --card: #161B2E; --border: #252A3D;
          --accent: #E5133A; --text: #E8EAF0; --text-muted: #7B82A0;
          --sidebar-w: 260px;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        aside { width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 30px; border-bottom: 1px solid var(--border); }
        .sidebar-header h2 { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.5rem; margin: 0; color: #fff; letter-spacing: 1px; }
        .sidebar-header h2 span { color: var(--accent); }
        .sidebar-menu { list-style: none; padding: 20px 0; margin: 0; flex: 1; }
        .nav-link-admin { display: flex; align-items: center; gap: 12px; padding: 12px 30px; color: var(--text-muted); text-decoration: none; transition: 0.2s; font-size: 0.95rem; }
        .nav-link-admin:hover, .nav-link-admin.active { color: #fff; background: rgba(229,19,58,0.1); border-left: 4px solid var(--accent); }
        .nav-link-admin.active { color: #fff; background: linear-gradient(90deg, rgba(229,19,58,0.1) 0%, transparent 100%); }

        main { flex: 1; overflow-y: auto; padding: 40px; }
        .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; height: 100%; transition: 0.3s; }
        .stat-card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .stat-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 16px; }
        .stat-value { font-size: 1.8rem; font-weight: 800; color: #fff; margin-bottom: 4px; }
        .stat-label { color: var(--text-muted); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        .chart-container { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 30px; margin-top: 30px; }
        .chart-title { font-weight: 700; color: #fff; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
        
        .filter-bar { background: var(--surface); border: 1px solid var(--border); padding: 15px 25px; border-radius: 16px; margin-bottom: 30px; display: flex; align-items: center; justify-content: space-between; }
        .form-control-dark { background: #080a14; border: 1px solid var(--border); color: #fff; border-radius: 10px; }
    </style>
</head>
<body>

<aside>
    <div class="sidebar-header"><h2>STAR<span>CINEMA</span></h2></div>
    <ul class="sidebar-menu" id="dynamicSidebar"></ul>
</aside>

<main>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-800 m-0">BÁO CÁO CHIẾN LƯỢC</h2>
            <p class="text-muted m-0">Tổng hợp dữ liệu kinh doanh rạp phim</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-danger" onclick="loadStats()"><i class="bi bi-arrow-clockwise me-2"></i>LÀM MỚI</button>
            <button class="btn btn-danger" onclick="window.print()"><i class="bi bi-download me-2"></i>XUẤT BÁO CÁO</button>
        </div>
    </div>

    <div class="filter-bar">
        <div class="d-flex align-items-center gap-3">
            <div class="d-flex align-items-center gap-2">
                <label class="small fw-bold text-muted">TỪ:</label>
                <input type="date" id="startDate" class="form-control form-control-sm form-control-dark">
            </div>
            <div class="d-flex align-items-center gap-2">
                <label class="small fw-bold text-muted">ĐẾN:</label>
                <input type="date" id="endDate" class="form-control form-control-sm form-control-dark">
            </div>
            <button class="btn btn-sm btn-danger px-3 fw-bold" onclick="loadStats()">LỌC DỮ LIỆU</button>
        </div>
        <div class="text-muted small fw-bold"><i class="bi bi-clock-history me-1"></i> Cập nhật lúc: <span id="lastUpdate">--:--</span></div>
    </div>

    <div class="row g-4">
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon bg-primary bg-opacity-10 text-primary"><i class="bi bi-currency-dollar"></i></div>
                <div class="stat-value" id="totalRevenue">0đ</div>
                <div class="stat-label">Tổng doanh thu</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon bg-success bg-opacity-10 text-success"><i class="bi bi-ticket-perforated"></i></div>
                <div class="stat-value" id="totalTickets">0</div>
                <div class="stat-label">Vé đã bán</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon bg-warning bg-opacity-10 text-warning"><i class="bi bi-people"></i></div>
                <div class="stat-value" id="newCustomers">0</div>
                <div class="stat-label">Khách hàng mới</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon bg-info bg-opacity-10 text-info"><i class="bi bi-percent"></i></div>
                <div class="stat-value" id="occupancyRate">0%</div>
                <div class="stat-label">Tỷ lệ lấp đầy</div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <div class="chart-container">
                <div class="chart-title"><i class="bi bi-graph-up text-danger"></i>BIỂU ĐỒ DOANH THU THEO NGÀY</div>
                <canvas id="revenueChart" height="300"></canvas>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="chart-container">
                <div class="chart-title"><i class="bi bi-pie-chart text-warning"></i>TỶ TRỌNG THEO PHIM</div>
                <canvas id="movieChart" height="300"></canvas>
            </div>
        </div>
        <div class="col-lg-12">
            <div class="chart-container">
                <div class="chart-title"><i class="bi bi-clock text-info"></i>PHÂN BỔ DOANH THU THEO GIỜ TRONG NGÀY</div>
                <canvas id="hourChart" height="200"></canvas>
            </div>
        </div>
    </div>
</main>

<script src="/js/auth-guard.js"></script>
<script>AuthGuard.requireRole(['ADMIN', 'MANAGER']);</script>
<script src="/js/sidebar.js"></script>
<script src="/js/api.js"></script>
<script>
    let revenueChart, movieChart, hourChart;

    async function init() {
        // Sidebar được tự động render bởi sidebar.js
        
        // Mặc định lọc 7 ngày gần nhất
        const now = new Date();
        const weekAgo = new Date();
        weekAgo.setDate(now.getDate() - 7);
        
        document.getElementById('startDate').value = weekAgo.toISOString().split('T')[0];
        document.getElementById('endDate').value = now.toISOString().split('T')[0];
        
        loadStats();
    }

    async function loadStats() {
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        
        try {
            const res = await api.get(`/statistics/overview?startDate=${start}&endDate=${end}`);
            if (res.success) {
                const data = res.data;
                updateOverview(data);
                updateCharts(data);
                document.getElementById('lastUpdate').innerText = new Date().toLocaleTimeString();
            }
        } catch (e) { console.error(e); }
    }

    function updateOverview(data) {
        document.getElementById('totalRevenue').innerText = data.totalRevenue.toLocaleString() + 'đ';
        document.getElementById('totalTickets').innerText = data.totalTicketsSold.toLocaleString();
        document.getElementById('newCustomers').innerText = data.newCustomersCount.toLocaleString();
        document.getElementById('occupancyRate').innerText = data.averageOccupancyRate + '%';
    }

    function updateCharts(data) {
        // 1. Revenue Chart (Line)
        const revCtx = document.getElementById('revenueChart').getContext('2d');
        if (revenueChart) revenueChart.destroy();
        revenueChart = new Chart(revCtx, {
            type: 'line',
            data: {
                labels: Object.keys(data.revenueByDay),
                datasets: [{
                    label: 'Doanh thu (VNĐ)',
                    data: Object.values(data.revenueByDay),
                    borderColor: '#E5133A',
                    backgroundColor: 'rgba(229, 19, 58, 0.1)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 5,
                    pointBackgroundColor: '#E5133A'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#7B82A0' } },
                    x: { grid: { display: false }, ticks: { color: '#7B82A0' } }
                }
            }
        });

        // 2. Movie Chart (Doughnut)
        const movieCtx = document.getElementById('movieChart').getContext('2d');
        if (movieChart) movieChart.destroy();
        movieChart = new Chart(movieCtx, {
            type: 'doughnut',
            data: {
                labels: Object.keys(data.revenueByMovie),
                datasets: [{
                    data: Object.values(data.revenueByMovie),
                    backgroundColor: ['#E5133A', '#F5A623', '#3B82F6', '#10B981', '#9B59B6', '#6366F1'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom', labels: { color: '#7B82A0', padding: 20 } } }
            }
        });

        // 3. Hour Chart (Bar)
        const hourCtx = document.getElementById('hourChart').getContext('2d');
        if (hourChart) hourChart.destroy();
        hourChart = new Chart(hourCtx, {
            type: 'bar',
            data: {
                labels: Object.keys(data.revenueByHour).map(h => h + ':00'),
                datasets: [{
                    label: 'Doanh thu',
                    data: Object.values(data.revenueByHour),
                    backgroundColor: 'rgba(59, 130, 246, 0.5)',
                    borderRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { display: false },
                    x: { grid: { display: false }, ticks: { color: '#7B82A0' } }
                }
            }
        });
    }

    init();
</script>
</body>
</html>
