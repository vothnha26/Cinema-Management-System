<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarCinema – Dashboard Quản Lý</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
          --bg: #080B14; --surface: #0F1320; --card: #161B2E; --border: #252A3D;
          --accent: #E5133A; --accent-gold: #F5A623; --text: #E8EAF0; --text-muted: #7B82A0;
          --gradient: linear-gradient(135deg, #E5133A, #8B0020);
          --sidebar-width: 260px;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; overflow-x: hidden; }
        
        /* ── SIDEBAR ── */
        .sidebar {
          width: var(--sidebar-width);
          background: var(--surface);
          border-right: 1px solid var(--border);
          height: 100vh;
          position: fixed;
          top: 0; left: 0;
          z-index: 1000;
          padding: 24px;
          display: flex;
          flex-direction: column;
        }
        .brand {
          font-family: 'Bebas Neue', sans-serif;
          font-size: 1.8rem;
          letter-spacing: 3px;
          color: var(--text);
          margin-bottom: 40px;
          text-decoration: none;
          display: block;
        }
        .brand span { color: var(--accent); }
        
        .nav-menu { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
        .nav-item { margin-bottom: 8px; }
        .nav-link-admin {
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 12px 16px;
          color: var(--text-muted);
          text-decoration: none;
          border-radius: 10px;
          transition: all 0.2s;
          font-weight: 500;
        }
        .nav-link-admin i { font-size: 1.2rem; }
        .nav-link-admin:hover, .nav-link-admin.active {
          background: rgba(229,19,58,0.1);
          color: var(--accent);
        }
        .nav-link-admin.active {
          background: var(--gradient);
          color: #fff;
        }

        .user-panel {
          border-top: 1px solid var(--border);
          padding-top: 20px;
          margin-top: 20px;
        }
        .admin-profile {
          display: flex;
          align-items: center;
          gap: 12px;
        }
        .admin-avatar {
          width: 40px; height: 40px; border-radius: 10px;
          background: var(--gradient);
          display: flex; align-items: center; justify-content: center;
          font-weight: 700; color: #fff;
        }

        /* ── MAIN CONTENT ── */
        .main-content {
          margin-left: var(--sidebar-width);
          padding: 40px;
          min-height: 100vh;
        }
        
        .header-section {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 32px;
        }
        .page-title {
          font-family: 'Bebas Neue', sans-serif;
          font-size: 2.5rem;
          letter-spacing: 1px;
          margin: 0;
        }

        /* ── CARDS ── */
        .stat-card {
          background: var(--card);
          border: 1px solid var(--border);
          border-radius: 16px;
          padding: 24px;
          transition: transform 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .stat-icon {
          width: 48px; height: 48px; border-radius: 12px;
          display: flex; align-items: center; justify-content: center;
          font-size: 1.5rem; margin-bottom: 16px;
        }
        .icon-revenue { background: rgba(80,200,100,0.1); color: #50C864; }
        .icon-tickets { background: rgba(100,180,255,0.1); color: #64B4FF; }
        .icon-movies { background: rgba(245,166,35,0.1); color: var(--accent-gold); }
        .icon-members { background: rgba(229,19,58,0.1); color: var(--accent); }
        
        .stat-value { font-size: 1.8rem; font-weight: 700; margin-bottom: 4px; }
        .stat-label { color: var(--text-muted); font-size: 0.9rem; }
        .stat-trend { font-size: 0.8rem; font-weight: 600; margin-left: 8px; }
        .trend-up { color: #50C864; }
        .trend-down { color: var(--accent); }

        /* ── CHART CONTAINER ── */
        .chart-container {
          background: var(--card);
          border: 1px solid var(--border);
          border-radius: 16px;
          padding: 24px;
          height: 100%;
        }
        .chart-title {
          font-weight: 600;
          font-size: 1.1rem;
          margin-bottom: 24px;
          display: flex;
          align-items: center;
          gap: 10px;
        }

        /* ── TABLE ── */
        .custom-table {
          background: var(--card);
          border: 1px solid var(--border);
          border-radius: 16px;
          overflow: hidden;
        }
        .table { margin: 0; color: var(--text); border-color: var(--border); }
        .table thead { background: var(--surface); }
        .table th {
          border: none; padding: 16px 24px;
          color: var(--text-muted); font-weight: 600; font-size: 0.85rem; text-transform: uppercase;
        }
        .table td { border-top: 1px solid var(--border); padding: 16px 24px; vertical-align: middle; }
        
        .status-pill {
          padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600;
        }
        .status-success { background: rgba(80,200,100,0.1); color: #50C864; }
        .status-pending { background: rgba(245,166,35,0.1); color: var(--accent-gold); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
    <a href="index.html" class="brand">STAR<span>CINEMA</span></a>
    
    <ul class="nav-menu">
        <li class="nav-item">
            <a href="dashboard.html" class="nav-link-admin active">
                <i class="bi bi-grid-1x2-fill"></i> Bảng điều khiển
            </a>
        </li>
        <li class="nav-item">
            <a href="manage-movies.html" class="nav-link-admin">
                <i class="bi bi-film"></i> Quản lý phim
            </a>
        </li>
        <li class="nav-item">
            <a href="manage-showtimes.html" class="nav-link-admin">
                <i class="bi bi-calendar-event"></i> Suất chiếu
            </a>
        </li>
        <li class="nav-item">
            <a href="manage-combos.html" class="nav-link-admin">
                <i class="bi bi-cup-straw"></i> Combo & F&B
            </a>
        </li>
        <li class="nav-item">
            <a href="manage-pricing.html" class="nav-link-admin">
                <i class="bi bi-tags"></i> Bảng giá
            </a>
        </li>
        <li class="nav-item">
            <a href="manage-promotions.html" class="nav-link-admin">
                <i class="bi bi-percent"></i> Khuyến mãi
            </a>
        </li>
    </ul>

    <div class="user-panel">
        <div class="admin-profile">
            <div class="admin-avatar">AD</div>
            <div>
                <div style="font-size:0.9rem;font-weight:600">Admin User</div>
                <div style="font-size:0.75rem;color:var(--text-muted)">Quản trị viên</div>
            </div>
            <a href="#" class="ms-auto text-muted"><i class="bi bi-box-arrow-right"></i></a>
        </div>
    </div>
</aside>

<!-- MAIN CONTENT -->
<main class="main-content">
    
    <div class="header-section">
        <h1 class="page-title">Dashboard</h1>
        <div class="d-flex gap-3">
            <button class="btn btn-outline-light border-secondary px-3 py-2" style="font-size:0.9rem; border-radius:10px">
                <i class="bi bi-download me-2"></i> Xuất báo cáo
            </button>
            <div class="text-end">
                <div style="font-size:0.8rem;color:var(--text-muted)">Hôm nay</div>
                <div style="font-weight:600" id="currentDate">...</div>
            </div>
        </div>
    </div>

    <!-- STATS CARDS -->
    <div class="row g-4 mb-5">
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon icon-revenue"><i class="bi bi-currency-dollar"></i></div>
                <div class="stat-value">0.0M <span class="stat-trend trend-up">↑</span></div>
                <div class="stat-label">Tổng doanh thu</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon icon-tickets"><i class="bi bi-ticket-detailed"></i></div>
                <div class="stat-value">0 <span class="stat-trend trend-up">↑</span></div>
                <div class="stat-label">Vé đã bán</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon icon-movies"><i class="bi bi-play-btn"></i></div>
                <div class="stat-value">12</div>
                <div class="stat-label">Phim đang chiếu</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon icon-members">...</div>
                <div class="stat-value">0%</div>
                <div class="stat-label">...</div>
            </div>
        </div>
    </div>

    <div class="row g-4 mb-5">
        <!-- REVENUE CHART -->
        <div class="col-lg-8">
            <div class="chart-container">
                <div class="chart-title"><i class="bi bi-graph-up text-accent"></i> Doanh thu 7 ngày qua</div>
                <canvas id="revenueChart" height="300"></canvas>
            </div>
        </div>
        <!-- MOVIE CHART -->
        <div class="col-lg-4">
            <div class="chart-container">
                <div class="chart-title"><i class="bi bi-pie-chart text-warning"></i> Doanh thu theo phim</div>
                <div style="height:300px; display:flex; align-items:center; justify-content:center">
                    <canvas id="genreChart"></canvas>
                </div>
            </div>
        </div>
    </div>

</main>

<script src="/js/api.js"></script>
<script>
    // Set current date
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('currentDate').textContent = new Date().toLocaleDateString('vi-VN', options);

    document.addEventListener('DOMContentLoaded', () => {
        loadDashboardData();
    });

    async function loadDashboardData() {
        const response = await api.get('/statistics/overview');
        if (response.success) {
            const data = response.data;
            updateStats(data);
            renderRevenueChart(data.revenueByDay);
            renderMovieChart(data.revenueByMovie);
        }
    }

    function updateStats(data) {
        const revValue = document.querySelector('.stat-card .icon-revenue').parentElement.querySelector('.stat-value');
        revValue.innerHTML = `${(data.totalRevenue / 1000000).toFixed(1)}M <span class="stat-trend trend-up">↑</span>`;
        
        const ticketValue = document.querySelector('.stat-card .icon-tickets').parentElement.querySelector('.stat-value');
        ticketValue.innerHTML = `${data.totalTicketsSold.toLocaleString()} <span class="stat-trend trend-up">↑</span>`;

        const rateCard = document.querySelector('.stat-card .icon-members').parentElement;
        rateCard.querySelector('.stat-icon').innerHTML = '<i class="bi bi-percent"></i>';
        rateCard.querySelector('.stat-label').textContent = 'Tỷ lệ lấp đầy ghế';
        rateCard.querySelector('.stat-value').innerHTML = `${data.averageOccupancyRate}%`;
    }

    function renderRevenueChart(dailyMap) {
        const sortedDays = Object.keys(dailyMap).sort();
        const labels = sortedDays.map(day => day.split('-').slice(1).reverse().join('/'));
        const values = sortedDays.map(day => dailyMap[day] / 1000);

        const revCtx = document.getElementById('revenueChart').getContext('2d');
        if (window.myRevenueChart) window.myRevenueChart.destroy();
        
        window.myRevenueChart = new Chart(revCtx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Doanh thu (k VNĐ)',
                    data: values,
                    borderColor: '#E5133A',
                    backgroundColor: 'rgba(229,19,58,0.1)',
                    fill: true,
                    tension: 0.4,
                    pointBackgroundColor: '#E5133A',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 2,
                    pointRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: '#252A3D' },
                        ticks: { color: '#7B82A0', font: { family: 'Outfit' } }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { color: '#7B82A0', font: { family: 'Outfit' } }
                    }
                }
            }
        });
    }

    function renderMovieChart(movieMap) {
        const labels = Object.keys(movieMap);
        const values = Object.values(movieMap);

        const genCtx = document.getElementById('genreChart').getContext('2d');
        if (window.myMovieChart) window.myMovieChart.destroy();

        window.myMovieChart = new Chart(genCtx, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    data: values,
                    backgroundColor: ['#E5133A', '#F5A623', '#64C8FF', '#50C864', '#9C27B0'],
                    borderWidth: 0,
                    hoverOffset: 10
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { color: '#E8EAF0', font: { family: 'Outfit', size: 11 }, padding: 15, usePointStyle: true }
                    }
                },
                cutout: '70%'
            }
        });
    }
</script>
</body>
</html>
