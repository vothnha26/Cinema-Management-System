<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Suất chiếu – StarCinema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
  <style>
    :root {
      --bg: #080B14; --surface: #0F1320; --card: #161B2E; --border: #252A3D;
      --accent: #E5133A; --accent-gold: #F5A623; --text: #E8EAF0; --text-muted: #7B82A0;
      --gradient: linear-gradient(135deg, #E5133A, #8B0020);
      --sidebar-width: 260px;
      --success: #10B981;
    }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; overflow-x: hidden; }
    .sidebar { width: var(--sidebar-width); background: var(--surface); border-right: 1px solid var(--border); height: 100vh; position: fixed; top: 0; left: 0; z-index: 1000; padding: 24px; display: flex; flex-direction: column; }
    .main-content { margin-left: var(--sidebar-width); padding: 40px; min-height: 100vh; }
    .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
    .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; letter-spacing: 1px; margin: 0; }

    /* ── SCHEDULER LAYOUT ── */
    .scheduler-container { display: grid; grid-template-columns: 300px 1fr; gap: 30px; }
    .movie-selection-list { display: flex; flex-direction: column; gap: 15px; height: calc(100vh - 250px); overflow-y: auto; padding-right: 10px; }
    .movie-card-sm { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; cursor: pointer; transition: 0.2s; display: flex; gap: 12px; }
    .movie-card-sm:hover { border-color: var(--accent); transform: translateX(5px); }
    .movie-poster-xs { width: 50px; height: 75px; border-radius: 6px; object-fit: cover; background: var(--surface); flex-shrink: 0; }
    .movie-name-sm { font-weight: 700; font-size: 0.85rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── TIME GRID ── */
    .timeline-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 25px; }
    .room-row { margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
    .room-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .room-name { font-weight: 700; font-size: 1.1rem; color: #fff; }
    .room-type-tag { font-size: 0.7rem; background: rgba(255,255,255,0.05); padding: 2px 8px; border-radius: 4px; color: var(--text-muted); border: 1px solid var(--border); }

    .showtimes-flex { display: flex; flex-wrap: wrap; gap: 12px; }
    .showtime-block { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; min-width: 160px; position: relative; overflow: hidden; transition: 0.2s; }
    .showtime-movie { font-size: 0.8rem; font-weight: 700; display: block; margin-bottom: 4px; color: #fff; }
    .showtime-time { font-size: 0.9rem; font-weight: 800; color: var(--accent-gold); }

    .showtime-block.ai-draft { border: 1.5px dashed var(--accent); background: rgba(229,19,58,0.03); }
    .ai-badge { position: absolute; top: 0; right: 0; background: var(--accent); color: #fff; font-size: 0.55rem; padding: 2px 6px; border-radius: 0 0 0 8px; font-weight: 800; text-transform: uppercase; }

    .tool-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 15px 25px; margin-bottom: 30px; }
    .btn-ai { background: var(--gradient); border: none; color: #fff; padding: 10px 24px; border-radius: 10px; font-weight: 700; display: flex; align-items: center; gap: 10px; }

    .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 20px; color: var(--text); }
    .rule-item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 10px; position: relative; }
    
    /* TOAST */
    .toast-star { position: fixed; bottom: 30px; right: 30px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 24px; display: flex; align-items: center; gap: 12px; z-index: 2000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  </style>
</head>
<body>

<aside class="sidebar">
    <a href="index.html" class="brand">STAR<span>CINEMA</span></a>
    <ul class="nav-menu list-unstyled" id="dynamicSidebar"></ul>
    <div class="mt-auto">
        <button class="btn btn-sm btn-outline-secondary w-100" onclick="AuthGuard.logout()">Đăng xuất</button>
    </div>
</aside>

<main class="main-content">
  <div class="header-section">
    <div>
      <h1 class="page-title">AI STRATEGIC COMMANDER</h1>
      <p class="text-muted m-0">Quản lý suất chiếu và Tự động hóa lịch trình bằng AI</p>
    </div>
    <div class="d-flex gap-3">
      <button class="btn btn-outline-light px-4" style="border-radius:10px" data-bs-toggle="modal" data-bs-target="#stModal"><i class="bi bi-plus-lg me-2"></i>THỦ CÔNG</button>
      <button class="btn-ai" onclick="openAIConfig()"><i class="bi bi-robot"></i> ĐIỀU PHỐI AI</button>
    </div>
  </div>

  <div class="tool-bar">
    <div class="d-flex align-items-center gap-3">
      <div class="fw-bold">Ngày chiếu:</div>
      <input type="date" id="filterDate" class="form-control bg-dark text-white border-0 py-1" style="width:180px" onchange="loadShowtimes()">
    </div>
    <div id="aiActions" class="d-none">
      <button class="btn btn-sm btn-success px-3 me-2" onclick="saveAI()">CHẤP NHẬN LỊCH AI</button>
      <button class="btn btn-sm btn-outline-danger px-3" onclick="loadShowtimes()">HỦY BỎ</button>
    </div>
  </div>

  <div class="scheduler-container">
    <div>
      <div class="section-title mb-3" style="font-size: 1.2rem">Phim đang chiếu</div>
      <div class="movie-selection-list" id="movieList"></div>
    </div>
    <div class="timeline-wrap">
      <div id="roomTimeline"></div>
    </div>
  </div>
</main>

<div id="toastContainer"></div>

<!-- AI CONFIG MODAL -->
<div class="modal fade" id="aiModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title fw-bold"><i class="bi bi-cpu me-2"></i>CẤU HÌNH CHIẾN LƯỢC AI</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
      <div class="modal-body p-4">
        <div class="row g-4">
          <div class="col-md-4 border-end border-secondary">
            <label class="form-label small fw-bold text-muted text-uppercase">1. Mục tiêu vận hành</label>
            <select id="aiStrategy" class="form-select mb-4 bg-dark text-white border-secondary">
                <option value="BALANCED">Cân bằng (Đều các phim)</option>
                <option value="REVENUE" selected>Tối ưu doanh thu (Phim hot nhiều suất)</option>
                <option value="FAMILY">Ưu tiên phim Gia đình/Trẻ em</option>
                <option value="LATE_NIGHT">Ưu tiên suất chiếu muộn (Kinh dị/Hành động)</option>
            </select>
            
            <label class="form-label small fw-bold text-muted text-uppercase">2. Tỷ lệ lấp đầy mục tiêu</label>
            <div class="d-flex justify-content-between"><span class="small">Thấp</span><span id="ratioVal" class="fw-bold text-info">70%</span><span class="small">Cao</span></div>
            <input type="range" id="aiRatio" class="form-range mb-4" min="30" max="95" step="5" value="70" oninput="ratioVal.innerText=this.value+'%'">
            
            <label class="form-label small fw-bold text-muted text-uppercase">3. Chế độ áp dụng</label>
            <select id="aiMode" class="form-select bg-dark text-white border-secondary">
                <option value="OVERWRITE">Ghi đè hoàn toàn lịch cũ</option>
                <option value="FILL">Lấp đầy chỗ trống (Giữ lịch cũ)</option>
            </select>
          </div>
          
          <div class="col-md-8">
            <label class="form-label small fw-bold text-muted text-uppercase">4. Quy tắc ưu tiên theo Nhóm/Thể loại</label>
            <div id="ruleContainer" class="mb-3" style="max-height: 350px; overflow-y: auto;"></div>
            <button class="btn btn-sm btn-outline-info w-100 py-2" onclick="addRule()"><i class="bi bi-plus-circle me-2"></i>Thêm quy tắc ưu tiên khung giờ</button>
          </div>
        </div>
      </div>
      <div class="modal-footer border-0">
        <button class="btn btn-danger w-100 py-3 fw-bold shadow-lg" onclick="generateAI()"><i class="bi bi-magic me-2"></i>BẮT ĐẦU ĐIỀU PHỐI LỊCH CHIẾU</button>
      </div>
    </div>
  </div>
</div>

<!-- MANUAL MODAL -->
<div class="modal fade" id="stModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">THÊM THỦ CÔNG</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body p-4"><form id="stForm"><div class="mb-3"><label class="form-label small fw-bold text-muted">Phim</label><select name="movieId" id="stMovieSelect" class="form-select"></select></div><div class="mb-3"><label class="form-label small fw-bold text-muted">Phòng</label><select name="roomId" id="stRoomSelect" class="form-select"></select></div><div class="mb-3"><label class="form-label small fw-bold text-muted">Bắt đầu</label><input type="datetime-local" name="startTime" class="form-control"></div></form></div><div class="modal-footer"><button class="btn btn-danger w-100 py-2 fw-bold" onclick="saveManual()">LƯU SUẤT CHIẾU</button></div></div></div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth-guard.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let allMovies = [], allRooms = [], allGenres = [], currentAIResult = [];
    const aiModal = new bootstrap.Modal(document.getElementById('aiModal'));
    const stModal = new bootstrap.Modal(document.getElementById('stModal'));

    function showNotify(msg, type='success') {
        const toast = document.createElement('div');
        toast.className = 'toast-star';
        toast.innerHTML = `<i class="bi ${type==='success'?'bi-check-circle-fill text-success':'bi-exclamation-triangle-fill text-danger'}"></i> <div class="fw-bold small">${msg}</div>`;
        document.getElementById('toastContainer').appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function renderSidebar(role) {
        const sidebar = document.getElementById('dynamicSidebar');
        let html = `<li><a href="dashboard.html" class="nav-link-admin"><i class="bi bi-grid-1x2-fill"></i> Bảng điều khiển</a></li>`;
        if (role === 'ADMIN') {
            html += `<li><a href="manage-users.html" class="nav-link-admin"><i class="bi bi-people"></i> Người dùng</a></li><li><a href="manage-audit.html" class="nav-link-admin"><i class="bi bi-journal-text"></i> Nhật ký</a></li>`;
        } else if (role === 'MANAGER') {
            html += `<li><a href="manage-movies.html" class="nav-link-admin"><i class="bi bi-film"></i> Quản lý phim</a></li><li><a href="manage-showtimes.html" class="nav-link-admin active"><i class="bi bi-calendar-event"></i> Suất chiếu</a></li><li><a href="manage-rooms.html" class="nav-link-admin"><i class="bi bi-door-open"></i> Phòng chiếu</a></li><li><a href="manage-combos.html" class="nav-link-admin"><i class="bi bi-cup-straw"></i> Combo & Bắp nước</a></li><li><a href="manage-promotions.html" class="nav-link-admin"><i class="bi bi-tag"></i> Khuyến mãi</a></li><li><a href="manage-pricing.html" class="nav-link-admin"><i class="bi bi-cash-stack"></i> Cấu hình giá</a></li>`;
        }
        sidebar.innerHTML = html;
    }

    function addRule() {
        const container = document.getElementById('ruleContainer');
        const div = document.createElement('div');
        div.className = 'rule-item';
        div.innerHTML = `
            <div class="row g-2 align-items-center">
                <div class="col-md-4">
                    <select class="form-select form-select-sm rule-type" onchange="updateRuleValues(this)">
                        <option value="PRIORITY">Phim Tier (Ưu tiên)</option>
                        <option value="GENRE">Theo Thể loại</option>
                    </select>
                </div>
                <div class="col-md-4 rule-val-container">
                    <select class="form-select form-select-sm rule-value">
                        <option value="8">Độ ưu tiên >= 8</option>
                        <option value="5">Độ ưu tiên >= 5</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="form-select form-select-sm rule-time">
                        <option value="08:00-12:00">Sáng (8h-12h)</option>
                        <option value="12:00-18:00">Chiều (12h-18h)</option>
                        <option value="18:00-23:00" selected>GIỜ VÀNG (18h-23h)</option>
                    </select>
                </div>
                <div class="col-md-1 text-end">
                    <button class="btn btn-sm text-danger" onclick="this.closest('.rule-item').remove()"><i class="bi bi-trash"></i></button>
                </div>
            </div>
        `;
        container.appendChild(div);
    }

    function updateRuleValues(select) {
        const container = select.closest('.row').querySelector('.rule-val-container');
        if (select.value === 'PRIORITY') {
            container.innerHTML = `<select class="form-select form-select-sm rule-value"><option value="8">Độ ưu tiên >= 8</option><option value="5">Độ ưu tiên >= 5</option></select>`;
        } else {
            container.innerHTML = `<select class="form-select form-select-sm rule-value">${allGenres.map(g=>`<option value="${g.name}">${g.name}</option>`).join('')}</select>`;
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        renderSidebar(AuthGuard.getRole());
        document.getElementById('filterDate').valueAsDate = new Date();
        try {
            const [mRes, rRes, gRes] = await Promise.all([api.get('/movies/showing'), api.get('/rooms'), api.get('/genres')]);
            allMovies = mRes.data || []; allRooms = rRes.data || []; allGenres = gRes.data || [];
            renderMovieCards(); populateSelectors(); loadShowtimes();
        } catch(e) { console.error(e); }
    });

    async function generateAI() {
        const rules = Array.from(document.querySelectorAll('.rule-item')).map(item => {
            const timeRange = item.querySelector('.rule-time').value.split('-');
            return {
                priorityType: item.querySelector('.rule-type').value,
                targetValue: item.querySelector('.rule-value').value,
                startTime: timeRange[0] + ":00",
                endTime: timeRange[1] + ":00",
                weightBoost: 2.0
            };
        });

        const req = {
            date: document.getElementById('filterDate').value,
            mode: document.getElementById('aiMode').value,
            ratio: parseFloat(document.getElementById('aiRatio').value) / 100,
            strategy: document.getElementById('aiStrategy').value,
            rules: rules
        };

        showNotify('AI đang tính toán lịch tối ưu...');
        try {
            const res = await api.post('/scheduling/suggest', req);
            if (res.success) {
                currentAIResult = res.data;
                document.getElementById('aiActions').classList.remove('d-none');
                renderTimeline(res.data);
                aiModal.hide();
                showNotify('Đã tạo bản nháp lịch chiếu AI!');
            }
        } catch(e) { showNotify('Lỗi xử lý AI', 'error'); }
    }

    async function saveAI() {
        const overwrite = document.getElementById('aiMode').value === 'OVERWRITE';
        const res = await api.post(`/scheduling/apply?overwrite=${overwrite}`, currentAIResult);
        if (res.success) { showNotify('Đã lưu lịch chiếu chính thức!'); loadShowtimes(); }
    }

    // Logic hỗ trợ render cũ
    function renderMovieCards() { document.getElementById('movieList').innerHTML = allMovies.map(m => `<div class="movie-card-sm"><img src="${m.posterUrl}" class="movie-poster-xs"><div class="movie-info"><div class="movie-name-sm">${m.title}</div><div class="text-muted small">${m.duration}p • ${m.ageRating}</div></div></div>`).join(''); }
    async function loadShowtimes() { const res = await api.get(`/showtimes?date=${document.getElementById('filterDate').value}`); if(res.success){ renderTimeline(res.data); document.getElementById('aiActions').classList.add('d-none'); } }
    function renderTimeline(list) {
        document.getElementById('roomTimeline').innerHTML = allRooms.map(r => {
            const st = list.filter(s => s.roomId === r.id);
            return `<div class="room-row"><div class="room-header"><span class="room-name">${r.name}</span><span class="room-type-tag">${r.type}</span></div><div class="showtimes-flex">${st.map(s=>`
                <div class="showtime-block ${s.id < 0 ? 'ai-draft' : ''}">
                    ${s.id < 0 ? '<span class="ai-badge">AI Nháp</span>' : ''}
                    <span class="showtime-movie">${s.movieTitle}</span>
                    <span class="showtime-time">${new Date(s.startTime).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>
                </div>`).join('')}</div></div>`;
        }).join('');
    }
    function populateSelectors() { 
        document.getElementById('stMovieSelect').innerHTML = allMovies.map(m=>`<option value="${m.id}">${m.title}</option>`).join('');
        document.getElementById('stRoomSelect').innerHTML = allRooms.map(r=>`<option value="${r.id}">${r.name}</option>`).join('');
    }
    function openAIConfig() { aiModal.show(); }
    async function saveManual() { /* Logic cũ */ }
    async function deleteShowtime(id) { /* Logic cũ */ }
</script>
</body>
</html>
