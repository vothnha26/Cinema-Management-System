<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Suất chiếu – StarCinema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
  <style>
    :root {
      --bg: #080B14; --surface: #0F1320; --card: #161B2E; --border: #252A3D;
      --accent: #E5133A; --accent-gold: #F5A623; --text: #E8EAF0; --text-muted: #7B82A0;
      --gradient: linear-gradient(135deg, #E5133A, #8B0020);
      --sidebar-width: 260px;
      --success: #10B981;
    }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; overflow-x: hidden; }
    .sidebar { width: var(--sidebar-width); background: var(--surface); border-right: 1px solid var(--border); height: 100vh; position: fixed; top: 0; left: 0; z-index: 1000; padding: 24px; display: flex; flex-direction: column; }
    .main-content { margin-left: var(--sidebar-width); padding: 40px; min-height: 100vh; }
    .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
    .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; letter-spacing: 1px; margin: 0; }

    /* ── SCHEDULER LAYOUT ── */
    .scheduler-container { display: grid; grid-template-columns: 300px 1fr; gap: 30px; }
    .movie-selection-list { display: flex; flex-direction: column; gap: 15px; height: calc(100vh - 250px); overflow-y: auto; padding-right: 10px; }
    .movie-card-sm { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; cursor: pointer; transition: 0.2s; display: flex; gap: 12px; }
    .movie-card-sm:hover { border-color: var(--accent); transform: translateX(5px); }
    .movie-card-sm.active { border-color: var(--accent); background: rgba(229,19,58,0.05); }
    .movie-poster-xs { width: 50px; height: 75px; border-radius: 6px; object-fit: cover; background: var(--surface); flex-shrink: 0; }
    .movie-name-sm { font-weight: 700; font-size: 0.85rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── TIME GRID ── */
    .timeline-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 25px; }
    .room-row { margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
    .room-row:last-child { border-bottom: none; }
    .room-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .room-name { font-weight: 700; font-size: 1.1rem; color: #fff; }
    .room-type-tag { font-size: 0.7rem; background: rgba(255,255,255,0.05); padding: 2px 8px; border-radius: 4px; color: var(--text-muted); border: 1px solid var(--border); }

    .showtimes-flex { display: flex; flex-wrap: wrap; gap: 12px; }
    .showtime-block {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px;
      min-width: 160px; transition: 0.2s; position: relative; overflow: hidden;
    }
    .showtime-block:hover { border-color: var(--accent-gold); }
    .showtime-movie { font-size: 0.8rem; font-weight: 700; display: block; margin-bottom: 4px; color: #fff; }
    .showtime-time { font-size: 0.9rem; font-weight: 800; color: var(--accent-gold); }
    .format-tag { font-size: 0.6rem; background: var(--accent); color: #fff; padding: 1px 4px; border-radius: 3px; margin-left: 5px; }

    /* AI Draft */
    .showtime-block.ai-draft { border: 1.5px dashed var(--accent); background: rgba(229,19,58,0.03); }
    .ai-badge { position: absolute; top: 0; right: 0; background: var(--accent); color: #fff; font-size: 0.55rem; padding: 2px 6px; border-radius: 0 0 0 8px; font-weight: 800; text-transform: uppercase; }

    .tool-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 15px 25px; margin-bottom: 30px; }
    .btn-ai { background: var(--gradient); border: none; color: #fff; padding: 10px 24px; border-radius: 10px; font-weight: 700; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
    .btn-ai:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(229,19,58,0.3); }

    /* ── TOAST ── */
    .toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 2000; }
    .toast-star { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 24px; display: flex; align-items: center; gap: 12px; margin-top: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .ts-icon-success { color: var(--success); }
    .ts-icon-error { color: var(--accent); }

    .rule-item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 10px; position: relative; }
    .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 20px; color: var(--text); }
  </style>
</head>
<body>

<aside class="sidebar"></aside>

<main class="main-content">
  <div class="header-section">
    <div>
      <h1 class="page-title">AI STRATEGIC COMMANDER</h1>
      <p class="text-muted m-0">Quản lý suất chiếu và Tự động hóa lịch trình bằng AI</p>
    </div>
    <div class="d-flex gap-3">
      <button class="btn btn-outline-light px-4" style="border-radius:10px" data-bs-toggle="modal" data-bs-target="#stModal"><i class="bi bi-plus-lg me-2"></i>THỦ CÔNG</button>
      <button class="btn-ai" onclick="openAIConfig()"><i class="bi bi-robot"></i> ĐIỀU PHỐI AI</button>
    </div>
  </div>

  <div class="tool-bar">
    <div class="d-flex align-items-center gap-3">
      <div class="fw-bold"><i class="bi bi-calendar-event me-2"></i>Ngày chiếu:</div>
      <input type="date" id="filterDate" class="form-control bg-dark text-white border-0 py-1" style="width:180px" onchange="loadShowtimes()">
    </div>
    <div id="aiActions" class="d-none">
      <span class="text-accent small fw-bold me-3">Đang xem bản nháp AI...</span>
      <button class="btn btn-sm btn-success px-3 me-2" onclick="saveAI()">CHẤP NHẬN LỊCH</button>
      <button class="btn btn-sm btn-outline-danger px-3" onclick="loadShowtimes()">HỦY BỎ</button>
    </div>
  </div>

  <div class="scheduler-container">
    <div>
      <div class="section-title mb-3" style="font-size: 1.2rem">Phim đang chiếu</div>
      <div class="movie-selection-list" id="movieList"></div>
    </div>
    <div class="timeline-wrap">
      <div id="roomTimeline">
        <div class="text-center py-5 text-muted">Đang tải lịch chiếu...</div>
      </div>
    </div>
  </div>
</main>

<div class="toast-container" id="toastContainer"></div>

<!-- MODALS (AI, MANUAL) SAME AS BEFORE -->
<div class="modal fade" id="aiModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title fw-bold"><i class="bi bi-cpu me-2"></i>CẤU HÌNH AI</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
      <div class="modal-body p-4">
        <div class="row g-4">
          <div class="col-md-6">
            <label class="form-label small fw-bold text-muted">Chiến lược ưu tiên</label>
            <select id="aiStrategy" class="form-select mb-3"><option value="BALANCED">Cân bằng</option><option value="REVENUE">Tối ưu doanh thu</option><option value="FAMILY">Gia đình</option><option value="LATE_NIGHT">Cú đêm</option></select>
            <label class="form-label small fw-bold text-muted">Tỷ lệ lấp đầy (Phim Top)</label>
            <input type="range" id="aiRatio" class="form-range" min="0.3" max="0.9" step="0.1" value="0.7">
          </div>
          <div class="col-md-6"><label class="form-label small fw-bold text-muted">Quy tắc tùy chỉnh</label><div id="ruleContainer" class="mb-3"></div><button class="btn btn-sm btn-outline-info w-100" onclick="addRule()"><i class="bi bi-plus-circle me-2"></i>Thêm quy tắc</button></div>
        </div>
      </div>
      <div class="modal-footer"><button class="btn btn-danger w-100 py-3 fw-bold" onclick="generateAI()"><i class="bi bi-magic me-2"></i>BẮT ĐẦU XẾP LỊCH</button></div>
    </div>
  </div>
</div>

<div class="modal fade" id="stModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title fw-bold">THÊM THỦ CÔNG</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
      <div class="modal-body p-4">
        <form id="stForm">
          <div class="mb-3"><label class="form-label small fw-bold text-muted">Phim</label><select name="movieId" id="stMovieSelect" class="form-select"></select></div>
          <div class="mb-3"><label class="form-label small fw-bold text-muted">Phòng</label><select name="roomId" id="stRoomSelect" class="form-select"></select></div>
          <div class="mb-3"><label class="form-label small fw-bold text-muted">Bắt đầu</label><input type="datetime-local" name="startTime" class="form-control"></div>
        </form>
      </div>
      <div class="modal-footer"><button class="btn btn-danger w-100 py-2 fw-bold" onclick="saveManual()">LƯU SUẤT CHIẾU</button></div>
    </div>
  </div>
</div>

<script src="/js/auth-guard.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let allMovies = [], allRooms = [], currentAIResult = [];
    const aiModal = new bootstrap.Modal(document.getElementById('aiModal'));
    const stModal = new bootstrap.Modal(document.getElementById('stModal'));

    function showNotify(msg, type='success') {
        const container = document.getElementById('toastContainer');
        const icon = type === 'success' ? 'bi-check-circle-fill ts-icon-success' : 'bi-exclamation-triangle-fill ts-icon-error';
        const toast = document.createElement('div');
        toast.className = 'toast-star';
        toast.innerHTML = `<i class="bi ${icon}"></i> <div class="fw-bold small">${msg}</div>`;
        container.appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3500);
    }

    function getFullImageUrl(path) {
        if (!path) return 'https://placehold.co/50x75?text=No+Img';
        if (path.startsWith('http')) return path;
        const cleanPath = path.startsWith('/') ? path : '/' + path;
        return `https://image.tmdb.org/t/p/w500${cleanPath}`;
    }

    document.addEventListener('DOMContentLoaded', async () => {
        document.getElementById('filterDate').valueAsDate = new Date();
        try {
            const [mRes, rRes] = await Promise.all([api.get('/movies/showing'), api.get('/rooms')]);
            allMovies = mRes.data || []; allRooms = rRes.data || [];
            renderMovieCards(); populateSelectors(); loadShowtimes();
        } catch(e) { showNotify('Lỗi khởi tạo dữ liệu!', 'error'); }
    });

    function renderMovieCards() {
        document.getElementById('movieList').innerHTML = allMovies.map(m => `
            <div class="movie-card-sm">
                <img src="${getFullImageUrl(m.posterUrl)}" class="movie-poster-xs">
                <div class="movie-info"><div class="movie-name-sm">${m.title}</div><div class="text-muted small">${m.duration}p • ${m.ageRating}</div></div>
            </div>`).join('');
    }

    async function loadShowtimes() {
        const date = document.getElementById('filterDate').value;
        const res = await api.get(`/showtimes?date=${date}`);
        if (res.success) {
            document.getElementById('aiActions').classList.add('d-none');
            renderTimeline(res.data);
        }
    }

    function renderTimeline(showtimes) {
        const container = document.getElementById('roomTimeline');
        if(!allRooms.length) { container.innerHTML = '<div class="text-center py-5">Không có phòng chiếu nào.</div>'; return; }
        container.innerHTML = allRooms.map(room => {
            const roomShows = showtimes.filter(s => s.roomId === room.id);
            return `
                <div class="room-row">
                    <div class="room-header"><span class="room-name">${room.name}</span><span class="room-type-tag">${room.type}</span></div>
                    <div class="showtimes-flex">${roomShows.map(s => renderShowtimeBlock(s, false)).join('')}</div>
                </div>`;
        }).join('');
    }

    function renderShowtimeBlock(s, isPreview) {
        const st = new Date(s.startTime), now = new Date();
        const stStr = st.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        const etStr = new Date(s.endTime).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        const isDeletable = !isPreview && (s.soldSeats === 0) && (st - now > 7200000);
        const isDraft = s.id < 0;
        return `
            <div class="showtime-block ${isDraft?'ai-draft':''}">
                ${isDraft?'<span class="ai-badge">AI Nháp</span>':''}
                <span class="showtime-movie">${s.movieTitle}</span>
                <span class="showtime-time">${stStr} - ${etStr}</span>
                ${!isPreview?`<div class="mt-2 pt-2 border-top border-secondary small d-flex justify-content-between"><span>${s.soldSeats||0}/${s.totalSeats||0}</span>${isDeletable?`<i class="bi bi-trash-fill text-danger" style="cursor:pointer" onclick="deleteShowtime(${s.id})"></i>`:'<i class="bi bi-lock text-muted"></i>'}</div>`:''}
            </div>`;
    }

    function openAIConfig() { aiModal.show(); }

    async function generateAI() {
        const req = { date: document.getElementById('filterDate').value, strategy: document.getElementById('aiStrategy').value, ratio: parseFloat(document.getElementById('aiRatio').value), mode: "OVERWRITE" };
        showNotify('Đang điều phối AI, vui lòng chờ...');
        const res = await api.post('/showtimes/generate-ai', req);
        if (res.success) {
            currentAIResult = res.data;
            document.getElementById('aiActions').classList.remove('d-none');
            renderTimeline(res.data);
            aiModal.hide();
            showNotify('AI đã tạo bản nháp lịch chiếu!');
        } else showNotify(res.message, 'error');
    }

    async function saveAI() {
        const res = await api.post('/showtimes/apply-ai?overwrite=true', currentAIResult);
        if (res.success) { showNotify('Đã áp dụng lịch chiếu AI thành công!'); loadShowtimes(); }
        else showNotify(res.message, 'error');
    }

    async function saveManual() {
        const f = document.getElementById('stForm');
        const data = { movieId: f.movieId.value, roomId: f.roomId.value, startTime: f.startTime.value };
        const res = await api.post('/showtimes', data);
        if(res.success) { stModal.hide(); loadShowtimes(); showNotify('Đã thêm suất chiếu thủ công!'); }
        else showNotify(res.message, 'error');
    }

    async function deleteShowtime(id) {
        if (!confirm('Xóa suất chiếu này?')) return;
        const res = await api.get(`/showtimes/${id}`); // Kiểm tra lại
        const del = await api.delete(`/showtimes/${id}`);
        if (del.success) { showNotify('Đã xóa suất chiếu!'); loadShowtimes(); }
        else showNotify(del.message, 'error');
    }

    function populateSelectors() {
        document.getElementById('stMovieSelect').innerHTML = allMovies.map(m => `<option value="${m.id}">${m.title}</option>`).join('');
        document.getElementById('stRoomSelect').innerHTML = allRooms.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
    }
</script>
</body>
</html>
