<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Điều phối Suất chiếu | FlashCinema Elite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <style>
  :root {
    --bg: #06080F; --surface: #0F121F; --card: #161B2E; --border: #252A3D;
    --accent: #E5133A; --accent-glow: rgba(229, 19, 58, 0.4);
    --text: #E8EAF0; --text-muted: #7B82A0;
    --hour-width: 120px;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }

  .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  header { height: 80px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; background: rgba(6, 8, 15, 0.8); backdrop-filter: blur(20px); z-index: 90; }
  .scheduler-wrapper { flex: 1; overflow: hidden; display: flex; flex-direction: row; background: #080a14; }
  .timeline-container { flex: 1; overflow: auto; position: relative; display: flex; }
  .movie-panel { width: 280px; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .movie-panel-header { padding: 20px; border-bottom: 1px solid var(--border); }
  .movie-list-scroll { flex: 1; overflow-y: auto; padding: 15px; }
  .movie-item-filter { padding: 12px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; display: flex; gap: 12px; align-items: center; }
  .movie-item-filter:hover { background: rgba(255,255,255,0.05); }
  .movie-item-filter.active { background: rgba(229,19,58,0.1); border-color: var(--accent); }
  .movie-poster-tiny { width: 40px; height: 55px; border-radius: 6px; object-fit: cover; background: #1a1d29; }
  .movie-info-tiny { flex: 1; overflow: hidden; }
  .movie-info-tiny .title { font-size: 0.8rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .movie-info-tiny .meta { font-size: 0.65rem; color: var(--text-muted); }

  .room-labels { width: 180px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); position: sticky; left: 0; z-index: 20; }
  .room-label-item { height: 120px; border-bottom: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; justify-content: center; background: var(--surface); }
  .room-name { font-weight: 800; font-size: 0.95rem; color: #fff; }
  .room-meta { font-size: 0.65rem; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; font-weight: 700; }

  .timeline-content { position: relative; min-width: fit-content; }
  .time-header { display: flex; height: 40px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 15; }
  .time-slot { width: var(--hour-width); flex-shrink: 0; border-right: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); }
  .grid-row { height: 120px; border-bottom: 1px solid var(--border); position: relative; display: flex; width: calc(var(--hour-width) * 24); background-image: linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: calc(var(--hour-width) / 4) 100%; }
  
  .st-block { position: absolute; top: 15px; height: 90px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; cursor: pointer; transition: all 0.2s; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; z-index: 5; border-left: 4px solid var(--accent); }
  .st-block:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 10px 25px rgba(0,0,0,0.4), 0 0 15px var(--accent-glow); z-index: 10; }
  .st-block.ai-draft { border-style: dashed; background: rgba(229, 19, 58, 0.05); border-left-style: solid; }
  .st-block.ai-draft::before { content: 'AI DRAFT'; position: absolute; top: 0; right: 0; background: var(--accent); color: #fff; font-size: 0.5rem; padding: 2px 6px; font-weight: 900; border-bottom-left-radius: 8px; }
  .st-title { font-size: 0.8rem; font-weight: 800; color: #fff; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .st-info { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }

  /* ── SEAT MAP VIEWER ── */
  .seat-map-container { display: grid; gap: 6px; justify-content: center; padding: 20px; }
  .seat-item { width: 30px; height: 28px; border-radius: 6px; background: #1F2940; border: 1.5px solid #2D3748; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 800; color: #fff; }
  .seat-item.booked { background: var(--accent) !important; border-color: var(--accent) !important; opacity: 0.3; position: relative; }
  .seat-item.booked::after { content: '✕'; color: #fff; position: absolute; font-size: 0.7rem; }
  .seat-item.vip { border-color: #F5A623; color: #F5A623; }
  .screen-visual { width: 80%; height: 4px; background: var(--accent); margin: 0 auto 30px; border-radius: 10px; box-shadow: 0 5px 15px var(--accent-glow); position: relative; }
  .screen-visual::after { content: 'MÀN HÌNH'; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 0.6rem; letter-spacing: 5px; color: var(--text-muted); font-weight: 800; }

  .modal-content { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; color: #fff; }
  .form-control, .form-select { background: #080a14; border: 1px solid var(--border); color: #fff; border-radius: 12px; }
  .toast-star { position: fixed; bottom: 30px; right: 30px; background: var(--card); border: 1px solid var(--border); padding: 16px 24px; border-radius: 16px; z-index: 9999; box-shadow: 0 20px 40px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 15px; }
  </style>
</head>
<body>

<aside class="sidebar" id="sidebar"></aside>

<main class="main-content">
  <header>
    <div class="d-flex align-items-center gap-3">
      <div class="bg-danger bg-opacity-10 p-2 rounded-3"><i class="bi bi-calendar-range text-danger fs-4"></i></div>
      <div><h4 class="fw-bold m-0">ĐIỀU PHỐI SUẤT CHIẾU</h4><p class="text-muted small m-0">Quản lý lịch chiếu phim thời gian thực</p></div>
    </div>
    <div class="d-flex gap-3">
      <button class="btn btn-dark border-secondary px-4 fw-bold" onclick="openManualModal()">THÊM THỦ CÔNG</button>
      <button class="btn btn-danger px-4 fw-bold" onclick="aiModal.show()">ĐIỀU PHỐI AI</button>
    </div>
  </header>
  
  <div class="p-3 px-4 bg-surface border-bottom border-secondary border-opacity-10 d-flex justify-content-between">
    <div class="d-flex align-items-center gap-4">
      <div class="d-flex align-items-center gap-2"><label class="small fw-bold text-muted m-0">Ngày:</label><input type="date" id="filterDate" class="form-control form-control-sm" style="width:160px" onchange="loadShowtimes()"></div>
      <div class="d-flex align-items-center gap-2"><label class="small fw-bold text-muted m-0">Định dạng:</label><select id="filterFormat" class="form-select form-select-sm" style="width:120px" onchange="applyFilters()"><option value="">Tất cả</option></select></div>
      <div id="aiStatusBadge" class="d-none badge bg-warning text-dark p-2 px-3 rounded-pill animate__animated animate__pulse animate__infinite">ĐANG XEM LỊCH AI GỢI Ý</div>
    </div>
    <div id="aiActions" class="d-none">
      <button class="btn btn-sm btn-outline-light px-3 me-2" onclick="loadShowtimes()">HỦY BỎ</button>
      <button class="btn btn-sm btn-success px-3" onclick="saveAI()">LƯU LỊCH CHÍNH THỨC</button>
    </div>
  </div>

  <div class="scheduler-wrapper">
    <div class="timeline-container">
      <div class="room-labels" id="roomLabels"></div>
      <div class="timeline-content">
        <div class="time-header" id="timeHeader"></div>
        <div id="timelineGrid"></div>
      </div>
    </div>
    <div class="movie-panel">
      <div class="movie-panel-header"><h6 class="m-0 fw-800">PHIM ĐANG CHIẾU</h6></div>
      <div class="movie-list-scroll" id="movieFilterList"></div>
    </div>
  </div>
</main>

<!-- MODAL XEM CHI TIẾT & SƠ ĐỒ GHẾ -->
<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <h5 class="fw-800 m-0" id="detailTitle">CHI TIẾT SUẤT CHIẾU</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <div class="row g-4">
          <div class="col-md-4 border-end border-secondary border-opacity-10">
            <div id="detailInfo"></div>
            <hr class="border-secondary opacity-10">
            <button class="btn btn-outline-danger w-100 fw-bold" onclick="handleDeleteShowtime()">HỦY SUẤT CHIẾU</button>
          </div>
          <div class="col-md-8">
            <div class="text-center mb-3"><span class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 px-3" id="seatStats">0/0 Vé đã bán</span></div>
            <div class="screen-visual"></div>
            <div id="liveSeatGrid" class="seat-map-container"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL THÊM MỚI -->
<div class="modal fade" id="addModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="fw-800 m-0">THÊM SUẤT CHIẾU</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><form id="addForm">
    <div class="mb-3"><label class="form-label">Phim</label><select id="addMovieId" class="form-select" onchange="onMovieSelectChange('add')"></select></div>
    <div class="mb-3"><label class="form-label">Phòng</label><select id="addRoomId" class="form-select" onchange="onMovieSelectChange('add')"></select></div>
    <div class="mb-3"><label class="form-label">Định dạng</label><select id="addFormatId" class="form-select"></select></div>
    <div class="mb-4"><label class="form-label">Giờ bắt đầu</label><input type="datetime-local" id="addStartTime" class="form-control"></div>
    <button type="button" class="btn btn-danger w-100 py-3 fw-bold" onclick="handleCreateShowtime()">TẠO SUẤT CHIẾU</button>
  </form></div></div></div>
</div>

<div class="modal fade" id="aiModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="fw-800 m-0">LẬP LỊCH THÔNG MINH (GEMINI AI)</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label">Ngày lập lịch</label><input type="date" id="aiTargetDate" class="form-control"></div>
      <div class="col-md-6"><label class="form-label">Chế độ</label><select id="aiMode" class="form-select"><option value="OVERWRITE">Ghi đè lịch cũ</option><option value="FILL">Lấp đầy chỗ trống</option></select></div>
      <div class="col-md-6"><label class="form-label">Giờ bắt đầu</label><input type="time" id="aiStartTime" class="form-control" value="08:00"></div>
      <div class="col-md-6"><label class="form-label">Giờ kết thúc</label><input type="time" id="aiEndTime" class="form-control" value="23:55"></div>
      <div class="col-md-6"><label class="form-label">Chiến lược</label><select id="aiStrategy" class="form-select"><option value="BALANCED">Cân bằng</option><option value="REVENUE">Tối ưu doanh thu</option></select></div>
      <div class="col-12"><label class="form-label">Ghi chú cho AI</label><textarea id="customDirectives" class="form-control" rows="3" placeholder="Ví dụ: Ưu tiên phim bom tấn vào giờ vàng..."></textarea></div>
    </div>
    <button id="btnRunAI" class="btn btn-primary w-100 mt-4 py-3 fw-bold" onclick="generateAI()">BẮT ĐẦU PHÂN TÍCH AI</button>
  </div></div></div>
</div>

<div id="toastContainer"></div>

<script src="/js/auth-guard.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let allMovies = [], allRooms = [], currentShowtimes = [], currentAIResult = [], currentBranchId = null;
    let selectedMovieId = null, currentViewStId = null;
    const addModal = new bootstrap.Modal(document.getElementById('addModal'));
    const aiModal = new bootstrap.Modal(document.getElementById('aiModal'));
    const detailModal = new bootstrap.Modal(document.getElementById('detailModal'));

    async function init() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('filterDate').value = today;
        document.getElementById('aiTargetDate').value = today;
        
        try {
            const staffRes = await api.get('/staff/me');
            if (staffRes.success && staffRes.data) currentBranchId = staffRes.data.branch?.id;

            const movieApi = currentBranchId ? `/movies/branch/${currentBranchId}` : '/movies';
            const [mRes, rRes, fRes] = await Promise.all([
                api.get(movieApi), api.get('/rooms'), api.get('/public/master-data/formats')
            ]);
            
            allMovies = (mRes.data || []).filter(m => m.status !== 'COMING');
            allRooms = currentBranchId ? (rRes.data || []).filter(r => r.branchId === currentBranchId) : (rRes.data || []);
            
            if (fRes.success) {
                document.getElementById('filterFormat').innerHTML = '<option value="">Tất cả</option>' + 
                    fRes.data.map(f => `<option value="${f.name}">${f.name}</option>`).join('');
            }

            renderTimeHeader(); renderRoomLabels(); renderMovieList(); loadShowtimes();
            
            document.getElementById('addMovieId').innerHTML = allMovies.map(m => `<option value="${m.id}">${m.title}</option>`).join('');
            document.getElementById('addRoomId').innerHTML = allRooms.map(r => `<option value="${r.id}">${r.name} (${r.type})</option>`).join('');
        } catch (e) { console.error(e); }
    }

    async function loadShowtimes() {
        const date = document.getElementById('filterDate').value;
        const res = await api.get(`/showtimes?date=${date}`);
        if (res.success) {
            currentShowtimes = res.data || [];
            currentAIResult = [];
            document.getElementById('aiActions').classList.add('d-none');
            document.getElementById('aiStatusBadge').classList.add('d-none');
            renderTimeline(currentShowtimes);
        }
    }

    function renderTimeline(list) {
        let html = '';
        allRooms.forEach(room => {
            const stInRoom = list.filter(s => s.roomId === room.id);
            html += `<div class="grid-row">`;
            stInRoom.forEach(s => {
                const start = new Date(s.startTime);
                const end = new Date(s.endTime);
                const left = (start.getHours() + start.getMinutes()/60) * 120;
                const width = ((end - start)/3600000) * 120;
                const startStr = `${String(start.getHours()).padStart(2, '0')}:${String(start.getMinutes()).padStart(2, '0')}`;
                
                html += `<div class="st-block ${s.id < 0 ? 'ai-draft' : ''}" 
                              style="left:${left}px; width:${width}px;" 
                              onclick='openDetailModal(${JSON.stringify(s).replace(/'/g, "&apos;")})'>
                            <div class="st-title">${s.movieTitle}</div>
                            <div class="st-info"><span class="fw-bold">${startStr}</span></div>
                         </div>`;
            });
            html += `</div>`;
        });
        document.getElementById('timelineGrid').innerHTML = html;
    }

    async function openDetailModal(s) {
        currentViewStId = s.id;
        document.getElementById('detailTitle').innerText = s.movieTitle;
        document.getElementById('detailInfo').innerHTML = `
            <div class="small text-muted mb-1">PHÒNG CHIẾU</div><div class="fw-bold mb-3">${s.roomName} (${s.roomType})</div>
            <div class="small text-muted mb-1">ĐỊNH DẠNG</div><div class="fw-bold mb-3">${s.formatName}</div>
            <div class="small text-muted mb-1">THỜI GIAN</div><div class="fw-bold">${new Date(s.startTime).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})} - ${new Date(s.endTime).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
        `;
        
        const grid = document.getElementById('liveSeatGrid');
        grid.innerHTML = '<div class="py-5 text-muted text-center w-100">Đang tải sơ đồ...</div>';
        detailModal.show();

        const res = await api.get(`/showtimes/${s.id}/seats`);
        if (res.success) {
            document.getElementById('seatStats').innerText = `${s.soldSeats}/${s.totalSeats} Vé đã bán`;
            renderSeatMap(res.data);
        }
    }

    function renderSeatMap(seats) {
        const grid = document.getElementById('liveSeatGrid');
        if (!seats.length) return;
        const rows = [...new Set(seats.map(s => s.rowChar))].sort();
        const maxCol = Math.max(...seats.map(s => s.colNum));
        grid.style.gridTemplateColumns = `repeat(${maxCol}, 1fr)`;
        grid.innerHTML = '';
        rows.forEach(r => {
            for(let c=1; c<=maxCol; c++) {
                const s = seats.find(x => x.rowChar === r && x.colNum === c);
                if(!s) { grid.insertAdjacentHTML('beforeend', '<div></div>'); continue; }
                const cls = `seat-item ${s.seatType.toLowerCase()} ${!s.available ? 'booked' : ''}`;
                grid.insertAdjacentHTML('beforeend', `<div class="${cls}">${s.available ? s.seatCode : ''}</div>`);
            }
        });
    }

    async function handleDeleteShowtime() {
        if (!confirm('Bạn có chắc muốn hủy suất chiếu này? (Chỉ hủy được khi chưa bán vé)')) return;
        const res = await api.delete(`/showtimes/${currentViewStId}`);
        if(res.success) { showNotify('Thành công', 'Đã hủy suất chiếu'); detailModal.hide(); loadShowtimes(); }
        else showNotify('Lỗi', res.message, 'danger');
    }

    function renderTimeHeader() {
        let h = ''; for(let i=0; i<24; i++) h += `<div class="time-slot">${String(i).padStart(2,'0')}:00</div>`;
        document.getElementById('timeHeader').innerHTML = h;
    }

    function renderRoomLabels() {
        document.getElementById('roomLabels').innerHTML = '<div style="height:40px"></div>' + 
            allRooms.map(r => `<div class="room-label-item"><div class="room-name">${r.name}</div><div class="room-meta">${r.type}</div></div>`).join('');
    }

    function renderMovieList() {
        document.getElementById('movieFilterList').innerHTML = allMovies.map(m => `
            <div class="movie-item-filter ${selectedMovieId==m.id?'active':''}" onclick="filterByMovie(${m.id})">
                <img src="${m.posterUrl}" class="movie-poster-tiny">
                <div class="movie-info-tiny"><div class="title">${m.title}</div><div class="meta">${m.duration}p</div></div>
            </div>`).join('');
    }

    function filterByMovie(id) { selectedMovieId = (selectedMovieId == id) ? null : id; renderMovieList(); applyFilters(); }
    function applyFilters() {
        const fmt = document.getElementById('filterFormat').value;
        const base = currentAIResult.length > 0 ? currentAIResult : currentShowtimes;
        renderTimeline(base.filter(s => (!selectedMovieId || s.movieId == selectedMovieId) && (!fmt || s.formatName == fmt)));
    }

    function onMovieSelectChange(prefix) {
        const mid = document.getElementById(`${prefix}MovieId`).value;
        const rid = document.getElementById(`${prefix}RoomId`).value;
        const movie = allMovies.find(m => m.id == mid);
        const room = allRooms.find(r => r.id == rid);
        if (movie && room) {
            const fmts = movie.formats || [];
            const filtered = fmts.filter(f => (room.supportedFormats || []).includes(typeof f === 'string' ? f : f.name));
            document.getElementById(`${prefix}FormatId`).innerHTML = filtered.map(f => `<option value="${f.id || f}">${f.name || f}</option>`).join('');
        }
    }

    function openManualModal() {
        const d = document.getElementById('filterDate').value;
        document.getElementById('addStartTime').value = d + 'T' + new Date().toTimeString().substring(0,5);
        onMovieSelectChange('add');
        addModal.show();
    }

    async function handleCreateShowtime() {
        const data = {
            movieId: document.getElementById('addMovieId').value,
            roomId: document.getElementById('addRoomId').value,
            formatId: document.getElementById('addFormatId').value,
            startTime: document.getElementById('addStartTime').value + ':00'
        };
        const res = await api.post('/showtimes', data);
        if(res.success) { showNotify('Thành công', 'Đã tạo suất chiếu'); addModal.hide(); loadShowtimes(); }
        else showNotify('Lỗi', res.message, 'danger');
    }

    async function generateAI() {
        const btn = document.getElementById('btnRunAI'); btn.disabled = true; btn.innerHTML = 'ĐANG PHÂN TÍCH...';
        const res = await api.post('/scheduling/suggest', { 
            date: document.getElementById('aiTargetDate').value, 
            mode: document.getElementById('aiMode').value,
            startTime: document.getElementById('aiStartTime').value,
            endTime: document.getElementById('aiEndTime').value,
            strategy: document.getElementById('aiStrategy').value, 
            customDirectives: document.getElementById('customDirectives').value,
            branchId: currentBranchId 
        });
        if (res.success) { currentAIResult = res.data; renderTimeline(currentAIResult); document.getElementById('aiActions').classList.remove('d-none'); document.getElementById('aiStatusBadge').classList.remove('d-none'); aiModal.hide(); }
        else { showNotify('Lỗi', res.message, 'danger'); }
        btn.disabled = false; btn.innerHTML = 'BẮT ĐẦU PHÂN TÍCH AI';
    }

    async function saveAI() {
        const overwrite = document.getElementById('aiMode').value === 'OVERWRITE';
        const res = await api.post(`/scheduling/apply?overwrite=${overwrite}`, currentAIResult);
        if (res.success) { showNotify('Thành công', 'Lịch AI đã được lưu'); loadShowtimes(); }
        else showNotify('Lỗi', res.message, 'danger');
    }

    function showNotify(t, m, type='success') {
        const c = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = 'toast-star animate__animated animate__fadeInUp';
        toast.innerHTML = `<i class="bi bi-info-circle fs-4"></i><div><div class="fw-bold">${t}</div><div class="small">${m}</div></div>`;
        c.appendChild(toast); setTimeout(() => toast.remove(), 4000);
    }

    init();
</script>
</body>
</html>
