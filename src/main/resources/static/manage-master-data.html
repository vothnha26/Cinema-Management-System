<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phân bổ Phim & Chi nhánh | FlashCinema Elite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
          --bg: #080B14; --surface: #0F1320; --card: #161B2E; --border: #252A3D;
          --accent: #E5133A; --text: #E8EAF0; --text-muted: #7B82A0;
          --gradient: linear-gradient(135deg, #E5133A, #8B0020);
        }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; margin: 0; display: flex; }
        
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.8rem; letter-spacing: 2px; margin: 0; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .branch-selector { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 25px; margin-bottom: 30px; display: flex; align-items: center; gap: 20px; }
        .branch-selector select { background: var(--surface); border: 1px solid var(--border); color: #fff; padding: 12px 20px; border-radius: 12px; min-width: 300px; font-weight: 700; }

        .distribution-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .card-panel { background: var(--card); border: 1px solid var(--border); border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; height: 650px; }
        .panel-header { padding: 20px 25px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .panel-header h6 { margin: 0; font-weight: 800; letter-spacing: 1px; color: var(--text-muted); }
        
        .list-container { flex: 1; overflow-y: auto; padding: 15px; }
        .movie-item { padding: 15px; border-radius: 16px; margin-bottom: 10px; background: rgba(255,255,255,0.02); border: 1px solid transparent; transition: 0.2s; display: flex; align-items: center; gap: 15px; }
        .movie-item:hover { background: rgba(255,255,255,0.05); border-color: var(--border); }
        .movie-poster { width: 45px; height: 65px; border-radius: 8px; object-fit: cover; }
        .movie-info { flex: 1; }
        .movie-info .title { font-weight: 700; color: #fff; margin-bottom: 2px; }
        .movie-info .meta { font-size: 0.75rem; color: var(--text-muted); }

        .btn-action { width: 32px; height: 32px; border-radius: 8px; border: none; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn-add { background: rgba(80,200,100,0.1); color: #50C864; }
        .btn-add:hover { background: #50C864; color: #fff; }
        .btn-remove { background: rgba(229,19,58,0.1); color: var(--accent); }
        .btn-remove:hover { background: var(--accent); color: #fff; }

        .priority-badge { background: var(--surface); border: 1px solid var(--border); color: var(--accent); padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; cursor: pointer; }
        .priority-badge:hover { border-color: var(--accent); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>

<aside class="sidebar" id="sidebar"></aside>

<main class="main-content">
    <div class="header-section">
        <div>
            <h1 class="page-title">PHÂN BỔ PHIM & CHI NHÁNH</h1>
            <p class="text-muted m-0 fw-500">Quản lý danh mục phim khả dụng cho từng cụm rạp</p>
        </div>
        <button class="btn btn-outline-secondary px-4 fw-bold" style="border-radius: 12px" onclick="window.location.href='manage-movies.html'">
            <i class="bi bi-arrow-left me-2"></i>QUAY LẠI KHO PHIM
        </button>
    </div>

    <div class="branch-selector">
        <i class="bi bi-geo-alt-fill text-danger fs-4"></i>
        <div class="flex-1">
            <label class="d-block small fw-800 text-muted mb-1">CHỌN CHI NHÁNH ĐỂ CẤU HÌNH</label>
            <select id="branchSelect" onchange="loadBranchMovies()">
                <option value="">Đang tải danh sách chi nhánh...</option>
            </select>
        </div>
        <div class="ms-auto text-end">
            <div class="small fw-bold text-success" id="syncStatus"><i class="bi bi-check-all me-1"></i> Dữ liệu đồng bộ</div>
        </div>
    </div>

    <div class="distribution-grid">
        <!-- BÊN TRÁI: KHO PHIM HỆ THỐNG -->
        <div class="card-panel">
            <div class="panel-header">
                <h6>KHO PHIM HỆ THỐNG</h6>
                <span class="badge bg-dark border border-secondary text-muted px-3" id="libraryCount">0 Phim</span>
            </div>
            <div class="p-3 border-bottom border-secondary border-opacity-10">
                <div class="input-group input-group-sm">
                    <span class="input-group-text bg-transparent border-secondary text-muted"><i class="bi bi-search"></i></span>
                    <input type="text" class="form-control bg-transparent border-secondary text-white" placeholder="Tìm phim trong kho..." onkeyup="filterLibrary(this.value)">
                </div>
            </div>
            <div class="list-container" id="libraryList"></div>
        </div>

        <!-- BÊN PHẢI: PHIM TẠI CHI NHÁNH -->
        <div class="card-panel">
            <div class="panel-header">
                <h6>PHIM ĐANG CHIẾU TẠI RẠP</h6>
                <span class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 px-3" id="branchCount">0 Phim</span>
            </div>
            <div class="list-container" id="branchMovieList">
                <div class="text-center py-5 text-muted small">Hãy chọn một chi nhánh để quản lý</div>
            </div>
        </div>
    </div>
</main>

<!-- MODAL CẬP NHẬT ƯU TIÊN -->
<div class="modal fade" id="priorityModal" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body p-4 text-center">
                <h6 class="fw-800 mb-3">MỨC ĐỘ ƯU TIÊN</h6>
                <input type="number" id="priorityInput" class="form-control form-control-lg text-center fw-800 text-danger" min="1" max="10">
                <p class="text-muted small mt-2">Dùng để AI lập lịch chiếu (1-10)</p>
                <div class="d-grid mt-4">
                    <button class="btn btn-danger fw-bold py-2" onclick="savePriority()">CẬP NHẬT</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/auth-guard.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    AuthGuard.requireRole(['ADMIN']);
    let allMovies = [], currentBranchMovies = [], allBranches = [];
    let selectedBranchId = null, editingBranchMovieId = null;
    const priorityModal = new bootstrap.Modal(document.getElementById('priorityModal'));

    async function init() {
        // Load branches separately
        try {
            const bRes = await api.get('/admin/branches');
            if (bRes.success) {
                allBranches = bRes.data;
                const select = document.getElementById('branchSelect');
                select.innerHTML = '<option value="">-- Chọn Chi Nhánh --</option>' + 
                    allBranches.map(b => `<option value="${b.id}">${b.name} (${b.city})</option>`).join('');
            }
        } catch (e) {
            console.error(">>> ERROR LOADING BRANCHES:", e);
            document.getElementById('branchSelect').innerHTML = '<option value="">Lỗi tải dữ liệu chi nhánh</option>';
        }

        // Load movies separately
        try {
            const mRes = await api.get('/movies');
            if (mRes.success) {
                allMovies = mRes.data;
                renderLibrary();
            }
        } catch (e) {
            console.error(">>> ERROR LOADING MOVIES:", e);
            document.getElementById('libraryList').innerHTML = '<div class="text-center py-5 text-danger small">Lỗi dữ liệu phim (JSON quá lớn hoặc sai cú pháp)</div>';
        }
    }

    function renderLibrary(filter = '') {
        const list = document.getElementById('libraryList');
        const filtered = allMovies.filter(m => 
            m.title.toLowerCase().includes(filter.toLowerCase()) && 
            !currentBranchMovies.some(bm => bm.movie.id === m.id)
        );
        
        document.getElementById('libraryCount').innerText = filtered.length + ' Phim';
        
        list.innerHTML = filtered.map(m => `
            <div class="movie-item animate__animated animate__fadeIn">
                <img src="${m.posterUrl || 'https://placehold.co/45x65'}" class="movie-poster">
                <div class="movie-info">
                    <div class="title small">${m.title}</div>
                    <div class="meta">${m.duration} phút • ${m.ageRating}</div>
                </div>
                <button class="btn-action btn-add" onclick="addMovieToBranch(${m.id})">
                    <i class="bi bi-plus-lg"></i>
                </button>
            </div>
        `).join('');
    }

    async function loadBranchMovies() {
        selectedBranchId = document.getElementById('branchSelect').value;
        if (!selectedBranchId) {
            document.getElementById('branchMovieList').innerHTML = '<div class="text-center py-5 text-muted small">Hãy chọn một chi nhánh để quản lý</div>';
            currentBranchMovies = [];
            renderLibrary();
            return;
        }

        const res = await api.get(`/admin/branch-movies/branch/${selectedBranchId}`);
        if (res.success) {
            currentBranchMovies = res.data;
            renderBranchMovies();
            renderLibrary();
        }
    }

    function renderBranchMovies() {
        const list = document.getElementById('branchMovieList');
        document.getElementById('branchCount').innerText = currentBranchMovies.length + ' Phim';
        
        if (currentBranchMovies.length === 0) {
            list.innerHTML = '<div class="text-center py-5 text-muted small">Chi nhánh này chưa được phân bổ phim nào</div>';
            return;
        }

        list.innerHTML = currentBranchMovies.map(bm => `
            <div class="movie-item">
                <img src="${bm.movie.posterUrl || 'https://placehold.co/45x65'}" class="movie-poster">
                <div class="movie-info">
                    <div class="title small">${bm.movie.title}</div>
                    <div class="d-flex align-items-center gap-2 mt-1">
                        <span class="priority-badge" onclick="openPriorityModal(${bm.id}, ${bm.priority})">P: ${bm.priority}</span>
                        <span class="text-muted small" style="font-size: 0.65rem">Phân bổ: ${new Date(bm.assignedAt).toLocaleDateString()}</span>
                    </div>
                </div>
                <button class="btn-action btn-remove" onclick="removeMovieFromBranch(${bm.id})">
                    <i class="bi bi-trash"></i>
                </button>
            </div>
        `).join('');
    }

    async function addMovieToBranch(movieId) {
        if (!selectedBranchId) return alert('Hãy chọn chi nhánh trước!');
        const res = await api.post('/admin/branch-movies', {
            branchId: selectedBranchId,
            movieId: movieId,
            priority: 5
        });
        if (res.success) loadBranchMovies();
    }

    async function removeMovieFromBranch(bmId) {
        if (!confirm('Xác nhận gỡ phim này khỏi chi nhánh?')) return;
        const res = await api.delete(`/admin/branch-movies/${bmId}`);
        if (res.success) loadBranchMovies();
    }

    function openPriorityModal(bmId, currentP) {
        editingBranchMovieId = bmId;
        document.getElementById('priorityInput').value = currentP;
        priorityModal.show();
    }

    async function savePriority() {
        const p = document.getElementById('priorityInput').value;
        const res = await api.patch(`/admin/branch-movies/${editingBranchMovieId}/priority?priority=${p}`);
        if (res.success) {
            priorityModal.hide();
            loadBranchMovies();
        }
    }

    function filterLibrary(val) {
        renderLibrary(val);
    }

    init();
</script>
</body>
</html>
