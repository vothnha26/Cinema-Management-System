<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarCinema – Quản Lý Dữ Liệu Gốc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/sidebar.css">
    <style>
        :root {
          --bg: #080B14; --surface: #0F1320; --card: #161B2E; --border: #252A3D;
          --accent: #E5133A; --accent-gold: #F5A623; --text: #E8EAF0; --text-muted: #7B82A0;
          --gradient: linear-gradient(135deg, #E5133A, #8B0020);
        }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; }
        .main-content { padding: 40px; margin-left: 280px; }
        .header-section { margin-bottom: 32px; }
        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; letter-spacing: 1px; margin: 0; }
        
        .nav-pills .nav-link { color: var(--text-muted); border-radius: 10px; padding: 10px 24px; font-weight: 600; }
        .nav-pills .nav-link.active { background: var(--gradient); color: #fff; }

        .custom-table { background: var(--card); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; margin-top: 24px; }
        .table { color: var(--text); margin-bottom: 0; vertical-align: middle; }
        .table thead { background: var(--surface); }
        .table th { border: none; padding: 16px 20px; font-weight: 600; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }
        .table td { border-top: 1px solid var(--border); padding: 16px 20px; }

        .btn-add { background: var(--gradient); border: none; color: #fff; padding: 8px 20px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; }
        .action-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); width: 32px; height: 32px; border-radius: 6px; }
        
        .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 20px; color: var(--text); }
        .form-control-custom { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px 16px; }
    </style>
</head>
<body>

<aside class="sidebar"></aside>

<main class="main-content">
    <div class="header-section">
        <h1 class="page-title">Quản lý tiêu chuẩn hệ thống</h1>
        <p class="text-muted m-0">Định nghĩa các loại phòng và định dạng phim áp dụng toàn chuỗi</p>
    </div>

    <ul class="nav nav-pills mb-4" id="masterDataTabs">
        <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#format-pane" onclick="loadFormats()">ĐỊNH DẠNG PHIM</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#room-type-pane" onclick="loadRoomTypes()">LOẠI PHÒNG CHIẾU</button>
        </li>
    </ul>

    <div class="tab-content">
        <!-- Tab: Formats -->
        <div class="tab-pane fade show active" id="format-pane">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="m-0 fw-bold">Danh sách định dạng</h5>
                <button class="btn-add" onclick="showFormatModal()">THÊM ĐỊNH DẠNG</button>
            </div>
            <div class="custom-table">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Tên định dạng</th>
                            <th>Mô tả kỹ thuật</th>
                            <th class="text-end">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="formatTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Tab: Room Types -->
        <div class="tab-pane fade" id="room-type-pane">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="m-0 fw-bold">Danh sách loại phòng</h5>
                <button class="btn-add" onclick="showRoomTypeModal()">THÊM LOẠI PHÒNG</button>
            </div>
            <div class="custom-table">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Mã loại</th>
                            <th>Tên hiển thị</th>
                            <th>Định dạng hỗ trợ</th>
                            <th class="text-end">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="roomTypeTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<!-- Modal Format -->
<div class="modal fade" id="formatModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold">Định dạng phim</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body pt-4">
                <form id="formatForm">
                    <div class="mb-3">
                        <label class="form-label">Tên (VD: IMAX, 4DX)</label>
                        <input type="text" id="formatName" class="form-control form-control-custom" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mô tả</label>
                        <textarea id="formatDesc" class="form-control form-control-custom" rows="3"></textarea>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-danger py-2 fw-bold">LƯU ĐỊNH DẠNG</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Modal Room Type -->
<div class="modal fade" id="roomTypeModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold">Loại phòng chiếu</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body pt-4">
                <form id="roomTypeForm">
                    <div class="mb-3">
                        <label class="form-label">Mã loại (VD: HALL_2D, IMAX)</label>
                        <input type="text" id="roomTypeId" class="form-control form-control-custom" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tên hiển thị</label>
                        <input type="text" id="roomTypeName" class="form-control form-control-custom" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Định dạng hỗ trợ</label>
                        <div id="formatCheckboxes" class="d-flex flex-wrap gap-3 p-3 border border-secondary rounded">
                            <!-- JS loaded checkboxes -->
                        </div>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-danger py-2 fw-bold">LƯU LOẠI PHÒNG</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/sidebar.js"></script>
<script>
    AuthGuard.requireRole(['ADMIN']);
    let formatModal, roomTypeModal;
    let editFormatId = null, editRoomTypeId = null;
    let allFormats = [];

    document.addEventListener('DOMContentLoaded', () => {
        formatModal = new bootstrap.Modal(document.getElementById('formatModal'));
        roomTypeModal = new bootstrap.Modal(document.getElementById('roomTypeModal'));
        loadFormats();

        document.getElementById('formatForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = { name: document.getElementById('formatName').value, description: document.getElementById('formatDesc').value };
            const url = editFormatId ? `/public/master-data/formats/${editFormatId}` : '/public/master-data/formats';
            const method = editFormatId ? 'put' : 'post';
            if ((await api[method](url, data)).success) { formatModal.hide(); loadFormats(); }
        });

        document.getElementById('roomTypeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const selectedFormats = Array.from(document.querySelectorAll('#formatCheckboxes input:checked')).map(cb => ({ id: parseInt(cb.value) }));
            const data = { id: document.getElementById('roomTypeId').value, name: document.getElementById('roomTypeName').value, supportedFormats: selectedFormats };
            const url = editRoomTypeId ? `/public/master-data/room-types/${editRoomTypeId}` : '/public/master-data/room-types';
            const method = editRoomTypeId ? 'put' : 'post';
            if ((await api[method](url, data)).success) { roomTypeModal.hide(); loadRoomTypes(); }
        });
    });

    async function loadFormats() {
        const response = await api.get('/public/master-data/formats');
        if (response.success) {
            allFormats = response.data;
            document.getElementById('formatTableBody').innerHTML = allFormats.map(f => `
                <tr>
                    <td><span class="badge bg-danger">${f.name}</span></td>
                    <td>${f.description || '<em class="text-muted">Không có mô tả</em>'}</td>
                    <td class="text-end">
                        <button class="action-btn me-2" onclick="editFormat(${f.id})"><i class="bi bi-pencil"></i></button>
                        <button class="action-btn text-danger" onclick="deleteFormat(${f.id})"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
            `).join('');
            renderFormatCheckboxes();
        }
    }

    async function loadRoomTypes() {
        const response = await api.get('/public/master-data/room-types');
        if (response.success) {
            document.getElementById('roomTypeTableBody').innerHTML = response.data.map(rt => `
                <tr>
                    <td><code>${rt.id}</code></td>
                    <td><div class="fw-bold">${rt.name}</div></td>
                    <td>${rt.supportedFormats.map(f => `<span class="badge border border-secondary text-secondary me-1">${f.name}</span>`).join('')}</td>
                    <td class="text-end">
                        <button class="action-btn me-2" onclick="editRoomType('${rt.id}')"><i class="bi bi-pencil"></i></button>
                        <button class="action-btn text-danger" onclick="deleteRoomType('${rt.id}')"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }
    }

    function renderFormatCheckboxes() {
        document.getElementById('formatCheckboxes').innerHTML = allFormats.map(f => `
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="${f.id}" id="fmt-${f.id}">
                <label class="form-check-label" for="fmt-${f.id}">${f.name}</label>
            </div>
        `).join('');
    }

    function showFormatModal() { editFormatId = null; document.getElementById('formatForm').reset(); formatModal.show(); }
    function editFormat(id) {
        const f = allFormats.find(x => x.id === id);
        if (f) { editFormatId = id; document.getElementById('formatName').value = f.name; document.getElementById('formatDesc').value = f.description; formatModal.show(); }
    }
    async function deleteFormat(id) { if (confirm('Xóa định dạng này?')) { await api.delete(`/public/master-data/formats/${id}`); loadFormats(); } }

    async function showRoomTypeModal() {
        editRoomTypeId = null; document.getElementById('roomTypeForm').reset(); 
        document.getElementById('roomTypeId').disabled = false;
        document.querySelectorAll('#formatCheckboxes input').forEach(cb => cb.checked = false);
        roomTypeModal.show();
    }
    async function editRoomType(id) {
        const res = await api.get('/public/master-data/room-types');
        const rt = res.data.find(x => x.id === id);
        if (rt) {
            editRoomTypeId = id;
            document.getElementById('roomTypeId').value = rt.id;
            document.getElementById('roomTypeId').disabled = true;
            document.getElementById('roomTypeName').value = rt.name;
            document.querySelectorAll('#formatCheckboxes input').forEach(cb => {
                cb.checked = rt.supportedFormats.some(sf => sf.id == cb.value);
            });
            roomTypeModal.show();
        }
    }
</script>
</body>
</html>
