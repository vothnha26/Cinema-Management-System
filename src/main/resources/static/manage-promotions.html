<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Khuyến mãi – StarCinema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <link rel="icon" type="image/png" href="/favicon.png?v=2">
    <style>
        :root {
          --bg: #080B14; --surface: #0F1320; --card: #161B2E; --border: #252A3D;
          --accent: #E5133A; --accent-gold: #F5A623; --text: #E8EAF0; --text-muted: #7B82A0;
          --gradient: linear-gradient(135deg, #E5133A, #8B0020);
          --sidebar-width: 260px;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; overflow-x: hidden; }
        .sidebar { width: var(--sidebar-width); background: var(--surface); border-right: 1px solid var(--border); height: 100vh; position: fixed; top: 0; left: 0; z-index: 1000; padding: 24px; display: flex; flex-direction: column; }
        .brand { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 3px; color: var(--text); margin-bottom: 40px; text-decoration: none; }
        .brand span { color: var(--accent); }
        .nav-link-admin { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text-muted); text-decoration: none; border-radius: 10px; transition: all 0.2s; font-weight: 500; margin-bottom: 8px; }
        .nav-link-admin:hover, .nav-link-admin.active { background: rgba(229,19,58,0.1); color: var(--accent); }
        .nav-link-admin.active { background: var(--gradient); color: #fff; }
        .user-panel { border-top: 1px solid var(--border); padding-top: 20px; margin-top: auto; }

        .main-content { margin-left: var(--sidebar-width); padding: 40px; min-height: 100vh; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; letter-spacing: 1px; margin: 0; }

        .btn-add { background: var(--gradient); border: none; color: #fff; padding: 10px 24px; border-radius: 10px; font-weight: 600; transition: opacity 0.2s; }
        .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
        .table { margin: 0; color: var(--text); }
        .table thead th { background: var(--surface); padding: 16px 24px; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid var(--border); }
        .table tbody td { padding: 16px 24px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        
        .promo-code-badge { background: rgba(229,19,58,0.15); color: var(--accent); padding: 4px 12px; border-radius: 6px; font-weight: 700; font-family: monospace; border: 1px solid rgba(229,19,58,0.3); }
        .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 20px; color: var(--text); }
        .form-control, .form-select { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 10px; }
        .form-control:focus, .form-select:focus { border-color: var(--accent); background: var(--surface); color: #fff; outline: none; box-shadow: none; }
    </style>
</head>
<body>

<aside class="sidebar"></aside>

<main class="main-content">
    <div class="header-section">
        <div>
            <h1 class="page-title">Quản lý Khuyến mãi</h1>
            <p class="text-muted m-0">Voucher giảm giá và các chương trình ưu đãi.</p>
        </div>
        <button class="btn-add" onclick="openAddModal()">
            <i class="bi bi-plus-lg me-2"></i> TẠO VOUCHER MỚI
        </button>
    </div>

    <div class="table-container">
        <table class="table">
            <thead>
                <tr>
                    <th>Mã Voucher</th>
                    <th>Tên chương trình</th>
                    <th>Loại giảm</th>
                    <th>Hạng tối thiểu</th>
                    <th>Đổi điểm</th>
                    <th>Trạng thái</th>
                    <th class="text-end">Thao tác</th>
                </tr>
            </thead>
            <tbody id="promoTableBody">
                <tr><td colspan="7" class="text-center py-5 text-muted">Đang nạp danh sách khuyến mãi...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<!-- MODAL -->
<div class="modal fade" id="promoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">THÔNG TIN VOUCHER</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form id="promoForm">
                    <input type="hidden" id="promoId">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted">Mã Voucher *</label>
                            <input type="text" name="code" class="form-control" required placeholder="VD: SUMMER24">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted">Tên chương trình *</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted">Loại giảm giá</label>
                            <select name="discountType" class="form-select" onchange="toggleMaxDiscount()">
                                <option value="PERCENT">Giảm theo %</option>
                                <option value="FIXED">Giảm số tiền cố định</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted">Giá trị giảm *</label>
                            <input type="number" name="discountValue" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted">Đơn hàng tối thiểu (VNĐ)</label>
                            <input type="number" name="minOrderAmount" class="form-control" value="0">
                        </div>
                        <div class="col-md-6" id="maxDiscountWrap">
                            <label class="form-label small fw-bold text-muted">Giảm tối đa (VNĐ)</label>
                            <input type="number" name="maxDiscountAmount" class="form-control" value="100000">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted">Hạng tối thiểu</label>
                            <select name="minTier" class="form-select">
                                <option value="STANDARD">STANDARD</option>
                                <option value="SILVER">SILVER</option>
                                <option value="GOLD">GOLD</option>
                                <option value="PLATINUM">PLATINUM</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-info">Điểm đổi (0 nếu free)</label>
                            <input type="number" name="requiredPoints" class="form-control border-info" value="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-muted">Lượt dùng tối đa</label>
                            <input type="number" name="usageLimit" class="form-control" value="1000">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-muted">Ngày bắt đầu *</label>
                            <input type="date" name="startDate" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-muted">Ngày kết thúc *</label>
                            <input type="date" name="endDate" class="form-control" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Hủy</button>
                <button type="button" class="btn btn-danger px-4 fw-bold" onclick="savePromo()">LƯU VOUCHER</button>
            </div>
        </div>
    </div>
</div>

<script src="/js/auth-guard.js"></script>
<script>AuthGuard.requireRole(['MANAGER']);</script>
<script src="/js/sidebar.js"></script>
<script src="/js/api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let promoModal;
    let allPromos = [];

    document.addEventListener('DOMContentLoaded', () => {
        promoModal = new bootstrap.Modal(document.getElementById('promoModal'));
        loadPromos();
    });

    async function loadPromos() {
        try {
            const res = await api.get('/promotions');
            if (res.success && Array.isArray(res.data)) {
                allPromos = res.data;
                const tbody = document.getElementById('promoTableBody');
                if (allPromos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">Chưa có mã khuyến mãi nào được tạo.</td></tr>';
                    return;
                }
                tbody.innerHTML = allPromos.map(p => {
                    const discountStr = p.discountType === 'PERCENT' ? `${p.discountValue}%` : `${new Intl.NumberFormat('vi-VN').format(p.discountValue)}đ`;
                    return `
                        <tr>
                            <td><span class="promo-code-badge">${p.code}</span></td>
                            <td>
                                <div class="fw-bold">${p.name}</div>
                                <div class="small text-muted">Hạn: ${p.startDate} đến ${p.endDate}</div>
                            </td>
                            <td class="text-warning fw-bold">${discountStr}</td>
                            <td><span class="badge bg-dark border border-secondary">${p.minTier || 'STANDARD'}</span></td>
                            <td><span class="text-info">${p.requiredPoints || 0} pts</span></td>
                            <td><span class="badge ${p.isActive ? 'bg-success' : 'bg-danger'}">${p.isActive ? 'Đang chạy' : 'Vô hiệu'}</span></td>
                            <td class="text-end">
                                <button class="action-btn btn btn-sm btn-outline-light" onclick="editPromo(${p.id})"><i class="bi bi-pencil"></i></button>
                                <button class="action-btn btn btn-sm btn-outline-danger ms-1" onclick="deletePromo(${p.id})"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                    `;
                }).join('');
            }
        } catch (error) { console.error(error); }
    }

    function toggleMaxDiscount() {
        const type = document.querySelector('[name="discountType"]').value;
        document.getElementById('maxDiscountWrap').style.display = type === 'PERCENT' ? 'block' : 'none';
    }

    function openAddModal() {
        document.getElementById('promoForm').reset();
        document.getElementById('promoId').value = '';
        document.getElementById('modalTitle').innerText = 'TẠO VOUCHER MỚI';
        toggleMaxDiscount();
        promoModal.show();
    }

    function editPromo(id) {
        const p = allPromos.find(x => x.id === id);
        if (!p) return;
        const f = document.getElementById('promoForm');
        document.getElementById('promoId').value = p.id;
        f.querySelector('[name="code"]').value = p.code;
        f.querySelector('[name="name"]').value = p.name;
        f.querySelector('[name="discountType"]').value = p.discountType;
        f.querySelector('[name="discountValue"]').value = p.discountValue;
        f.querySelector('[name="minOrderAmount"]').value = p.minOrderAmount || 0;
        f.querySelector('[name="maxDiscountAmount"]').value = p.maxDiscountAmount || 0;
        f.querySelector('[name="usageLimit"]').value = p.usageLimit || 1000;
        f.querySelector('[name="minTier"]').value = p.minTier;
        f.querySelector('[name="requiredPoints"]').value = p.requiredPoints || 0;
        f.querySelector('[name="startDate"]').value = p.startDate;
        f.querySelector('[name="endDate"]').value = p.endDate;
        document.getElementById('modalTitle').innerText = 'CẬP NHẬT VOUCHER';
        toggleMaxDiscount();
        promoModal.show();
    }

    async function savePromo() {
        const id = document.getElementById('promoId').value;
        const f = document.getElementById('promoForm');
        
        const data = {
            code: f.querySelector('[name="code"]').value.trim(),
            name: f.querySelector('[name="name"]').value.trim(),
            discountType: f.querySelector('[name="discountType"]').value,
            discountValue: parseFloat(f.querySelector('[name="discountValue"]').value),
            minOrderAmount: parseFloat(f.querySelector('[name="minOrderAmount"]').value) || 0,
            maxDiscountAmount: parseFloat(f.querySelector('[name="maxDiscountAmount"]').value) || 0,
            usageLimit: parseInt(f.querySelector('[name="usageLimit"]').value) || 1000,
            minTier: f.querySelector('[name="minTier"]').value,
            requiredPoints: parseInt(f.querySelector('[name="requiredPoints"]').value) || 0,
            isRedeemable: parseInt(f.querySelector('[name="requiredPoints"]').value) > 0,
            startDate: f.querySelector('[name="startDate"]').value,
            endDate: f.querySelector('[name="endDate"]').value,
            isActive: true
        };

        if (!data.code || !data.name || isNaN(data.discountValue) || !data.startDate || !data.endDate) {
            alert('Vui lòng điền đầy đủ các thông tin bắt buộc (*)');
            return;
        }

        try {
            const res = await (id ? api.put(`/promotions/${id}`, data) : api.post('/promotions', data));
            if (res.success) {
                promoModal.hide();
                loadPromos();
                alert('Lưu thành công!');
            } else alert('Lỗi: ' + res.message);
        } catch (e) { alert('Lỗi máy chủ khi lưu.'); }
    }

    async function deletePromo(id) {
        if (confirm('Xóa mã giảm giá này?')) {
            const res = await api.delete(`/promotions/${id}`);
            if (res.success) loadPromos();
        }
    }
</script>
</body>
</html>
