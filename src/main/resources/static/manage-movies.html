<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarCinema – Quản Lý Phim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <link rel="icon" type="image/png" href="/favicon.png?v=2">
    <style>
        :root {
          --bg: #080B14; --surface: #0F1320; --card: #161B2E; --border: #252A3D;
          --accent: #E5133A; --accent-gold: #F5A623; --text: #E8EAF0; --text-muted: #7B82A0;
          --gradient: linear-gradient(135deg, #E5133A, #8B0020);
          --sidebar-width: 260px;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; overflow-x: hidden; }
        
        /* ── SIDEBAR ── */
        .sidebar {
          width: var(--sidebar-width); background: var(--surface); border-right: 1px solid var(--border);
          height: 100vh; position: fixed; top: 0; left: 0; z-index: 1000; padding: 24px;
          display: flex; flex-direction: column;
        }
        .brand { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 3px; color: var(--text); margin-bottom: 40px; text-decoration: none; display: block; }
        .brand span { color: var(--accent); }
        .nav-menu { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
        .nav-item { margin-bottom: 8px; }
        .nav-link-admin {
          display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text-muted);
          text-decoration: none; border-radius: 10px; transition: all 0.2s; font-weight: 500;
        }
        .nav-link-admin:hover, .nav-link-admin.active { background: rgba(229,19,58,0.1); color: var(--accent); }
        .nav-link-admin.active { background: var(--gradient); color: #fff; }

        .user-panel { border-top: 1px solid var(--border); padding-top: 20px; margin-top: 20px; }
        .admin-profile { display: flex; align-items: center; gap: 12px; }
        .admin-avatar {
          width: 40px; height: 40px; border-radius: 10px; background: var(--gradient);
          display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff;
        }

        /* ── MAIN CONTENT ── */
        .main-content { margin-left: var(--sidebar-width); padding: 40px; min-height: 100vh; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; letter-spacing: 1px; margin: 0; }

        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 16px; }
        .search-box { position: relative; flex: 1; max-width: 400px; }
        .search-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-box input {
          width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text);
          padding: 10px 16px 10px 44px; border-radius: 12px; outline: none; transition: border-color 0.2s;
        }
        .search-box input:focus { border-color: var(--accent); }
        
        .btn-add {
          background: var(--gradient); color: #fff; border: none; padding: 10px 24px;
          border-radius: 10px; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: opacity 0.2s;
        }
        .btn-add:hover { opacity: 0.9; color: #fff; }

        /* ── MOVIE TABLE ── */
        .custom-table { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
        .table { margin: 0; color: var(--text); border-color: var(--border); }
        .table thead { background: var(--surface); }
        .table th { border: none; padding: 16px 24px; color: var(--text-muted); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; }
        .table td { border-top: 1px solid var(--border); padding: 16px 24px; vertical-align: middle; }
        
        .movie-thumb { width: 45px; height: 65px; border-radius: 6px; object-fit: cover; background: var(--border); }
        .status-badge { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
        .badge-showing { background: rgba(80,200,100,0.1); color: #50C864; }
        .badge-coming { background: rgba(245,166,35,0.1); color: var(--accent-gold); }
        
        .action-btn {
          width: 32px; height: 32px; border-radius: 8px; display: inline-flex; align-items: center;
          justify-content: center; border: 1px solid var(--border); color: var(--text-muted);
          transition: all 0.2s; cursor: pointer; background: transparent;
        }
        .btn-edit:hover { background: rgba(100,180,255,0.1); color: #64B4FF; border-color: #64B4FF; }
        .btn-delete:hover { background: rgba(229,19,58,0.1); color: var(--accent); border-color: var(--accent); }

        /* ── MODAL ── */
        .modal-content { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; color: var(--text); }
        .modal-header { border-bottom: 1px solid var(--border); padding: 24px; }
        .modal-footer { border-top: 1px solid var(--border); padding: 20px 24px; }
        .form-label { color: var(--text-muted); font-weight: 500; font-size: 0.9rem; margin-bottom: 8px; }
        .form-control, .form-select { background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px 14px; }
        .form-control:focus, .form-select:focus { background: var(--card); border-color: var(--accent); color: var(--text); box-shadow: none; }
        
        .poster-preview-box {
          width: 100%; aspect-ratio: 2/3; border: 2px dashed var(--border);
          border-radius: 12px; display: flex; flex-direction: column;
          align-items: center; justify-content: center; color: var(--text-muted);
          cursor: pointer; overflow: hidden; position: relative;
        }
        .poster-preview-box:hover { border-color: var(--accent); color: var(--accent); }
        .poster-preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }

        /* Genre Checkbox Styles */
        .genre-checkbox-item {
            background: var(--surface); border: 1px solid var(--border);
            padding: 6px 12px; border-radius: 8px; cursor: pointer;
            transition: all 0.2s; font-size: 0.85rem; user-select: none;
        }
        .genre-checkbox-item:hover { border-color: var(--accent); }
        .genre-checkbox-item input:checked + span { color: var(--accent); font-weight: 600; }
        .genre-checkbox-item.active { background: rgba(229,19,58,0.1); border-color: var(--accent); color: var(--accent); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    </style>
</head>
<body>

<aside class="sidebar">
    <a href="index.html" class="brand">STAR<span>CINEMA</span></a>
    <ul class="nav-menu">
        <li class="nav-item"><a href="dashboard.html" class="nav-link-admin"><i class="bi bi-grid-1x2-fill"></i> Bảng điều khiển</a></li>
        <li class="nav-item"><a href="manage-movies.html" class="nav-link-admin active"><i class="bi bi-film"></i> Quản lý phim</a></li>
        <li class="nav-item"><a href="manage-showtimes.html" class="nav-link-admin"><i class="bi bi-calendar-event"></i> Suất chiếu</a></li>
        <li class="nav-item"><a href="#" class="nav-link-admin"><i class="bi bi-ticket-perforated"></i> Quản lý vé</a></li>
        <li class="nav-item"><a href="manage-users.html" class="nav-link-admin"><i class="bi bi-people"></i> Người dùng</a></li>
        <li class="nav-item"><a href="#" class="nav-link-admin"><i class="bi bi-gear"></i> Cài đặt</a></li>
    </ul>
    <div class="user-panel">
        <div class="admin-profile">
            <div class="admin-avatar">AD</div>
            <div>
                <div style="font-size:0.9rem;font-weight:600">Admin User</div>
                <div style="font-size:0.75rem;color:var(--text-muted)">Quản trị viên</div>
            </div>
            <a href="#" class="ms-auto text-muted"><i class="bi bi-box-arrow-right"></i></a>
        </div>
    </div>
</aside>

<main class="main-content">
    <div class="header-section">
        <h1 class="page-title">Quản lý phim</h1>
    </div>

    <div class="toolbar">
        <div class="search-box">
            <i class="bi bi-search"></i>
            <input type="text" placeholder="Tìm kiếm phim theo tên, đạo diễn...">
        </div>
        <button class="btn-add" data-bs-toggle="modal" data-bs-target="#movieModal">
            <i class="bi bi-plus-lg"></i> Thêm phim mới
        </button>
    </div>

    <div class="custom-table">
        <table class="table">
            <thead>
                <tr>
                    <th>Phim</th>
                    <th>Thể loại</th>
                    <th>Thời lượng</th>
                    <th>Đánh giá</th>
                    <th>Trạng thái</th>
                    <th class="text-end">Thao tác</th>
                </tr>
            </thead>
            <tbody id="movieListBody">
                <!-- Data loaded via JS -->
            </tbody>
        </table>
    </div>
</main>

<!-- MODAL -->
<div class="modal fade" id="movieModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" style="font-family:'Outfit'">Thêm phim mới</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <div class="mb-4 pb-3 border-bottom">
                    <label class="form-label text-accent fw-bold"><i class="bi bi-search"></i> Tìm kiếm nhanh từ TMDB</label>
                    <div class="input-group">
                        <input type="text" id="tmdbSearchInput" class="form-control" placeholder="Nhập tên phim tiếng Việt hoặc tiếng Anh...">
                        <button class="btn btn-outline-danger" type="button" onclick="searchTMDB()">Tìm kiếm</button>
                    </div>
                    <div id="tmdbResults" class="mt-2 list-group" style="max-height: 200px; overflow-y: auto; display: none; position: absolute; z-index: 1050; width: calc(100% - 48px); box-shadow: 0 10px 30px rgba(0,0,0,0.5);"></div>
                </div>

                <form id="movieForm">
                    <input type="hidden" id="movieId">
                    <input type="hidden" id="tmdbId">
                    <input type="hidden" id="posterUrl">
                    <div class="row g-4">
                        <div class="col-md-4">
                            <label class="form-label">Poster phim</label>
                            <div class="poster-preview-box" onclick="document.getElementById('posterInput').click()">
                                <i class="bi bi-cloud-arrow-up mb-2" style="font-size:2rem"></i>
                                <span style="font-size:0.8rem">Tải ảnh lên (2:3)</span>
                                <img src="" class="poster-preview-img" id="posterPreview">
                            </div>
                            <input type="file" id="posterInput" hidden accept="image/*" onchange="previewImage(this)">
                        </div>
                        <div class="col-md-8">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label">Tên phim</label>
                                    <input type="text" name="title" class="form-control" placeholder="Nhập tên phim...">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Đạo diễn</label>
                                    <input type="text" name="director" class="form-control" placeholder="Tên đạo diễn...">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Thời lượng (phút)</label>
                                    <input type="number" name="duration" class="form-control" placeholder="Ví dụ: 120">
                                </div>
                                <div class="col-12">
                                    <label class="form-label d-block">Thể loại</label>
                                    <div id="genresContainer" class="d-flex flex-wrap gap-2 p-2 rounded-3" style="background: var(--card); border: 1px solid var(--border); max-height: 120px; overflow-y: auto;">
                                        <!-- Genres loaded via JS -->
                                    </div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Diễn viên</label>
                                    <input type="text" name="actors" class="form-control" placeholder="Các diễn viên chính...">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Trạng thái</label>
                                    <select name="status" class="form-select">
                                        <option value="SHOWING">Đang chiếu</option>
                                        <option value="COMING">Sắp chiếu</option>
                                        <option value="END">Ngừng chiếu</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Trailer URL</label>
                                    <input type="text" name="trailerUrl" class="form-control" placeholder="https://youtube.com/...">
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Mô tả phim</label>
                                    <textarea name="description" class="form-control" rows="3" placeholder="Tóm tắt nội dung phim..."></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-link text-muted text-decoration-none fw-600" data-bs-dismiss="modal">Hủy bỏ</button>
                <button type="button" class="btn btn-add px-4" onclick="saveMovie()">Lưu thông tin</button>
            </div>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const movieModal = new bootstrap.Modal(document.getElementById('movieModal'));
    let allMovies = [];
    let availableGenres = [];

    document.addEventListener('DOMContentLoaded', () => {
        init();
        const searchInput = document.querySelector('.search-box input');
        if (searchInput) searchInput.addEventListener('input', (e) => filterMovies(e.target.value));
    });

    async function init() {
        await loadGenres();
        await loadMovies();
    }

    async function loadGenres() {
        const res = await api.get('/genres');
        if (res.success) {
            availableGenres = res.data;
            const container = document.getElementById('genresContainer');
            container.innerHTML = availableGenres.map(g => `
                <label class="genre-checkbox-item">
                    <input type="checkbox" name="genreNames" value="${g.name}" class="d-none" onchange="toggleGenreUI(this)">
                    <span>${g.name}</span>
                </label>
            `).join('');
        }
    }

    function toggleGenreUI(checkbox) {
        if (checkbox.checked) checkbox.parentElement.classList.add('active');
        else checkbox.parentElement.classList.remove('active');
    }

    async function loadMovies() {
        const res = await api.get('/movies');
        if (res.success) {
            allMovies = res.data;
            renderMovies(allMovies);
        }
    }

    function renderMovies(movies) {
        const tbody = document.getElementById('movieListBody');
        tbody.innerHTML = movies.map(m => `
            <tr>
                <td>
                    <div class="d-flex align-items-center gap-3">
                        <img src="${m.posterUrl || 'https://via.placeholder.com/100x150'}" class="movie-thumb" alt="${m.title}">
                        <div>
                            <div class="fw-bold text-white">${m.title}</div>
                            <div style="font-size:0.8rem; color:var(--text-muted)">Đạo diễn: ${m.director || 'N/A'}</div>
                        </div>
                    </div>
                </td>
                <td><small>${(m.genres || []).join(', ') || 'N/A'}</small></td>
                <td>${m.duration} phút</td>
                <td><span class="text-warning">★ ${m.rating || 0}</span></td>
                <td><span class="status-badge ${m.status === 'SHOWING' ? 'badge-showing' : 'badge-coming'}">${m.status}</span></td>
                <td class="text-end">
                    <button class="action-btn btn-edit me-1" onclick="editMovie(${m.id})"><i class="bi bi-pencil-square"></i></button>
                    <button class="action-btn btn-delete" onclick="deleteMovie(${m.id})"><i class="bi bi-trash"></i></button>
                </td>
            </tr>
        `).join('');
    }

    function filterMovies(query) {
        const filtered = allMovies.filter(m => m.title.toLowerCase().includes(query.toLowerCase()));
        renderMovies(filtered);
    }

    async function searchTMDB() {
        const query = document.getElementById('tmdbSearchInput').value;
        if (!query) return;
        const resultsEl = document.getElementById('tmdbResults');
        resultsEl.innerHTML = '<div class="list-group-item bg-dark text-white">Đang tìm...</div>';
        resultsEl.style.display = 'block';
        const res = await api.get(`/tmdb/search?query=${encodeURIComponent(query)}`);
        if (res && res.results) {
            resultsEl.innerHTML = res.results.map(m => `
                <button type="button" class="list-group-item list-group-item-action bg-dark text-white border-secondary" onclick="fillFromTMDB(${m.id})">
                    <div class="d-flex align-items-center">
                        <img src="${m.poster_path}" style="width:40px; height:60px; object-fit:cover; margin-right:10px;" onerror="this.src='https://via.placeholder.com/40x60'">
                        <div><div class="fw-bold">${m.title}</div><div class="small text-muted">${m.release_date || 'N/A'}</div></div>
                    </div>
                </button>
            `).join('');
        }
    }

    async function fillFromTMDB(id) {
        document.getElementById('tmdbResults').style.display = 'none';
        const m = await api.get(`/tmdb/movie/${id}`);
        if (m) {
            const form = document.getElementById('movieForm');
            form.title.value = m.title || '';
            form.description.value = m.overview || '';
            form.duration.value = m.runtime || 120;
            form.director.value = (m.credits?.crew?.find(c => c.job === 'Director'))?.name || '';
            form.actors.value = m.credits?.cast?.slice(0, 5).map(c => c.name).join(', ') || '';
            document.getElementById('tmdbId').value = m.id;
            
            // Genre Mapping: TMDB (English) -> StarCinema (Vietnamese)
            const genreMap = {
                'Action': 'Hành động', 'Adventure': 'Phiêu lưu', 'Animation': 'Hoạt hình',
                'Comedy': 'Hài', 'Crime': 'Tội phạm', 'Documentary': 'Tài liệu',
                'Drama': 'Chính kịch', 'Family': 'Gia đình', 'Fantasy': 'Viễn tưởng',
                'History': 'Lịch sử', 'Horror': 'Kinh dị', 'Music': 'Âm nhạc',
                'Mystery': 'Bí ẩn', 'Romance': 'Lãng mạn', 'Science Fiction': 'Viễn tưởng',
                'TV Movie': 'Phim TV', 'Thriller': 'Gây cấn', 'War': 'Chiến tranh', 'Western': 'Miền tây'
            };

            // Backend now returns 'genres' as a list of objects after DTO update
            if (m.genres && m.genres.length > 0) {
                const tmdbGenreNames = m.genres.map(g => g.name);
                const mappedGenres = tmdbGenreNames.map(name => genreMap[name] || name).map(n => n.toLowerCase());

                document.querySelectorAll('input[name="genreNames"]').forEach(cb => {
                    cb.checked = mappedGenres.includes(cb.value.toLowerCase());
                    toggleGenreUI(cb);
                });
            } else if (m.genre_ids) {
                // Fallback to genre_ids if needed (but DTO update should provide genres)
                console.warn('Backend returned genre_ids instead of genres objects');
            }

            // Backend returns 'poster_path' or 'posterPath' (Spring Boot/Jackson behavior)
            const posterPath = m.poster_path || m.posterPath;
            if (posterPath) {
                document.getElementById('posterUrl').value = posterPath;
                const preview = document.getElementById('posterPreview');
                preview.src = posterPath; 
                preview.style.display = 'block';
                document.querySelector('.poster-preview-box i').style.display = 'none';
                document.querySelector('.poster-preview-box span').style.display = 'none';
            }
            alert('Đã đồng bộ từ TMDB thành công!');
        }
    }

    function editMovie(id) {
        const movie = allMovies.find(m => m.id === id);
        if (!movie) return;
        document.querySelector('#movieModal .modal-title').innerText = 'Sửa thông tin phim';
        document.getElementById('movieId').value = movie.id;
        document.getElementById('tmdbId').value = movie.tmdbId || '';
        document.getElementById('posterUrl').value = movie.posterUrl || '';
        
        const form = document.getElementById('movieForm');
        form.title.value = movie.title;
        form.description.value = movie.description || '';
        form.duration.value = movie.duration;
        form.director.value = movie.director || '';
        form.actors.value = movie.actors || '';
        form.status.value = movie.status;
        form.trailerUrl.value = movie.trailerUrl || '';

        // Check genres
        const movieGenres = movie.genres.map(g => g.toLowerCase());
        document.querySelectorAll('input[name="genreNames"]').forEach(cb => {
            cb.checked = movieGenres.includes(cb.value.toLowerCase());
            toggleGenreUI(cb);
        });

        const preview = document.getElementById('posterPreview');
        if (movie.posterUrl) {
            preview.src = movie.posterUrl; preview.style.display = 'block';
            document.querySelector('.poster-preview-box i').style.display = 'none';
            document.querySelector('.poster-preview-box span').style.display = 'none';
        }
        movieModal.show();
    }

    async function saveMovie() {
        const id = document.getElementById('movieId').value;
        const form = document.getElementById('movieForm');
        
        const selectedGenres = Array.from(document.querySelectorAll('input[name="genreNames"]:checked')).map(cb => cb.value);

        const movieData = {
            title: form.title.value.trim(),
            description: form.description.value.trim(),
            duration: parseInt(form.duration.value) || 0,
            status: form.status.value,
            director: form.director.value.trim(),
            actors: form.actors.value.trim(),
            genres: selectedGenres,
            posterUrl: document.getElementById('posterUrl').value.trim(),
            trailerUrl: form.trailerUrl.value.trim(),
            tmdbId: parseInt(document.getElementById('tmdbId').value) || null,
            rating: 8.5
        };

        if (!movieData.title || movieData.duration <= 0) return alert('Vui lòng điền đủ thông tin!');

        const formData = new FormData();
        formData.append('movie', new Blob([JSON.stringify(movieData)], { type: 'application/json' }));
        const fileInput = document.getElementById('posterInput');
        if (fileInput.files && fileInput.files[0]) formData.append('poster', fileInput.files[0]);

        const res = await (id ? api.put(`/movies/${id}`, formData, true) : api.post('/movies', formData, true));
        if (res.success) {
            movieModal.hide(); loadMovies();
            alert('Thao tác thành công!');
            resetForm();
        } else alert('Lỗi: ' + res.message);
    }

    function resetForm() {
        document.getElementById('movieId').value = '';
        document.getElementById('tmdbId').value = '';
        document.getElementById('posterUrl').value = '';
        document.getElementById('movieForm').reset();
        document.querySelectorAll('input[name="genreNames"]').forEach(cb => { cb.checked = false; toggleGenreUI(cb); });
        document.getElementById('posterPreview').style.display = 'none';
        document.querySelector('.poster-preview-box i').style.display = 'block';
        document.querySelector('.poster-preview-box span').style.display = 'block';
        document.querySelector('#movieModal .modal-title').innerText = 'Thêm phim mới';
    }

    document.getElementById('movieModal').addEventListener('hidden.bs.modal', resetForm);

    async function deleteMovie(id) {
        if (confirm('Xóa phim này?')) {
            const res = await api.delete(`/movies/${id}`);
            if (res.success) loadMovies();
        }
    }

    function previewImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const preview = document.getElementById('posterPreview');
                preview.src = e.target.result; preview.style.display = 'block';
                document.querySelector('.poster-preview-box i').style.display = 'none';
                document.querySelector('.poster-preview-box span').style.display = 'none';
                document.getElementById('posterUrl').value = '';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
</body>
</html>
