<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Phim – StarCinema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <link rel="icon" type="image/png" href="/favicon.png?v=2">
    <style>
        :root {
          --bg: #080B14; --surface: #0F1320; --card: #161B2E; --border: #252A3D;
          --accent: #E5133A; --accent-gold: #F5A623; --text: #E8EAF0; --text-muted: #7B82A0;
          --gradient: linear-gradient(135deg, #E5133A, #8B0020);
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; overflow-x: hidden; }

        .main-content { padding: 40px; min-height: 100vh; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; letter-spacing: 1px; margin: 0; }

        .tool-bar { display: flex; gap: 16px; margin-bottom: 24px; }
        .search-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 8px 16px; display: flex; align-items: center; gap: 10px; flex: 1; }
        .search-box input { background: transparent; border: none; color: var(--text); outline: none; width: 100%; font-size: 0.9rem; }
        .btn-add { background: var(--gradient); border: none; color: #fff; padding: 10px 24px; border-radius: 10px; font-weight: 600; transition: opacity 0.2s; }
        
        .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
        .table { margin: 0; color: var(--text); border-collapse: separate; border-spacing: 0; }
        .table thead th { background: var(--surface); border-bottom: 1px solid var(--border); color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; padding: 16px 24px; font-weight: 600; }
        .table tbody td { padding: 16px 24px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 0.9rem; }
        .movie-poster-sm { width: 45px; height: 65px; border-radius: 6px; object-fit: cover; background: var(--surface); }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .badge-showing { background: rgba(80,200,100,0.15); color: #50C864; }
        .badge-coming { background: rgba(100,180,255,0.15); color: #64B4FF; }
        .badge-stopped { background: rgba(229,19,58,0.15); color: var(--accent); }
        .action-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); display: inline-flex; align-items: center; justify-content: center; transition: 0.2s; cursor: pointer; }
        .action-btn:hover { border-color: var(--accent); color: var(--accent); }

        .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 20px; color: var(--text); }
        .form-label { color: var(--text-muted); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
        .form-control, .form-select { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 12px 16px; border-radius: 10px; }
        .poster-preview-box { width: 100%; aspect-ratio: 2/3; border: 2px dashed var(--border); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden; }
        .poster-preview-box img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
        .checkbox-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .checkbox-item { cursor: pointer; }
        .checkbox-item input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }
        .checkbox-item span { display: inline-block; padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border); font-size: 0.8rem; color: var(--text-muted); transition: 0.2s; }
        #tmdbResults { position: absolute; top: 100%; left: 0; right: 0; z-index: 1050; max-height: 300px; overflow-y: auto; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<aside class=\"sidebar\"></aside>

<main class="main-content">
    <div class="header-section">
        <div>
            <h1 class="page-title">Quản lý phim</h1>
            <p class="text-muted m-0">Danh sách phim trong hệ thống</p>
        </div>
        <button class="btn-add" onclick="openAddModal()">
            <i class="bi bi-plus-lg me-2"></i> THÊM PHIM MỚI
        </button>
    </div>

    <div class="tool-bar">
        <div class="search-box">
            <i class="bi bi-search text-muted"></i>
            <input type="text" id="searchTitle" placeholder="Tìm kiếm phim theo tiêu đề..." onkeyup="applyFilters()">
        </div>
        <select id="filterStatus" class="form-select w-auto" style="min-width: 150px; background-color: var(--card);" onchange="applyFilters()">
            <option value="">Tất cả trạng thái</option>
            <option value="SHOWING">Đang chiếu</option>
            <option value="COMING">Sắp chiếu</option>
            <option value="STOPPED">Ngưng chiếu</option>
        </select>
    </div>

    <div class="table-container">
        <table class="table">
            <thead>
                <tr>
                    <th>Thông tin phim</th>
                    <th>Thể loại</th>
                    <th>Thời lượng</th>
                    <th>Đánh giá</th>
                    <th>Trạng thái</th>
                    <th class="text-end">Thao tác</th>
                </tr>
            </thead>
            <tbody id="movieTableBody">
                <tr><td colspan="6" class="text-center py-5 text-muted">Đang tải dữ liệu phim...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<!-- MODAL -->
<div class="modal fade" id="movieModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">THÊM PHIM MỚI</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div class="row g-4">
                    <div class="col-md-4">
                        <label class="form-label">Ảnh Poster</label>
                        <div class="poster-preview-box" onclick="document.getElementById('posterInput').click()">
                            <i class="bi bi-cloud-arrow-up fs-1 text-muted"></i>
                            <span class="text-muted mt-2">Chọn ảnh từ máy tính</span>
                            <img id="posterPreview" style="display: none;">
                        </div>
                        <input type="file" id="posterInput" class="d-none" accept="image/*" onchange="previewImage(this)">
                        <input type="hidden" id="posterUrl">
                        <input type="hidden" id="tmdbId">
                        <input type="hidden" id="movieId">
                        <input type="hidden" id="directorAvatarUrl">
                        <input type="hidden" id="actorAvatarUrls">
                        
                        <div class="mt-4">
                            <label class="form-label text-info"><i class="bi bi-search"></i> Tích hợp TMDB</label>
                            <div class="input-group">
                                <input type="text" id="tmdbSearchInput" class="form-control" placeholder="Tìm tên phim...">
                                <button class="btn btn-secondary" onclick="searchTMDB()"><i class="bi bi-search"></i></button>
                            </div>
                            <div id="tmdbResults" class="list-group"></div>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <form id="movieForm">
                            <div class="row g-3">
                                <div class="col-md-12"><label class="form-label">Tiêu đề phim</label><input type="text" name="title" class="form-control" required></div>
                                <div class="col-md-12"><label class="form-label">Mô tả nội dung</label><textarea name="description" class="form-control" rows="3"></textarea></div>
                                <div class="col-md-4"><label class="form-label">Thời lượng (phút)</label><input type="number" name="duration" class="form-control" required></div>
                                <div class="col-md-4"><label class="form-label">Ngày phát hành</label><input type="date" id="releaseDate" class="form-control" required></div>
                                <div class="col-md-4"><label class="form-label">Độ tuổi</label><select name="ageRating" class="form-select"><option value="P">P - Mọi độ tuổi</option><option value="C13">C13</option><option value="C16">C16</option><option value="C18">C18</option></select></div>
                                <div class="col-md-4"><label class="form-label">Đánh giá</label><input type="number" name="rating" class="form-control" step="0.1" value="0"></div>
                                <div class="col-md-4"><label class="form-label text-info">Ưu tiên (1-10)</label><input type="number" name="priorityLevel" class="form-control border-info" value="1"></div>
                                <div class="col-md-4"><label class="form-label">Trạng thái</label><select name="status" class="form-select"><option value="COMING">Sắp chiếu</option><option value="SHOWING">Đang chiếu</option><option value="STOPPED">Ngưng chiếu</option></select></div>
                                <div class="col-md-6"><label class="form-label">Đạo diễn</label><input type="text" name="director" class="form-control"></div>
                                <div class="col-md-12"><label class="form-label">Diễn viên chính (cách nhau bởi dấu phẩy)</label><input type="text" name="actors" class="form-control"></div>
                                <div class="col-md-12"><label class="form-label">Trailer URL (YouTube)</label><input type="text" name="trailerUrl" class="form-control"></div>
                                
                                <div class="col-md-12">
                                    <label class="form-label">Định dạng hỗ trợ</label>
                                    <div class="checkbox-container" id="formatsContainer">
                                        <!-- Loaded via JS from database -->
                                    </div>
                                </div>

                                <div class="col-md-12">
                                    <label class="form-label">Thể loại phim</label>
                                    <div class="checkbox-container" id="genresContainer">
                                        <!-- Loaded via JS -->
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">HỦY</button>
                <button type="button" class="btn btn-danger px-5 fw-bold" onclick="saveMovie()">LƯU PHIM</button>
            </div>
        </div>
    </div>
</div>

<script src="/js/auth-guard.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const movieModal = new bootstrap.Modal(document.getElementById('movieModal'));
    let allMovies = [], allGenres = [];

    document.addEventListener('DOMContentLoaded', init);

    async function init() {
        const [resG, resF] = await Promise.all([
            api.get('/genres'),
            api.get('/admin/master-data/formats')
        ]);

        if (resG.success) {
            allGenres = resG.data;
            document.getElementById('genresContainer').innerHTML = allGenres.map(g => `
                <label class="checkbox-item">
                    <input type="checkbox" name="genreNames" value="${g.name}" class="d-none">
                    <span>${g.name}</span>
                </label>
            `).join('');
        }

        if (resF.success) {
            document.getElementById('formatsContainer').innerHTML = resF.data.map(f => `
                <label class="checkbox-item">
                    <input type="checkbox" name="formats" value="${f.name}" class="d-none">
                    <span>${f.name}</span>
                </label>
            `).join('');
        }

        loadMovies();
    }

    async function loadMovies() {
        const res = await api.get('/movies');
        if (res.success) {
            allMovies = res.data;
            renderMovies(allMovies);
        }
    }

    function applyFilters() {
        const q = document.getElementById('searchTitle').value.toLowerCase();
        const s = document.getElementById('filterStatus').value;
        const filtered = allMovies.filter(m => m.title.toLowerCase().includes(q) && (s === '' || m.status === s));
        renderMovies(filtered);
    }

    function renderMovies(movies) {
        document.getElementById('movieTableBody').innerHTML = movies.map(m => `
            <tr>
                <td>
                    <div class="movie-info-cell">
                        <img src="${m.posterUrl || 'https://placehold.co/45x65'}" class="movie-poster-sm" onerror="this.src='https://placehold.co/45x65'">
                        <div>
                            <div class="fw-bold">${m.title}</div>
                            <div class="mt-1">${(m.formats || []).map(f => {
                                const formatName = typeof f === 'string' ? f : (f.name || '');
                                return `<span class="badge bg-secondary me-1" style="font-size:0.6rem">${formatName.replace('HALL_','')}</span>`;
                            }).join('')}</div>
                        </div>
                    </div>
                </td>
                <td><small>${(m.genres || []).slice(0, 2).join(', ')}</small></td>
                <td>${m.duration}p</td>
                <td><span class="text-warning">★ ${m.rating || 0}</span></td>
                <td><span class="status-badge ${m.status === 'SHOWING' ? 'badge-showing' : (m.status === 'COMING' ? 'badge-coming' : 'badge-stopped')}">${m.status}</span></td>
                <td class="text-end">
                    <button class="action-btn me-1" onclick="editMovie(${m.id})"><i class="bi bi-pencil-square"></i></button>
                    <button class="action-btn" onclick="deleteMovie(${m.id})"><i class="bi bi-trash"></i></button>
                </td>
            </tr>
        `).join('');
    }

    async function searchTMDB() {
        const q = document.getElementById('tmdbSearchInput').value;
        if (!q) return;
        const resEl = document.getElementById('tmdbResults');
        resEl.innerHTML = '<div class="list-group-item bg-dark text-white">Đang tìm kiếm...</div>';
        resEl.style.display = 'block';
        const res = await api.get(`/tmdb/search?query=${encodeURIComponent(q)}`);
        if (res && res.results) {
            resEl.innerHTML = res.results.map(m => `
                <button type="button" class="list-group-item list-group-item-action bg-dark text-white border-secondary" onclick="fillFromTMDB(${m.id})">
                    <div class="d-flex align-items-center">
                        <img src="${m.poster_path}" style="width:40px; height:60px; object-fit:cover; margin-right:10px;" onerror="this.src='https://placehold.co/40x60'">
                        <div><div class="fw-bold">${m.title}</div><div class="small text-muted">${m.release_date || 'N/A'}</div></div>
                    </div>
                </button>
            `).join('');
        }
    }

    async function fillFromTMDB(id) {
        document.getElementById('tmdbResults').style.display = 'none';
        const m = await api.get(`/tmdb/movie/${id}`);
        if (m) {
            const f = document.getElementById('movieForm');
            f.querySelector('[name="title"]').value = m.title || '';
            f.querySelector('[name="description"]').value = m.overview || '';
            f.querySelector('[name="duration"]').value = m.runtime || 120;
            f.querySelector('[name="rating"]').value = m.vote_average || 0;
            f.querySelector('[name="priorityLevel"]').value = 5;
            
            const directorObj = m.credits?.crew?.find(c => c.job === 'Director');
            f.querySelector('[name="director"]').value = directorObj?.name || '';
            document.getElementById('directorAvatarUrl').value = directorObj?.profile_path || '';

            const topActors = m.credits?.cast?.slice(0, 10) || [];
            f.querySelector('[name="actors"]').value = topActors.map(c => c.name).join(', ') || '';
            document.getElementById('actorAvatarUrls').value = topActors.map(c => c.profile_path || '').join(',');

            document.getElementById('tmdbId').value = m.id;
            
            // Logic Ngày phát hành & Trạng thái (FIXED)
            if (m.release_date) {
                const dateStr = m.release_date.split('T')[0];
                document.getElementById('releaseDate').value = dateStr;
                const relDate = new Date(dateStr); relDate.setHours(0,0,0,0);
                const today = new Date(); today.setHours(0,0,0,0);
                const threeMo = new Date(); threeMo.setMonth(today.getMonth() - 3); threeMo.setHours(0,0,0,0);
                
                if (relDate > today) f.querySelector('[name="status"]').value = 'COMING';
                else if (relDate < threeMo) f.querySelector('[name="status"]').value = 'STOPPED';
                else f.querySelector('[name="status"]').value = 'SHOWING';
            }

            // Logic Định dạng (Tự động tick checkbox)
            const technicalFormats = m.suggestedFormats || ['HALL_2D'];
            document.querySelectorAll('input[name="formats"]').forEach(cb => {
                cb.checked = technicalFormats.includes(cb.value);
            });

            // Logic Trailer
            if (m.videos && m.videos.results) {
                const trailer = m.videos.results.find(v => v.site === 'YouTube' && (v.type === 'Trailer' || v.type === 'Teaser'));
                if (trailer) {
                    f.querySelector('[name="trailerUrl"]').value = `https://www.youtube.com/watch?v=${trailer.key}`;
                }
            }

            // Logic Thể loại (Elite Sync)
            if (m.genres && m.genres.length > 0) {
                const container = document.getElementById('genresContainer');
                const existingGenres = Array.from(container.querySelectorAll('input')).map(i => i.value);
                
                m.genres.forEach(g => {
                    // Nếu thể loại từ TMDB chưa có trong danh sách checkbox hiện tại
                    if (!existingGenres.includes(g.name)) {
                        const newId = `tmdb-genre-${Date.now()}-${Math.random()}`;
                        const label = document.createElement('label');
                        label.className = 'checkbox-item';
                        label.innerHTML = `<input type="checkbox" name="genreNames" value="${g.name}" class="d-none" checked><span>${g.name}</span>`;
                        container.appendChild(label);
                    } else {
                        // Nếu đã có thì chỉ việc tick vào
                        const cb = container.querySelector(`input[value="${g.name}"]`);
                        if (cb) cb.checked = true;
                    }
                });
            }

            // Logic Ảnh Poster
            if (m.poster_path) {
                document.getElementById('posterUrl').value = m.poster_path;
                const prev = document.getElementById('posterPreview');
                prev.src = m.poster_path; prev.style.display = 'block';
                document.querySelector('.poster-preview-box i').style.display = 'none';
                document.querySelector('.poster-preview-box span').style.display = 'none';
            }
            alert('Đồng bộ dữ liệu TMDB thành công!');
        }
    }

    async function saveMovie() {
        const id = document.getElementById('movieId').value;
        const f = document.getElementById('movieForm');
        const data = {
            title: f.querySelector('[name="title"]').value.trim(),
            description: f.querySelector('[name="description"]').value.trim(),
            duration: parseInt(f.querySelector('[name="duration"]').value) || 0,
            status: f.querySelector('[name="status"]').value,
            director: f.querySelector('[name="director"]').value.trim(),
            actors: f.querySelector('[name="actors"]').value.trim(),
            releaseDate: document.getElementById('releaseDate').value,
            ageRating: f.querySelector('[name="ageRating"]').value,
            rating: parseFloat(f.querySelector('[name="rating"]').value) || 0,
            priorityLevel: parseInt(f.querySelector('[name="priorityLevel"]').value) || 1,
            genres: Array.from(document.querySelectorAll('input[name="genreNames"]:checked')).map(cb => cb.value),
            formats: Array.from(document.querySelectorAll('input[name="formats"]:checked')).map(cb => cb.value),
            posterUrl: document.getElementById('posterUrl').value.trim(),
            trailerUrl: f.querySelector('[name="trailerUrl"]').value.trim(),
            tmdbId: parseInt(document.getElementById('tmdbId').value) || null,
            directorAvatarUrl: document.getElementById('directorAvatarUrl').value,
            actorAvatarUrls: document.getElementById('actorAvatarUrls').value
        };

        const fd = new FormData();
        fd.append('movie', new Blob([JSON.stringify(data)], { type: 'application/json' }));
        const posterFile = document.getElementById('posterInput').files[0];
        if (posterFile) fd.append('poster', posterFile);

        const res = await (id ? api.put(`/movies/${id}`, fd, true) : api.post('/movies', fd, true));
        if (res.success) { movieModal.hide(); loadMovies(); alert('Lưu phim thành công!'); resetForm(); }
        else alert('Lỗi: ' + res.message);
    }

    function editMovie(id) {
        const m = allMovies.find(mv => mv.id === id);
        if (!m) return;
        resetForm();
        document.getElementById('modalTitle').innerText = 'Sửa thông tin phim';
        document.getElementById('movieId').value = m.id;
        document.getElementById('tmdbId').value = m.tmdbId || '';
        document.getElementById('posterUrl').value = m.posterUrl || '';
        
        const f = document.getElementById('movieForm');
        f.querySelector('[name="title"]').value = m.title || '';
        f.querySelector('[name="description"]').value = m.description || '';
        f.querySelector('[name="duration"]').value = m.duration || 0;
        f.querySelector('[name="rating"]').value = m.rating || 0;
        f.querySelector('[name="priorityLevel"]').value = m.priorityLevel || 1;
        f.querySelector('[name="director"]').value = (m.directors || []).map(d => d.name).join(', ') || '';
        f.querySelector('[name="actors"]').value = (m.actors || []).map(a => a.name).join(', ') || '';
        f.querySelector('[name="status"]').value = m.status;
        f.querySelector('[name="ageRating"]').value = m.ageRating || 'P';
        f.querySelector('[name="trailerUrl"]').value = m.trailerUrl || '';
        if (m.releaseDate) document.getElementById('releaseDate').value = m.releaseDate;

        document.querySelectorAll('input[name="genreNames"]').forEach(cb => cb.checked = (m.genres || []).includes(cb.value));
        document.querySelectorAll('input[name="formats"]').forEach(cb => cb.checked = (m.formats || []).includes(cb.value));

        if (m.posterUrl) {
            const prev = document.getElementById('posterPreview');
            prev.src = m.posterUrl; prev.style.display = 'block';
            document.querySelector('.poster-preview-box i').style.display = 'none';
            document.querySelector('.poster-preview-box span').style.display = 'none';
        }
        movieModal.show();
    }

    function openAddModal() {
        resetForm();
        document.getElementById('modalTitle').innerText = 'THÊM PHIM MỚI';
        movieModal.show();
    }

    function resetForm() {
        document.getElementById('movieForm').reset();
        document.getElementById('movieId').value = '';
        document.getElementById('tmdbId').value = '';
        document.getElementById('posterUrl').value = '';
        document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
        document.getElementById('posterPreview').style.display = 'none';
        document.querySelector('.poster-preview-box i').style.display = 'block';
        document.querySelector('.poster-preview-box span').style.display = 'block';
    }

    function previewImage(input) {
        if (input.files && input.files[0]) {
            const r = new FileReader(); r.onload = (e) => {
                const p = document.getElementById('posterPreview'); p.src = e.target.result; p.style.display = 'block';
                document.querySelector('.poster-preview-box i').style.display = 'none'; document.querySelector('.poster-preview-box span').style.display = 'none';
                document.getElementById('posterUrl').value = '';
            }; r.readAsDataURL(input.files[0]);
        }
    }
    async function deleteMovie(id) { if (confirm('Xóa phim này?')) { const res = await api.delete(`/movies/${id}`); if (res.success) loadMovies(); } }
</script>
