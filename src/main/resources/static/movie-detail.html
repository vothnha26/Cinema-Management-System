<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết phim – StarCinema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <style>
        :root {
          --bg: #080B14; --surface: #0F1320; --card: #161B2E; --border: #252A3D;
          --accent: #E5133A; --accent-gold: #F5A623; --text: #E8EAF0; --text-muted: #7B82A0;
          --gradient: linear-gradient(135deg, #E5133A, #8B0020);
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; }
        a { text-decoration: none; color: inherit; }

        /* ── NAVBAR ── */
        .navbar-star { background: rgba(8,11,20,0.8); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.05); padding: 14px 0; position: fixed; top: 0; width: 100%; z-index: 1000; }
        .brand { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 3px; color: var(--text); }
        .brand span { color: var(--accent); }

        /* ── MOVIE HEADER ── */
        .movie-header { position: relative; height: 600px; overflow: hidden; display: flex; align-items: flex-end; padding-bottom: 60px; }
        .backdrop-wrap { position: absolute; inset: 0; z-index: -1; }
        .backdrop-img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4) blur(2px); }
        .backdrop-overlay { position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 0%, rgba(8,11,20,0.4) 50%, transparent 100%), linear-gradient(to right, var(--bg) 0%, transparent 60%); }
        .header-content { display: flex; gap: 40px; align-items: flex-end; width: 100%; }
        .header-poster { width: 260px; aspect-ratio: 2/3; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
        .header-poster img { width: 100%; height: 100%; object-fit: cover; }
        .movie-title { font-family: 'Bebas Neue', sans-serif; font-size: 4.2rem; line-height: 0.9; margin-bottom: 15px; letter-spacing: 2px; }
        .header-meta { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; margin-bottom: 25px; }
        .rating-box { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--accent-gold); font-size: 1.2rem; }
        .age-badge { padding: 4px 12px; border-radius: 6px; font-weight: 700; font-size: 0.9rem; }
        .age-c18 { background: rgba(229,19,58,0.2); color: var(--accent); border: 1px solid var(--accent); }
        .age-c13 { background: rgba(100,180,255,0.2); color: #64B4FF; border: 1px solid #64B4FF; }

        /* ── INFO SECTION ── */
        .info-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px; margin-bottom: 30px; }
        .section-label { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 1px; color: var(--accent); margin-bottom: 20px; display: block; }
        .movie-desc { line-height: 1.8; color: var(--text-muted); margin-bottom: 35px; font-size: 1.05rem; }
        
        /* ── CAST & CREW ROW (FIXED) ── */
        .people-container { display: flex; flex-direction: column; gap: 30px; border-top: 1px solid var(--border); padding-top: 30px; }
        .people-group { display: flex; flex-direction: column; gap: 15px; }
        .people-group-label { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: var(--accent); letter-spacing: 1.5px; margin-bottom: 5px; }
        .people-list { display: flex; flex-wrap: wrap; gap: 20px; }
        .person-item { text-align: center; width: 90px; }
        .person-avatar { width: 75px; height: 75px; border-radius: 50%; border: 2px solid var(--border); margin: 0 auto 10px; overflow: hidden; background: var(--card); transition: 0.2s; }
        .person-avatar:hover { border-color: var(--accent); transform: scale(1.05); }
        .person-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .person-name { font-size: 0.75rem; font-weight: 600; color: #fff; line-height: 1.2; display: block; }

        /* ── BOOKING ── */
        .booking-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 32px; position: sticky; top: 100px; }
        .date-selector { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 24px; scrollbar-width: none; }
        .date-item {
          flex-shrink: 0; width: 60px; height: 75px; border-radius: 12px; border: 1px solid var(--border);
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          cursor: pointer; transition: all 0.2s; background: var(--surface);
        }
        .date-item:hover { border-color: var(--accent); }
        .date-item.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 8px 20px rgba(229,19,58,0.3); }
        
        .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .time-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; text-align: center; transition: all 0.2s; }
        .time-btn:hover { background: var(--accent); border-color: var(--accent); transform: translateY(-2px); }

        .video-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .modal-content { background: #000; border: 1px solid var(--border); }
        .footer { background: var(--surface); border-top: 1px solid var(--border); padding: 40px 0 20px; margin-top: 80px; }
    </style>
</head>
<body>

<nav class="navbar-star">
    <div class="container-xxl"><div class="d-flex align-items-center justify-content-between"><a href="index.html" class="brand">STAR<span>CINEMA</span></a><div id="navUser"><button class="btn btn-danger btn-sm px-4" onclick="window.location.href='auth.html'">Đăng nhập</button></div></div></div>
</nav>

<section class="movie-header">
    <div class="backdrop-wrap" id="backdropContainer"></div>
    <div class="container-xxl">
        <div class="header-content">
            <div class="header-poster d-none d-md-block" id="posterContainer"></div>
            <div class="flex-grow-1">
                <div class="header-meta">
                    <span class="rating-box" id="ratingBox">⭐ 0.0</span>
                    <span class="age-badge" id="ageBadge">P</span>
                    <span id="duration">⏱ 0 phút</span>
                </div>
                <h1 class="movie-title" id="movieTitle">Đang tải...</h1>
                <div class="d-flex gap-2 mb-4" id="genreList"></div>
                <div class="d-flex gap-3">
                    <button class="btn btn-danger px-4 py-2 fw-bold" onclick="document.getElementById('bookingSection').scrollIntoView({behavior:'smooth'})"><i class="bi bi-ticket-perforated me-2"></i> ĐẶT VÉ NGAY</button>
                    <button class="btn btn-outline-light px-4 py-2 fw-bold" id="btnTrailer" style="display:none"><i class="bi bi-play-circle me-2"></i> XEM TRAILER</button>
                </div>
            </div>
        </div>
    </div>
</section>

<main class="container-xxl py-5">
    <div class="row g-5">
        <div class="col-lg-8">
            <div class="info-card">
                <span class="section-label">Câu chuyện</span>
                <p class="movie-desc" id="description">...</p>
                
                <div class="people-container">
                    <div class="people-group">
                        <span class="people-group-label">Đạo diễn</span>
                        <div class="people-list" id="directorList"></div>
                    </div>
                    <div class="people-group">
                        <span class="people-group-label">Diễn viên chính</span>
                        <div class="people-list" id="castList"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-4" id="bookingSection">
            <div class="booking-card"><span class="section-label">Lịch chiếu</span><div class="date-selector" id="dateSelector"></div><div id="showtimeContainer"><div class="text-center py-4 text-muted small">Đang tải lịch chiếu...</div></div></div>
        </div>
    </div>
</main>

<div class="modal fade" id="trailerModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header border-0 pb-0"><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body p-0"><div class="video-container" id="videoContainer"></div></div></div></div></div>

<footer class="footer"><div class="container-xxl text-center text-muted small">© 2024 StarCinema. Toàn bộ bản quyền được bảo lưu.</div></footer>

<script src="/js/api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const movieId = new URLSearchParams(window.location.search).get('id');
    let selectedDate = new Date().toISOString().split('T')[0];
    const trailerModal = new bootstrap.Modal(document.getElementById('trailerModal'));

    function getFullImageUrl(path) {
        if (!path) return 'https://placehold.co/300x450?text=No+Img';
        if (path.startsWith('http')) return path;
        const cleanPath = path.startsWith('/') ? path : '/' + path;
        return `https://image.tmdb.org/t/p/w500${cleanPath}`;
    }

    async function init() {
        if(!movieId) return window.location.href = 'index.html';
        const res = await api.get(`/movies/${movieId}`);
        if(res.success) renderMovie(res.data);
        renderDates(); loadShowtimes();
        const user = localStorage.getItem('cinemaUsername');
        if(user) document.getElementById('navUser').innerHTML = `<span class="fw-bold">${user}</span>`;
    }

    function renderMovie(m) {
        document.getElementById('movieTitle').textContent = m.title;
        document.getElementById('description').textContent = m.description || 'Chưa có mô tả.';
        document.getElementById('duration').textContent = `⏱ ${m.duration} phút`;
        document.getElementById('ratingBox').innerHTML = `⭐ ${m.rating || 0}`;
        document.getElementById('ageBadge').textContent = m.ageRating;
        document.getElementById('ageBadge').className = `age-badge age-${m.ageRating.toLowerCase()}`;
        
        const posterUrl = getFullImageUrl(m.posterUrl);
        document.getElementById('posterContainer').innerHTML = `<img src="${posterUrl}" class="w-100 h-100">`;
        document.getElementById('backdropContainer').innerHTML = `<img src="${posterUrl}" class="backdrop-img"><div class="backdrop-overlay"></div>`;
        document.getElementById('genreList').innerHTML = (m.genres || []).map(g => `<span class="badge bg-dark border border-secondary px-3 py-2">${g}</span>`).join('');
        
        document.getElementById('directorList').innerHTML = (m.directors || []).map(d => `
            <div class="person-item">
                <div class="person-avatar"><img src="${getFullImageUrl(d.avatarUrl)}" onerror="this.src='https://placehold.co/100?text=Dir'"></div>
                <span class="person-name">${d.name}</span>
            </div>`).join('') || '<span class="text-muted small">Đang cập nhật</span>';

        document.getElementById('castList').innerHTML = (m.actors || []).map(a => `
            <div class="person-item">
                <div class="person-avatar"><img src="${getFullImageUrl(a.avatarUrl)}" onerror="this.src='https://placehold.co/100?text=Actor'"></div>
                <span class="person-name">${a.name}</span>
            </div>`).join('') || '<span class="text-muted small">Đang cập nhật</span>';

        if (m.trailerUrl) {
            const btnT = document.getElementById('btnTrailer');
            btnT.style.display = 'inline-flex';
            btnT.onclick = () => openTrailer(m.trailerUrl);
        }
    }

    function openTrailer(url) {
        let id = '';
        if (url.includes('v=')) id = url.split('v=')[1].split('&')[0];
        else if (url.includes('youtu.be/')) id = url.split('youtu.be/')[1].split('?')[0];
        if (id) {
            document.getElementById('videoContainer').innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" allowfullscreen allow="autoplay"></iframe>`;
            trailerModal.show();
            document.getElementById('trailerModal').addEventListener('hidden.bs.modal', () => { document.getElementById('videoContainer').innerHTML = ''; }, {once: true});
        }
    }

    function renderDates() {
        const container = document.getElementById('dateSelector');
        const days = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
        const now = new Date();
        let html = '';
        for (let i = 0; i < 7; i++) {
            const d = new Date(); d.setDate(now.getDate() + i);
            const dateStr = d.toISOString().split('T')[0];
            const active = dateStr === selectedDate ? 'active' : '';
            html += `<div class="date-item ${active}" onclick="selectDate('${dateStr}')"><span class="day">${i===0?'Hôm nay':days[d.getDay()]}</span><span class="num">${d.getDate()}</span></div>`;
        }
        container.innerHTML = html;
    }

    function selectDate(date) { selectedDate = date; renderDates(); loadShowtimes(); }

    async function loadShowtimes() {
        const container = document.getElementById('showtimeContainer');
        container.innerHTML = '<div class="text-center py-4 text-muted small"><div class="spinner-border spinner-border-sm mb-2"></div><br>Tìm suất chiếu...</div>';
        try {
            const res = await api.get(`/showtimes?movieId=${movieId}&date=${selectedDate}`);
            if(res.success && res.data.length > 0) {
                const nowPlus1H = new Date(); nowPlus1H.setHours(nowPlus1H.getHours() + 1);
                const filtered = res.data.filter(s => new Date(s.startTime) > nowPlus1H);
                if(!filtered.length) { container.innerHTML = '<div class="text-center py-4 text-muted small">Không còn suất chiếu khả dụng hôm nay.</div>'; return; }
                const grouped = filtered.reduce((acc, s) => { const k = s.formatName || '2D'; if(!acc[k]) acc[k] = []; acc[k].push(s); return acc; }, {});
                container.innerHTML = Object.entries(grouped).map(([fmt, list]) => `
                    <div class="mb-4">
                        <div class="small fw-bold text-muted mb-2 text-uppercase">${fmt.replace('HALL_','')}</div>
                        <div class="time-grid">${list.map(s => `<a href="booking.html?showtimeId=${s.id}" class="time-btn">${new Date(s.startTime).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</a>`).join('')}</div>
                    </div>`).join('');
            } else container.innerHTML = '<div class="text-center py-4 text-muted small">Chưa có lịch chiếu cho ngày này.</div>';
        } catch(e) { container.innerHTML = '<div class="text-center py-4 text-danger small">Lỗi tải lịch chiếu.</div>'; }
    }
    init();
</script>
</body>
</html>
