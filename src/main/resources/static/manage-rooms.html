<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Phòng chiếu – StarCinema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <link rel="icon" type="image/png" href="/favicon.png?v=2">
    <style>
        :root {
          --bg: #080B14; --surface: #0F1320; --card: #161B2E; --border: #252A3D;
          --accent: #E5133A; --accent-gold: #F5A623; --text: #E8EAF0; --text-muted: #7B82A0;
          --gradient: linear-gradient(135deg, #E5133A, #8B0020);
          --sidebar-width: 260px;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; overflow-x: hidden; }
        
        /* ── SIDEBAR ── */
        .sidebar {
          width: var(--sidebar-width); background: var(--surface); border-right: 1px solid var(--border);
          height: 100vh; position: fixed; top: 0; left: 0; z-index: 1000; padding: 24px;
          display: flex; flex-direction: column;
        }
        .brand { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 3px; color: var(--text); margin-bottom: 40px; text-decoration: none; }
        .brand span { color: var(--accent); }
        .nav-menu { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
        .nav-item { margin-bottom: 8px; }
        .nav-link-admin {
          display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text-muted);
          text-decoration: none; border-radius: 10px; transition: all 0.2s; font-weight: 500;
        }
        .nav-link-admin:hover, .nav-link-admin.active { background: rgba(229,19,58,0.1); color: var(--accent); }
        .nav-link-admin.active { background: var(--gradient); color: #fff; }
        .user-panel { border-top: 1px solid var(--border); padding-top: 20px; margin-top: auto; }

        /* ── MAIN CONTENT ── */
        .main-content { margin-left: var(--sidebar-width); padding: 40px; min-height: 100vh; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; letter-spacing: 1px; margin: 0; }

        .btn-add { background: var(--gradient); border: none; color: #fff; padding: 10px 24px; border-radius: 10px; font-weight: 600; transition: opacity 0.2s; }
        .btn-add:hover { opacity: 0.9; color: #fff; }

        /* ── ROOM GRID ── */
        .room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
        .room-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; transition: all 0.3s; position: relative; overflow: hidden; }
        .room-card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        
        .room-type-tag { position: absolute; top: 20px; right: 20px; padding: 4px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .tag-imax { background: rgba(245,166,35,0.15); color: var(--accent-gold); border: 1px solid rgba(245,166,35,0.3); }
        .tag-4dx { background: rgba(229,19,58,0.15); color: var(--accent); border: 1px solid rgba(229,19,58,0.3); }
        .tag-std { background: rgba(100,180,255,0.15); color: #64B4FF; border: 1px solid rgba(100,180,255,0.3); }

        .room-icon-box { width: 56px; height: 56px; border-radius: 14px; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: var(--text-muted); margin-bottom: 20px; transition: 0.3s; }
        .room-card:hover .room-icon-box { background: var(--accent); color: #fff; }

        .room-name { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
        .room-stats { display: flex; gap: 16px; margin-bottom: 24px; }
        .stat-item { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--text-muted); }
        .stat-item i { color: var(--accent); }

        .room-actions { display: flex; gap: 10px; border-top: 1px solid var(--border); pt: 20px; margin-top: 20px; padding-top: 20px; }
        .action-btn-outline { flex: 1; padding: 10px; border-radius: 10px; border: 1.5px solid var(--border); background: transparent; color: var(--text); font-size: 0.85rem; font-weight: 600; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
        .action-btn-outline:hover { border-color: var(--accent); color: var(--accent); background: rgba(229,19,58,0.05); }
        .action-btn-danger { width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid var(--border); background: transparent; color: var(--text-muted); transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .action-btn-danger:hover { border-color: var(--accent); color: var(--accent); background: rgba(229,19,58,0.1); }

        /* ── MODAL ── */
        .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 20px; color: var(--text); }
        .modal-header, .modal-footer { border-color: var(--border); padding: 24px; }
        .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 1px; }
        .form-control, .form-select { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 14px 16px; border-radius: 12px; font-size: 0.95rem; }
        .form-control:focus, .form-select:focus { border-color: var(--accent); background: var(--surface); color: var(--text); box-shadow: none; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    </style>
</head>
<body>

<aside class="sidebar">
    <!-- Rendered by sidebar.js -->
</aside>

<main class="main-content">
    <div class="header-section">
        <div>
            <h1 class="page-title">Hệ thống phòng chiếu</h1>
            <p class="text-muted m-0">Quản lý không gian, sơ đồ ghế và công nghệ trình chiếu.</p>
        </div>
        <button class="btn-add" onclick="openRoomModal()">
            <i class="bi bi-plus-lg me-2"></i> THÊM PHÒNG MỚI
        </button>
    </div>

    <div class="room-grid" id="roomGrid">
        <!-- Room cards will be rendered here -->
        <div class="col-12 text-center py-5">
            <div class="spinner-border text-danger" role="status"></div>
            <p class="mt-3 text-muted">Đang đồng bộ dữ liệu phòng chiếu...</p>
        </div>
    </div>
</main>

<!-- ROOM MODAL -->
<div class="modal fade" id="roomModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">THÔNG TIN PHÒNG CHIẾU</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form id="roomForm">
                    <input type="hidden" id="roomId">
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-muted text-uppercase">Tên phòng chiếu</label>
                        <input type="text" name="name" class="form-control" placeholder="VD: Cinema 01 - IMAX" required>
                    </div>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Loại phòng</label>
                            <select name="type" class="form-select">
                                <option value="HALL_2D">HALL 2D</option>
                                <option value="HALL_3D">HALL 3D</option>
                                <option value="IMAX">IMAX LASER</option>
                                <option value="HALL_4DX">PREMIUM 4DX</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold text-muted text-uppercase">Số hàng</label>
                            <input type="number" name="rows" class="form-control" value="10" min="1" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold text-muted text-uppercase">Số cột</label>
                            <input type="number" name="cols" class="form-control" value="10" min="1" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">HỦY BỎ</button>
                <button type="button" class="btn btn-danger px-4 fw-bold" onclick="saveRoom()">LƯU THÔNG TIN</button>
            </div>
        </div>
    </div>
</div>

<script src="/js/auth-guard.js"></script>
<script>AuthGuard.requireRole(['MANAGER']);</script>
<script src="/js/sidebar.js"></script>
<script src="/js/api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const roomModal = new bootstrap.Modal(document.getElementById('roomModal'));
    let allRooms = [];

    document.addEventListener('DOMContentLoaded', loadRooms);

    async function loadRooms() {
        try {
            const res = await api.get('/rooms');
            if (res.success) {
                allRooms = res.data;
                renderRooms(allRooms);
            }
        } catch (e) { console.error(e); }
    }

    function renderRooms(rooms) {
        const grid = document.getElementById('roomGrid');
        if (!rooms.length) {
            grid.innerHTML = '<div class="col-12 text-center text-muted py-5">Chưa có phòng chiếu nào được tạo.</div>';
            return;
        }

        grid.innerHTML = rooms.map(r => {
            const typeClass = r.type === 'IMAX' ? 'tag-imax' : (r.type === 'HALL_4DX' ? 'tag-4dx' : 'tag-std');
            const typeLabel = r.type.replace('HALL_', '');
            
            return `
                <div class="room-card">
                    <span class="room-type-tag ${typeClass}">${typeLabel}</span>
                    <div class="room-icon-box">
                        <i class="bi bi-display"></i>
                    </div>
                    <div class="room-name">${r.name}</div>
                    <div class="room-stats">
                        <div class="stat-item"><i class="bi bi-person-workspace"></i> ${r.capacity} ghế</div>
                        <div class="stat-item"><i class="bi bi-grid-3x3"></i> ${r.rows}x${r.cols}</div>
                    </div>
                    <div class="room-actions">
                        <a href="design-room.html?id=${r.id}" class="action-btn-outline">
                            <i class="bi bi-grid-3x3-gap"></i> THIẾT KẾ GHẾ
                        </a>
                        <button class="action-btn-outline" style="flex:0 0 44px" onclick="editRoom(${r.id})">
                            <i class="bi bi-pencil-square"></i>
                        </button>
                        <button class="action-btn-danger" onclick="deleteRoom(${r.id})">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function openRoomModal() {
        document.getElementById('roomForm').reset();
        document.getElementById('roomId').value = '';
        document.getElementById('modalTitle').innerText = 'THÊM PHÒNG CHIẾU MỚI';
        roomModal.show();
    }

    function editRoom(id) {
        const r = allRooms.find(x => x.id === id);
        if (!r) return;
        
        const f = document.getElementById('roomForm');
        document.getElementById('roomId').value = r.id;
        f.querySelector('[name="name"]').value = r.name;
        f.querySelector('[name="type"]').value = r.type;
        f.querySelector('[name="rows"]').value = r.rows || 10;
        f.querySelector('[name="cols"]').value = r.cols || 10;
        
        document.getElementById('modalTitle').innerText = 'CẬP NHẬT PHÒNG CHIẾU';
        roomModal.show();
    }

    async function saveRoom() {
        const id = document.getElementById('roomId').value;
        const f = document.getElementById('roomForm');
        const data = {
            name: f.querySelector('[name="name"]').value,
            type: f.querySelector('[name="type"]').value,
            rows: parseInt(f.querySelector('[name="rows"]').value),
            cols: parseInt(f.querySelector('[name="cols"]').value)
        };

        if (!data.name || isNaN(data.rows) || isNaN(data.cols)) return alert('Vui lòng nhập đủ thông tin!');

        const res = await (id ? api.put(`/rooms/${id}`, data) : api.post('/rooms', data));
        if (res.success) {
            roomModal.hide();
            loadRooms();
            alert('Lưu phòng thành công!');
        } else alert('Lỗi: ' + res.message);
    }

    async function deleteRoom(id) {
        if (!confirm('Xóa phòng này sẽ xóa toàn bộ dữ liệu liên quan (Suất chiếu, vé...). Bạn chắc chắn chứ?')) return;
        const res = await api.delete(`/rooms/${id}`);
        if (res.success) loadRooms();
        else alert('Lỗi: ' + res.message);
    }
</script>
</body>
</html>
