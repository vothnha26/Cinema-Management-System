<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Giá vé – StarCinema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <style>
        :root {
          --bg: #080B14; --surface: #0F1320; --card: #161B2E; --border: #2F3548;
          --accent: #FF1E46; --accent-gold: #FFB400; --text: #FFFFFF; --text-muted: #A0A7C1;
          --gradient: linear-gradient(135deg, #FF1E46, #B00020);
          --sidebar-width: 260px;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; overflow-x: hidden; }
        .sidebar { width: var(--sidebar-width); background: var(--surface); border-right: 1px solid var(--border); height: 100vh; position: fixed; top: 0; left: 0; z-index: 1000; padding: 24px; display: flex; flex-direction: column; }
        .main-content { margin-left: var(--sidebar-width); padding: 40px; min-height: 100vh; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.8rem; letter-spacing: 1px; margin: 0; color: #fff; }

        /* ── MATRIX TABLE ── */
        .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .pricing-table { margin: 0; color: var(--text); width: 100%; border-collapse: collapse; }
        .pricing-table th { background: #1A2035; padding: 22px; color: #fff; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.5px; border-bottom: 2px solid var(--border); text-align: center; font-weight: 700; }
        .pricing-table th:first-child { text-align: left; width: 280px; background: #1E253D; }
        .pricing-table td { padding: 28px 20px; border-bottom: 1px solid var(--border); text-align: center; vertical-align: middle; border-right: 1px solid var(--border); }
        .pricing-table td:last-child { border-right: none; }
        .pricing-table tr:last-child td { border-bottom: none; }
        
        .room-type-cell { text-align: left !important; font-weight: 700; color: #FFFFFF; font-size: 1.05rem; background: rgba(255,255,255,0.02); }
        .room-badge { font-size: 0.75rem; padding: 3px 10px; border-radius: 6px; background: rgba(255,30,70,0.15); color: #FF4D6D; margin-left: 10px; border: 1px solid rgba(255,30,70,0.3); font-weight: 800; }

        .price-cell-content { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .price-val { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: var(--accent-gold); letter-spacing: 1.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .btn-edit-price { background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: #fff; padding: 6px 16px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; transition: all 0.2s; cursor: pointer; }
        .btn-edit-price:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(1.05); }
        .no-price { color: #4A526D; font-style: italic; font-size: 0.85rem; margin-bottom: 5px; }

        /* Modal Styles */
        .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 20px; color: var(--text); }
        .modal-header { border-bottom: 1px solid var(--border); padding: 20px 24px; background: rgba(255,255,255,0.02); }
        .modal-footer { border-top: 1px solid var(--border); padding: 20px 24px; }
        .form-control, .form-select { background: var(--surface); border: 1px solid var(--border); color: #fff; padding: 14px; border-radius: 12px; font-weight: 500; }
        .form-control:focus { border-color: var(--accent); background: var(--surface); color: #fff; box-shadow: 0 0 0 4px rgba(255,30,70,0.15); }
        .form-label { color: var(--text-muted); font-weight: 600; margin-bottom: 10px; }
    </style>
</head>
<body>

<aside class="sidebar"></aside>

<main class="main-content">
    <div class="header-section">
        <div>
            <h1 class="page-title">Ma trận Giá vé</h1>
            <p class="text-muted m-0" style="font-size: 1rem;">Thiết lập đơn giá theo Loại phòng (Dòng) và Loại ghế (Cột).</p>
        </div>
    </div>

    <div class="table-container">
        <table class="pricing-table">
            <thead>
                <tr>
                    <th>Cấu hình Phòng \ Ghế</th>
                    <th>Tiêu chuẩn (Standard)</th>
                    <th>Ghế VIP</th>
                    <th>Ghế Đôi (Couple)</th>
                </tr>
            </thead>
            <tbody id="pricingMatrixBody">
                <tr><td colspan="4" class="text-center py-5 text-muted"><div class="spinner-border spinner-border-sm me-2"></div> Đang nạp dữ liệu...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<!-- PRICE MODAL -->
<div class="modal fade" id="priceModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">CẬP NHẬT ĐƠN GIÁ</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="priceForm">
                    <input type="hidden" id="priceId">
                    <div class="mb-4">
                        <label class="form-label small text-uppercase">Phạm vi áp dụng</label>
                        <div id="targetDisplay" class="p-3 rounded-3" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border); font-weight: 700; color: var(--accent-gold); font-size: 1.1rem;"></div>
                        <input type="hidden" id="roomType">
                        <input type="hidden" id="seatType">
                    </div>
                    <div class="mb-4">
                        <label class="form-label small text-uppercase">Đơn giá vé (VNĐ) *</label>
                        <input type="number" id="priceInput" class="form-control form-control-lg" required placeholder="Ví dụ: 120000">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-uppercase">Ngày bắt đầu hiệu lực *</label>
                        <input type="date" id="effectiveDate" class="form-control" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-link text-muted text-decoration-none px-4" data-bs-dismiss="modal">Hủy bỏ</button>
                <button type="button" class="btn btn-danger px-5 fw-bold" id="btnSavePrice" onclick="savePrice()" style="border-radius: 12px; height: 50px;">LƯU CẤU HÌNH</button>
            </div>
        </div>
    </div>
</div>

<script src="/js/auth-guard.js"></script>
<script>AuthGuard.requireRole(['MANAGER']);</script>
<script src="/js/sidebar.js"></script>
<script src="/js/api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let priceModal;
    let allPrices = [];
    const ROOM_TYPES = ['HALL_2D', 'HALL_3D', 'IMAX', 'HALL_4DX'];
    const SEAT_TYPES = ['STANDARD', 'VIP', 'COUPLE'];

    const ROOM_LABELS = { 'HALL_2D': 'Phòng 2D Tiêu chuẩn', 'HALL_3D': 'Phòng Cinema 3D', 'IMAX': 'Phòng IMAX Elite', 'HALL_4DX': 'Phòng Ultra 4DX' };

    document.addEventListener('DOMContentLoaded', () => {
        priceModal = new bootstrap.Modal(document.getElementById('priceModal'), {
            backdrop: 'static',
            keyboard: false
        });
        loadPrices();
    });

    async function loadPrices() {
        try {
            const res = await api.get('/admin/pricing');
            if (res.success) {
                allPrices = res.data;
                renderMatrix();
            }
        } catch (e) {
            document.getElementById('pricingMatrixBody').innerHTML = '<tr><td colspan="4" class="text-center py-5 text-danger">Lỗi nạp dữ liệu từ máy chủ.</td></tr>';
        }
    }

    function renderMatrix() {
        const tbody = document.getElementById('pricingMatrixBody');
        let html = '';

        ROOM_TYPES.forEach(room => {
            html += `<tr>`;
            html += `<td class="room-type-cell">${ROOM_LABELS[room]} <span class="room-badge">${room.replace('HALL_','')}</span></td>`;
            
            SEAT_TYPES.forEach(seat => {
                const p = allPrices.find(x => x.roomType === room && x.seatType === seat);
                html += `<td>`;
                if (p) {
                    html += `
                        <div class="price-cell-content">
                            <span class="price-val">${new Intl.NumberFormat('vi-VN').format(p.price)}đ</span>
                            <button class="btn-edit-price" onclick="openEditModal('${room}', '${seat}', ${p.id}, ${p.price}, '${p.effectiveDate}')">
                                <i class="bi bi-pencil-square me-1"></i>Sửa giá
                            </button>
                        </div>`;
                } else {
                    html += `
                        <div class="price-cell-content">
                            <span class="no-price">Trống</span>
                            <button class="btn-edit-price" onclick="openEditModal('${room}', '${seat}', null, 0, '')" style="color: var(--accent-gold); border-color: rgba(255,180,0,0.3);">
                                <i class="bi bi-plus-circle me-1"></i>Thiết lập
                            </button>
                        </div>`;
                }
                html += `</td>`;
            });
            html += `</tr>`;
        });

        tbody.innerHTML = html;
    }

    function openEditModal(room, seat, id, price, date) {
        document.getElementById('priceForm').reset();
        document.getElementById('priceId').value = id || '';
        document.getElementById('roomType').value = room;
        document.getElementById('seatType').value = seat;
        document.getElementById('targetDisplay').innerText = `${ROOM_LABELS[room]} — Ghế ${seat}`;
        document.getElementById('priceInput').value = price || '';
        document.getElementById('effectiveDate').value = date || new Date().toISOString().split('T')[0];
        
        priceModal.show();
    }

    async function savePrice() {
        const btn = document.getElementById('btnSavePrice');
        const data = {
            roomType: document.getElementById('roomType').value,
            seatType: document.getElementById('seatType').value,
            price: parseFloat(document.getElementById('priceInput').value),
            effectiveDate: document.getElementById('effectiveDate').value
        };

        if (!data.price || !data.effectiveDate) return alert('Vui lòng điền đủ thông tin!');

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Đang xử lý...';

        try {
            const res = await api.put('/admin/pricing', data);
            if (res.success) {
                priceModal.hide();
                await loadPrices();
                alert('Cập nhật giá vé thành công!');
            } else alert('Lỗi: ' + res.message);
        } catch (e) {
            alert('Lỗi hệ thống khi lưu giá.');
        } finally {
            btn.disabled = false;
            btn.innerText = 'LƯU CẤU HÌNH';
        }
    }
</script>
</body>
</html>
