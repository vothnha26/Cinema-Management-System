<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiến lược Giá thông minh – StarCinema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <style>
        :root {
          --bg: #05080F; --surface: #0D1117; --card: #161B2E; --border: #30363D;
          --accent: #E5133A; --accent-gold: #F5A623; --text: #FFFFFF; --text-muted: #CBD5E0;
          --gradient: linear-gradient(135deg, #E5133A, #8B0020);
        }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; overflow-x: hidden; }
        .main-content { padding: 40px; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }

        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; letter-spacing: 1px; margin: 0; }
        
        .nav-tabs { border-bottom: 1px solid var(--border); margin-bottom: 30px; gap: 20px; border: none; }
        .nav-link { color: var(--text-muted); font-weight: 700; border: none !important; padding: 12px 0; font-size: 1rem; position: relative; transition: 0.3s; background: transparent !important; }
        .nav-link.active { color: var(--accent) !important; }
        .nav-link.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: var(--accent); border-radius: 10px; }

        .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
        .pricing-table { margin: 0; color: var(--text); width: 100%; border-collapse: collapse; }
        .pricing-table th { background: #1A202C; padding: 20px; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.5px; border-bottom: 1px solid var(--border); text-align: center; }
        .pricing-table th:first-child { text-align: left; }
        .pricing-table td { padding: 20px; border-bottom: 1px solid var(--border); text-align: center; vertical-align: middle; }
        
        .room-type-cell { text-align: left !important; font-weight: 800; color: #fff; }
        .price-val { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; color: var(--accent-gold); }
        .btn-edit-price { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; transition: 0.2s; }
        .btn-edit-price:hover { background: var(--accent); border-color: var(--accent); }

        .rule-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; transition: 0.3s; position: relative; overflow: hidden; }
        .rule-card:hover { border-color: var(--accent); transform: translateY(-3px); }
        .rule-card::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 4px; background: var(--accent); }
        .rule-card.inactive { opacity: 0.6; filter: grayscale(1); }
        .rule-card.inactive::before { background: #4A5568; }

        .badge-rule { font-size: 0.7rem; padding: 4px 10px; border-radius: 6px; font-weight: 800; text-transform: uppercase; }
        .badge-additive { background: rgba(229,19,58,0.1); color: var(--accent); border: 1px solid rgba(229,19,58,0.2); }
        .badge-subtractive { background: rgba(52, 211, 153, 0.1); color: #10b981; border: 1px solid rgba(52, 211, 153, 0.2); }
        .badge-percent { background: rgba(245,166,35,0.1); color: var(--accent-gold); border: 1px solid rgba(245,166,35,0.2); }

        .form-control, .form-select, textarea { background: #05080F !important; border: 1.5px solid #30363D !important; color: #fff !important; border-radius: 12px; padding: 12px; }
        .modal-content { background: #0D1117; border: 1px solid var(--border); border-radius: 24px; }
        .btn-add-rule { background: var(--gradient); border: none; color: #fff; padding: 10px 24px; border-radius: 12px; font-weight: 700; }
    </style>
</head>
<body>

<aside class=\"sidebar\"></aside>

<main class="main-content">
    <div class="header-section">
        <div>
            <h1 class="page-title">CHÍNH SÁCH GIÁ VÉ</h1>
            <p class="text-muted m-0 small text-uppercase fw-bold">Thiết lập ma trận giá gốc và quy tắc phụ thu thông minh</p>
        </div>
        <button class="btn-add-rule" onclick="openRuleModal()"><i class="bi bi-plus-lg me-2"></i>THÊM QUY TẮC MỚI</button>
    </div>

    <ul class="nav nav-tabs" id="pricingTabs" role="tablist">
        <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabMatrix" type="button">MA TRẬN GIÁ GỐC</button></li>
        <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabRules" type="button">QUY TẮC NÂNG CAO</button></li>
    </ul>

    <div class="tab-content">
        <!-- TAB 1: MATRIX -->
        <div class="tab-pane fade show active" id="tabMatrix" role="tabpanel">
            <div class="table-container">
                <table class="pricing-table">
                    <thead>
                        <tr>
                            <th>Loại Phòng \ Loại Ghế</th>
                            <th>Thường (Standard)</th>
                            <th>VIP</th>
                            <th>Đôi (Couple)</th>
                        </tr>
                    </thead>
                    <tbody id="pricingMatrixBody"></tbody>
                </table>
            </div>
        </div>

        <!-- TAB 2: ADVANCED RULES -->
        <div class="tab-pane fade" id="tabRules" role="tabpanel">
            <div id="rulesList" class="row"></div>
        </div>
    </div>
</main>

<!-- MODAL: BASE PRICE -->
<div class="modal fade" id="priceModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header border-0 pb-0"><h5 class="modal-title fw-bold">CẬP NHẬT GIÁ GỐC</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body p-4"><form id="priceForm"><input type="hidden" id="roomType"><input type="hidden" id="seatType"><div class="mb-3"><label class="small fw-bold text-muted text-uppercase">Đối tượng áp dụng</label><div id="targetDisplay" class="fw-bold text-danger fs-5"></div></div><div class="mb-3"><label class="small fw-bold text-uppercase">Giá vé (VNĐ)</label><input type="number" id="priceInput" class="form-control" required></div><div class="mb-3"><label class="small fw-bold text-uppercase">Ngày hiệu lực</label><input type="date" id="effectiveDate" class="form-control" required></div></form></div><div class="modal-footer border-0"><button class="btn btn-danger w-100 py-3 fw-bold" onclick="savePrice()">LƯU THAY ĐỔI</button></div></div></div></div>

<!-- MODAL: PRICING RULE -->
<div class="modal fade" id="ruleModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header border-0 pb-0"><h5 class="modal-title fw-bold">CẤU HÌNH QUY TẮC GIÁ</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body p-4"><form id="ruleForm"><input type="hidden" id="ruleId"><div class="row g-3"><div class="col-md-8"><label class="small fw-bold">TÊN QUY TẮC</label><input type="text" id="ruleName" class="form-control" placeholder="v.d: Phụ thu Cuối tuần" required></div><div class="col-md-4"><label class="small fw-bold">ĐỘ ƯU TIÊN</label><input type="number" id="rulePriority" class="form-control" value="1"></div><div class="col-md-6"><label class="small fw-bold">LOẠI TÁC ĐỘNG</label><select id="ruleType" class="form-select"><option value="ADDITIVE">Cộng thêm số tiền cố định</option><option value="SUBTRACTIVE">Trừ bớt số tiền cố định</option><option value="PERCENTAGE">Nhân theo tỷ lệ (%)</option></select></div><div class="col-md-6"><label class="small fw-bold">GIÁ TRỊ</label><input type="number" id="ruleValue" step="0.01" class="form-control" placeholder="v.d: 20000 hoặc 1.2" required></div><div class="col-12"><label class="small fw-bold">MÔ TẢ</label><textarea id="ruleDesc" class="form-control" rows="2"></textarea></div><div class="col-md-4"><label class="small fw-bold">ÁP DỤNG PHÒNG</label><select id="ruleRoom" class="form-select"><option value="">Tất cả</option><option value="HALL_2D">Standard 2D</option><option value="HALL_3D">Cinema 3D</option><option value="IMAX">IMAX Elite</option><option value="HALL_4DX">Ultra 4DX</option></select></div><div class="col-md-4"><label class="small fw-bold">ÁP DỤNG GHẾ</label><select id="ruleSeat" class="form-select"><option value="">Tất cả</option><option value="STANDARD">Thường</option><option value="VIP">VIP</option><option value="COUPLE">Đôi</option></select></div><div class="col-md-4"><label class="small fw-bold">ĐỊNH DẠNG</label><select id="ruleFormat" class="form-select"><option value="">Tất cả</option><option value="2D">2D</option><option value="3D">3D</option><option value="IMAX">IMAX</option></select></div><div class="col-12"><label class="small fw-bold">NGÀY TRONG TUẦN</label><div class="d-flex flex-wrap gap-2 mt-2" id="dayContainer"></div></div><div class="col-md-6"><label class="small fw-bold">GIỜ BẮT ĐẦU</label><input type="time" id="ruleStart" class="form-control"></div><div class="col-md-6"><label class="small fw-bold">GIỜ KẾT THÚC</label><input type="time" id="ruleEnd" class="form-control"></div></div></form></div><div class="modal-footer border-0"><button class="btn btn-danger w-100 py-3 fw-bold" onclick="saveRule()">KÍCH HOẠT QUY TẮC</button></div></div></div></div>

<div id="toastContainer"></div>
<script src="/js/auth-guard.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let allPrices = [], allRules = [], ROOM_TYPES = [], SEAT_TYPES = [], FORMATS = [];
    const priceModal = new bootstrap.Modal(document.getElementById('priceModal')), ruleModal = new bootstrap.Modal(document.getElementById('ruleModal'));
    const DAYS = ['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY','SUNDAY'];

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('dayContainer').innerHTML = DAYS.map(d => `<div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="ruleDays" value="${d}" id="day${d}"><label class="form-check-label small" for="day${d}">${d.substring(0,3)}</label></div>`).join('');
        loadData();
    });

    async function loadData() {
        const [pRes, rRes, rtRes, stRes, fRes] = await Promise.all([
            api.get('/admin/pricing'), 
            api.get('/admin/pricing-rules'),
            api.get('/admin/master-data/room-types'),
            api.get('/admin/master-data/seat-types'),
            api.get('/admin/master-data/formats')
        ]);
        
        ROOM_TYPES = rtRes.data || []; 
        SEAT_TYPES = (stRes.data || []).filter(s => s.id !== 'EMPTY' && s.id !== 'DISABLED');
        FORMATS = fRes.data || [];
        allPrices = pRes.data || []; 
        allRules = rRes.data || [];
        
        updateTableHeaders();
        updateModalSelects();
        renderMatrix(); 
        renderRules();
    }

    function updateTableHeaders() {
        const headerRow = document.querySelector('.pricing-table thead tr');
        headerRow.innerHTML = '<th>Loại Phòng \\ Loại Ghế</th>' + SEAT_TYPES.map(s => `<th>${s.name}</th>`).join('');
    }

    function updateModalSelects() {
        const roomSelect = document.getElementById('ruleRoom');
        const seatSelect = document.getElementById('ruleSeat');
        const formatSelect = document.getElementById('ruleFormat');
        
        roomSelect.innerHTML = '<option value="">Tất cả</option>' + ROOM_TYPES.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
        seatSelect.innerHTML = '<option value="">Tất cả</option>' + SEAT_TYPES.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
        formatSelect.innerHTML = '<option value="">Tất cả</option>' + FORMATS.map(f => `<option value="${f.name}">${f.name}</option>`).join('');
    }

    function renderMatrix() {
        document.getElementById('pricingMatrixBody').innerHTML = ROOM_TYPES.map(room => `<tr><td class="room-type-cell">${room.name}</td>${SEAT_TYPES.map(seat => {
            const p = allPrices.find(x => x.roomType === room.id && x.seatType === seat.id);
            return `<td><div class="price-val">${p ? new Intl.NumberFormat().format(p.price) : '---'}</div><button class="btn-edit-price mt-2" onclick="openPriceModal('${room.id}', '${seat.id}', ${p?.price || 0}, '${room.name}', '${seat.name}')">SỬA</button></td>`;
        }).join('')}</tr>`).join('');
    }

    function renderRules() {
        document.getElementById('rulesList').innerHTML = allRules.map(r => `
            <div class="col-md-6">
                <div class="rule-card ${!r.active ? 'inactive' : ''}">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <span class="badge-rule ${r.type==='ADDITIVE'?'badge-additive':r.type==='SUBTRACTIVE'?'badge-subtractive':'badge-percent'}">${r.type}</span>
                            <h5 class="fw-bold mt-2 mb-1">${r.name}</h5>
                            <p class="small text-muted mb-2">${r.description || 'Không có mô tả'}</p>
                        </div>
                        <div class="text-end">
                            <div class="price-val fs-4">${r.type==='ADDITIVE'?'+':r.type==='SUBTRACTIVE'?'-':''}${new Intl.NumberFormat().format(r.value)}${r.type==='PERCENTAGE'?'x':''}</div>
                            <div class="small fw-bold text-muted">Ưu tiên: ${r.priority}</div>
                        </div>
                    </div>
                    <hr class="border-secondary opacity-25">
                    <div class="row g-2 small fw-bold text-muted">
                        <div class="col-6"><i class="bi bi-calendar3 me-2"></i>${r.applicableDays?.length > 0 ? r.applicableDays.map(d=>d.substring(0,3)).join(', ') : 'Mọi ngày'}</div>
                        <div class="col-6"><i class="bi bi-clock me-2"></i>${r.startTime ? r.startTime.substring(0,5) + '-' + r.endTime.substring(0,5) : 'Mọi khung giờ'}</div>
                        <div class="col-6"><i class="bi bi-door-open me-2"></i>${r.applicableRoomType || 'Mọi phòng'}</div>
                        <div class="col-6"><i class="bi bi-grid me-2"></i>${r.applicableSeatType || 'Mọi ghế'}</div>
                    </div>
                    <div class="mt-3 d-flex gap-2">
                        <button class="btn btn-sm btn-outline-light w-100 fw-bold border-0" style="background:rgba(255,255,255,0.05)" onclick='openRuleModal(${JSON.stringify(r)})'>CHỈNH SỬA</button>
                        <button class="btn btn-sm btn-outline-danger border-0" style="background:rgba(229,19,58,0.1)" onclick="deleteRule(${r.id})"><i class="bi bi-trash"></i></button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function openPriceModal(room, seat, price) {
        document.getElementById('roomType').value = room; document.getElementById('seatType').value = seat;
        document.getElementById('targetDisplay').innerText = `${room} - ${seat}`;
        document.getElementById('priceInput').value = price;
        document.getElementById('effectiveDate').value = new Date().toISOString().split('T')[0];
        priceModal.show();
    }

    async function savePrice() {
        const data = { roomType: document.getElementById('roomType').value, seatType: document.getElementById('seatType').value, price: document.getElementById('priceInput').value, effectiveDate: document.getElementById('effectiveDate').value };
        const res = await api.put('/admin/pricing', data);
        if (res.success) { priceModal.hide(); loadData(); }
    }

    function openRuleModal(r = null) {
        document.getElementById('ruleForm').reset();
        document.querySelectorAll('input[name="ruleDays"]').forEach(cb => cb.checked = false);
        if(r) {
            document.getElementById('ruleId').value = r.id;
            document.getElementById('ruleName').value = r.name;
            document.getElementById('rulePriority').value = r.priority;
            document.getElementById('ruleType').value = r.type;
            document.getElementById('ruleValue').value = r.value;
            document.getElementById('ruleDesc').value = r.description;
            document.getElementById('ruleRoom').value = r.applicableRoomType || "";
            document.getElementById('ruleSeat').value = r.applicableSeatType || "";
            document.getElementById('ruleFormat').value = r.applicableFormat || "";
            document.getElementById('ruleStart').value = r.startTime || "";
            document.getElementById('ruleEnd').value = r.endTime || "";
            r.applicableDays?.forEach(d => { const cb = document.getElementById('day' + d); if(cb) cb.checked = true; });
        } else {
            document.getElementById('ruleId').value = "";
        }
        ruleModal.show();
    }

    async function saveRule() {
        const days = Array.from(document.querySelectorAll('input[name="ruleDays"]:checked')).map(cb => cb.value);
        const data = {
            name: document.getElementById('ruleName').value,
            priority: document.getElementById('rulePriority').value,
            type: document.getElementById('ruleType').value,
            value: document.getElementById('ruleValue').value,
            description: document.getElementById('ruleDesc').value,
            applicableRoomType: document.getElementById('ruleRoom').value || null,
            applicableSeatType: document.getElementById('ruleSeat').value || null,
            applicableFormat: document.getElementById('ruleFormat').value || null,
            applicableDays: days.length > 0 ? days : null,
            startTime: document.getElementById('ruleStart').value ? document.getElementById('ruleStart').value + ":00" : null,
            endTime: document.getElementById('ruleEnd').value ? document.getElementById('ruleEnd').value + ":00" : null,
            active: true
        };
        const id = document.getElementById('ruleId').value;
        const res = id ? await api.put('/admin/pricing-rules/' + id, data) : await api.post('/admin/pricing-rules', data);
        if (res.success) { ruleModal.hide(); loadData(); }
    }

    async function deleteRule(id) {
        if(confirm('Xóa quy tắc này?')) {
            const res = await api.delete('/admin/pricing-rules/' + id);
            if(res.success) loadData();
        }
    }
</script>
</body>
</html>
