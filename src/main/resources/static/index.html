<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarCinema – Trải Nghiệm Điện Ảnh Đỉnh Cao</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <style>
        :root {
          --bg: #080B14; --surface: #0F1320; --card: #161B2E; --border: #252A3D;
          --accent: #E5133A; --accent-gold: #F5A623; --text: #E8EAF0; --text-muted: #7B82A0;
          --gradient: linear-gradient(135deg, #E5133A, #8B0020);
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }

        /* ── NAVBAR ── */
        .navbar-star { background: rgba(8,11,20,0.92); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); padding: 14px 0; position: sticky; top: 0; z-index: 100; }
        .brand { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 3px; color: var(--text); }
        .brand span { color: var(--accent); }
        .nav-link-star { color: var(--text-muted); font-size: 0.9rem; font-weight: 500; padding: 6px 16px; border-radius: 6px; transition: 0.2s; }
        .nav-link-star:hover, .nav-link-star.active { color: var(--text); background: rgba(255,255,255,0.05); }
        .nav-link-star.active { color: var(--accent); }
        .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--gradient); display: flex; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; color: #fff; }

        /* ── HERO ── */
        .hero { position: relative; height: 550px; overflow: hidden; display: flex; align-items: center; }
        .hero-bg-overlay { position: absolute; inset: 0; background: linear-gradient(to right, #080B14 20%, rgba(8,11,20,0.4) 100%), linear-gradient(to top, #080B14 0%, transparent 50%); z-index: 2; }
        .hero-backdrop { position: absolute; right: 0; top: 0; width: 70%; height: 100%; z-index: 1; overflow: hidden; }
        .hero-backdrop img { width: 100%; height: 100%; object-fit: cover; opacity: 0.5; mask-image: linear-gradient(to left, black 70%, transparent 100%); -webkit-mask-image: linear-gradient(to left, black 70%, transparent 100%); }
        .hero-content { position: relative; z-index: 3; padding: 0 60px; max-width: 800px; }
        .hero-title { font-family: 'Bebas Neue', sans-serif; font-size: 4.5rem; line-height: 1; margin-bottom: 20px; letter-spacing: 2px; }
        .hero-desc { color: var(--text-muted); font-size: 1rem; line-height: 1.6; margin-bottom: 30px; max-width: 500px; }
        .btn-hero { padding: 14px 32px; border-radius: 10px; font-weight: 700; display: inline-flex; align-items: center; gap: 10px; transition: 0.2s; cursor: pointer; }
        .btn-hero-primary { background: var(--gradient); color: #fff; border: none; }
        .btn-hero-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(10px); }
        .btn-hero:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }

        /* ── MOVIE GRID ── */
        .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 2px; margin-bottom: 30px; display: flex; align-items: center; gap: 15px; }
        .section-title::before { content: ''; width: 4px; height: 30px; background: var(--accent); border-radius: 2px; }
        .movie-card { background: var(--card); border-radius: 16px; overflow: hidden; border: 1px solid var(--border); transition: 0.3s; cursor: pointer; height: 100%; }
        .movie-card:hover { transform: translateY(-8px); border-color: var(--accent); box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        .movie-poster { position: relative; aspect-ratio: 2/3; overflow: hidden; }
        .movie-poster img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .movie-card:hover .movie-poster img { transform: scale(1.1); }
        .age-badge { position: absolute; top: 12px; left: 12px; padding: 3px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; z-index: 2; }
        .age-p { background: #50C864; color: #000; }
        .age-c13 { background: #64B4FF; color: #000; }
        .age-c18 { background: var(--accent); color: #fff; }
        .movie-info { padding: 15px; }
        .movie-name { font-weight: 700; font-size: 1rem; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .movie-meta { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); }

        /* Trailer Modal */
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .modal-content { background: #000; border: 1px solid var(--border); }

        .hero-dots { display: flex; gap: 8px; position: absolute; bottom: 30px; left: 60px; z-index: 4; }
        .hero-dot { width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.2); cursor: pointer; transition: 0.3s; }
        .hero-dot.active { width: 30px; background: var(--accent); }
    </style>
</head>
<body>

<nav class="navbar-star">
    <div class="container-xxl d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-4">
            <a href="index.html" class="brand">STAR<span>CINEMA</span></a>
            <div class="d-none d-lg-flex gap-2">
                <a href="index.html" class="nav-link-star active">Phim</a>
                <a href="history.html" class="nav-link-star">Vé của tôi</a>
            </div>
        </div>
        <div id="authSection" class="d-flex align-items-center gap-3">
            <button class="btn btn-danger btn-sm px-4" onclick="window.location.href='auth.html'">Đăng nhập</button>
        </div>
    </div>
</nav>

<section class="hero" id="heroSlider">
    <div class="hero-bg-overlay"></div>
    <div class="hero-backdrop" id="heroBackdrop"></div>
    <div class="hero-content">
        <div class="text-accent fw-bold mb-2 small text-uppercase" style="letter-spacing:2px; color: var(--accent)">Phim nổi bật</div>
        <h1 class="hero-title" id="heroTitle">Đang tải...</h1>
        <p class="hero-desc" id="heroDesc">...</p>
        <div class="d-flex gap-3">
            <button class="btn-hero btn-hero-primary" id="btnHeroBook"><i class="bi bi-ticket-perforated"></i> ĐẶT VÉ NGAY</button>
            <button class="btn-hero btn-hero-secondary" id="btnHeroTrailer"><i class="bi bi-play-circle"></i> XEM TRAILER</button>
        </div>
    </div>
    <div class="hero-dots" id="heroDots"></div>
</section>

<main class="container-xxl py-5">
    <div class="section-title">Phim Đang Chiếu</div>
    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-4" id="movieGrid">
        <!-- Movies loaded via JS -->
    </div>
</main>

<div class="modal fade" id="trailerModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0 pb-0"><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
            <div class="modal-body p-0"><div class="video-container" id="videoContainer"></div></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
    let movies = [], heroIdx = 0, heroTimer;
    const trailerModal = new bootstrap.Modal(document.getElementById('trailerModal'));

    function getFullImageUrl(path) {
        if (!path) return 'https://placehold.co/300x450?text=No+Poster';
        if (path.startsWith('http')) return path;
        const cleanPath = path.startsWith('/') ? path : '/' + path;
        return `https://image.tmdb.org/t/p/w500${cleanPath}`;
    }

    async function init() {
        const res = await api.get('/movies/showing');
        if (res.success && res.data) {
            movies = res.data;
            renderMovies();
            initHero();
        }
        
        const user = localStorage.getItem('cinemaUsername');
        if (user) {
            document.getElementById('authSection').innerHTML = `
                <div class="d-flex align-items-center gap-3">
                    <span class="small text-muted fw-bold">${user}</span>
                    <div class="user-avatar" onclick="window.location.href='history.html?tab=profile'">${user.charAt(0).toUpperCase()}</div>
                    <button class="btn btn-sm btn-outline-secondary" onclick="logout()" title="Đăng xuất"><i class="bi bi-box-arrow-right"></i></button>
                </div>
            `;
        }
    }

    function logout() {
        if (confirm('Bạn có chắc chắn muốn đăng xuất?')) {
            localStorage.removeItem('cinemaToken');
            localStorage.removeItem('cinemaUsername');
            localStorage.removeItem('cinemaRole');
            window.location.href = 'index.html';
        }
    }

    function renderMovies() {
        document.getElementById('movieGrid').innerHTML = movies.map(m => `
            <div class="col">
                <div class="movie-card" onclick="window.location.href='movie-detail.html?id=${m.id}'">
                    <div class="movie-poster">
                        <img src="${getFullImageUrl(m.posterUrl)}">
                        <div class="age-badge age-${m.ageRating.toLowerCase()}">${m.ageRating}</div>
                    </div>
                    <div class="movie-info">
                        <div class="movie-name">${m.title}</div>
                        <div class="movie-meta"><span>⭐ ${m.rating || 0}</span><span>${m.duration}p</span></div>
                    </div>
                </div>
            </div>`).join('');
    }

    function initHero() {
        if (!movies.length) return;
        const dots = document.getElementById('heroDots');
        dots.innerHTML = movies.slice(0, 5).map((_, i) => `<div class="hero-dot ${i===0?'active':''}" onclick="setHero(${i})"></div>`).join('');
        setHero(0);
        if(heroTimer) clearInterval(heroTimer);
        heroTimer = setInterval(() => { heroIdx = (heroIdx + 1) % Math.min(5, movies.length); setHero(heroIdx); }, 5000);
    }

    function setHero(idx) {
        heroIdx = idx;
        const m = movies[idx];
        document.getElementById('heroTitle').textContent = m.title;
        document.getElementById('heroDesc').textContent = m.description || 'Trải nghiệm điện ảnh đỉnh cao tại StarCinema.';
        document.getElementById('heroBackdrop').innerHTML = `<img src="${getFullImageUrl(m.posterUrl)}">`;
        document.getElementById('btnHeroBook').onclick = () => window.location.href = `movie-detail.html?id=${m.id}`;
        
        const btnT = document.getElementById('btnHeroTrailer');
        if (m.trailerUrl) {
            btnT.style.display = 'inline-flex';
            btnT.onclick = () => openTrailer(m.trailerUrl);
        } else btnT.style.display = 'none';

        document.querySelectorAll('.hero-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
    }

    function openTrailer(url) {
        let id = '';
        if (url.includes('v=')) id = url.split('v=')[1].split('&')[0];
        else if (url.includes('youtu.be/')) id = url.split('youtu.be/')[1].split('?')[0];
        if (id) {
            document.getElementById('videoContainer').innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" allowfullscreen allow="autoplay"></iframe>`;
            trailerModal.show();
            document.getElementById('trailerModal').addEventListener('hidden.bs.modal', () => { document.getElementById('videoContainer').innerHTML = ''; }, {once: true});
        }
    }

    init();
</script>
</body>
</html>
