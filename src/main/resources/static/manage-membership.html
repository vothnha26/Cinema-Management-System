<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Thành viên – StarCinema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <style>
        :root {
          --bg: #080B14; --surface: #0F1320; --card: #161B2E; --border: #252A3D;
          --accent: #E5133A; --accent-gold: #F5A623; --text: #E8EAF0; --text-muted: #7B82A0;
          --gradient: linear-gradient(135deg, #E5133A, #8B0020);
          --sidebar-width: 260px;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; overflow-x: hidden; }
        .sidebar { width: var(--sidebar-width); background: var(--surface); border-right: 1px solid var(--border); height: 100vh; position: fixed; top: 0; left: 0; z-index: 1000; padding: 24px; display: flex; flex-direction: column; }
        .brand { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 3px; color: var(--text); margin-bottom: 40px; text-decoration: none; }
        .brand span { color: var(--accent); }
        .nav-link-admin { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text-muted); text-decoration: none; border-radius: 10px; transition: all 0.2s; font-weight: 500; margin-bottom: 8px; }
        .nav-link-admin:hover, .nav-link-admin.active { background: rgba(229,19,58,0.1); color: var(--accent); }
        .nav-link-admin.active { background: var(--gradient); color: #fff; }
        .user-panel { border-top: 1px solid var(--border); padding-top: 20px; margin-top: auto; }

        .main-content { margin-left: var(--sidebar-width); padding: 40px; min-height: 100vh; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; letter-spacing: 1px; margin: 0; }

        .btn-add { background: var(--gradient); border: none; color: #fff; padding: 10px 24px; border-radius: 10px; font-weight: 600; transition: 0.2s; }
        
        .benefit-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; transition: 0.3s; position: relative; }
        .benefit-card:hover { border-color: var(--accent-gold); transform: translateY(-5px); }
        .tier-badge { font-weight: 800; font-size: 1.2rem; margin-bottom: 15px; display: block; }
        .tier-standard { color: var(--text-muted); }
        .tier-silver { color: #C0C0C0; }
        .tier-gold { color: #FFD700; }
        .tier-platinum { color: #E5E4E2; }
        
        .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-top: 30px; }
        .table { margin: 0; color: var(--text); }
        .table thead { background: var(--surface); }
        .table th { padding: 16px 24px; border: none; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; }
        .table td { padding: 16px 24px; border-top: 1px solid var(--border); vertical-align: middle; }

        .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 20px; color: var(--text); }
        .form-control, .form-select { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 10px; }
        .form-control:focus { border-color: var(--accent); background: var(--surface); color: #fff; outline: none; box-shadow: none; }
    </style>
</head>
<body>

<aside class="sidebar"></aside>

<main class="main-content">
    <div class="header-section">
        <div>
            <h1 class="page-title">Cấu hình Hạng thành viên</h1>
            <p class="text-muted m-0">Thiết lập quyền lợi giảm giá cho từng phân hạng hội viên.</p>
        </div>
        <button class="btn-add" onclick="openAddBenefitModal()">
            <i class="bi bi-plus-lg me-2"></i> THÊM HẠNG MỚI
        </button>
    </div>

    <div class="row g-4" id="benefitGrid">
        <div class="col-12 text-center py-5 text-muted">Đang tải cấu hình...</div>
    </div>

    <div class="header-section mt-5">
        <div>
            <h1 class="page-title" style="font-size: 1.8rem">Danh sách Hội viên</h1>
            <p class="text-muted m-0">Quản lý điểm thưởng và phân hạng khách hàng.</p>
        </div>
    </div>

    <div class="table-container">
        <table class="table">
            <thead>
                <tr>
                    <th>Khách hàng</th>
                    <th>Phân hạng</th>
                    <th>Điểm hiện có</th>
                    <th>Tổng chi tiêu</th>
                    <th class="text-end">Thao tác</th>
                </tr>
            </thead>
            <tbody id="customerTableBody">
                <tr><td colspan="5" class="text-center py-5 text-muted">Đang tải danh sách khách hàng...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<!-- BENEFIT MODAL -->
<div class="modal fade" id="benefitModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="benefitModalTitle">CẬP NHẬT QUYỀN LỢI</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form id="benefitForm">
                    <div class="mb-3" id="tierSelectGroup">
                        <label class="form-label small fw-bold text-muted">Chọn hạng thành viên</label>
                        <select id="benefitTier" class="form-select">
                            <option value="STANDARD">STANDARD</option>
                            <option value="SILVER">SILVER</option>
                            <option value="GOLD">GOLD</option>
                            <option value="PLATINUM">PLATINUM</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Giảm giá (%)</label>
                        <input type="number" id="benefitDiscount" class="form-control" required step="0.1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Hệ số tích điểm (x)</label>
                        <input type="number" id="benefitMultiplier" class="form-control" step="0.1" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Hủy</button>
                <button type="button" class="btn btn-danger px-4 fw-bold" id="btnSaveBenefit" onclick="saveBenefit()">LƯU THÔNG TIN</button>
            </div>
        </div>
    </div>
</div>

<script src="/js/auth-guard.js"></script>
<script>AuthGuard.requireRole(['MANAGER', 'ADMIN']);</script>
<script src="/js/sidebar.js"></script>
<script src="/js/api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let benefitModal;
    let allBenefits = [];
    let isEditingBenefit = false;

    document.addEventListener('DOMContentLoaded', () => {
        benefitModal = new bootstrap.Modal(document.getElementById('benefitModal'));
        loadBenefits();
        loadCustomers();
    });

    async function loadBenefits() {
        try {
            const res = await api.get('/membership-benefits');
            if (res.success) {
                allBenefits = res.data;
                renderBenefits(allBenefits);
            }
        } catch (e) { console.error(e); }
    }

    function renderBenefits(benefits) {
        document.getElementById('benefitGrid').innerHTML = benefits.map(b => `
            <div class="col-md-3">
                <div class="benefit-card">
                    <span class="tier-badge tier-${b.tier.toLowerCase()}">${b.tier} MEMBER</span>
                    <div class="mb-2 text-muted small">Giảm giá: <strong class="text-white">${b.discountPercent}%</strong></div>
                    <div class="mb-3 text-muted small">Tích điểm: <strong class="text-white">x${b.pointMultiplier}</strong></div>
                    <button class="btn btn-sm btn-outline-light w-100" onclick="openEditBenefitModal('${b.tier}')">Chỉnh sửa</button>
                </div>
            </div>
        `).join('');
    }

    function openAddBenefitModal() {
        isEditingBenefit = false;
        document.getElementById('benefitModalTitle').innerText = 'THÊM CẤU HÌNH HẠNG';
        document.getElementById('tierSelectGroup').style.display = 'block';
        document.getElementById('benefitForm').reset();
        benefitModal.show();
    }

    function openEditBenefitModal(tier) {
        isEditingBenefit = true;
        const b = allBenefits.find(x => x.tier === tier);
        if (!b) return;
        document.getElementById('benefitModalTitle').innerText = 'CHỈNH SỬA QUYỀN LỢI';
        document.getElementById('tierSelectGroup').style.display = 'none'; // Không cho đổi tier khi đang edit
        document.getElementById('benefitTier').value = tier;
        document.getElementById('benefitDiscount').value = b.discountPercent;
        document.getElementById('benefitMultiplier').value = b.pointMultiplier;
        benefitModal.show();
    }

    async function saveBenefit() {
        const tier = document.getElementById('benefitTier').value;
        const discount = document.getElementById('benefitDiscount').value;
        const multiplier = document.getElementById('benefitMultiplier').value;
        const btn = document.getElementById('btnSaveBenefit');

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Đang lưu...';

        try {
            let res;
            if (isEditingBenefit) {
                res = await api.put(`/membership-benefits/${tier}?discountPercent=${discount}&pointMultiplier=${multiplier}`, {});
            } else {
                res = await api.post(`/membership-benefits?tier=${tier}&discountPercent=${discount}&pointMultiplier=${multiplier}`, {});
            }

            if (res.success) {
                benefitModal.hide();
                await loadBenefits();
                alert('Thành công!');
            } else alert('Lỗi: ' + res.message);
        } catch (e) {
            alert('Lỗi hệ thống.');
        } finally {
            btn.disabled = false;
            btn.innerText = 'LƯU THÔNG TIN';
        }
    }

    async function loadCustomers() {
        try {
            const res = await api.get('/admin/customers');
            if (res.success) {
                document.getElementById('customerTableBody').innerHTML = res.data.map(c => `
                    <tr>
                        <td>
                            <div class="fw-bold">${c.fullName || 'N/A'}</div>
                            <div class="small text-muted">${c.phone || c.email || ''}</div>
                        </td>
                        <td><span class="badge bg-dark border border-secondary tier-${c.membershipTier.toLowerCase()}">${c.membershipTier}</span></td>
                        <td class="text-warning fw-bold">${new Intl.NumberFormat().format(c.points)} pts</td>
                        <td>${new Intl.NumberFormat('vi-VN').format(c.totalSpending)}đ</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-info" onclick="alert('Tính năng đang phát triển: Xem lịch sử giao dịch khách hàng')"><i class="bi bi-clock-history"></i></button>
                        </td>
                    </tr>
                `).join('');
            }
        } catch (e) { console.error(e); }
    }
</script>
</body>
</html>
