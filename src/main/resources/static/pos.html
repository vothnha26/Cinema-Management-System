<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarCinema POS – Bán vé & Soát vé</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
          --bg: #0A0F1A; --surface: #141B2D; --card: #1F2940; --border: #2D3748;
          --accent: #E5133A; --accent-gold: #F5A623; --text: #E2E8F0; --text-muted: #94A3B8;
          --success: #10B981; --info: #3B82F6;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* ── TOPBAR ── */
        .pos-topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 24px; display: flex; justify-content: space-between; align-items: center; }
        .pos-tabs { display: flex; background: var(--bg); padding: 4px; border-radius: 10px; gap: 4px; }
        .pos-tab { padding: 6px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; color: var(--text-muted); transition: 0.2s; }
        .pos-tab.active { background: var(--accent); color: #fff; }

        /* ── LAYOUT ── */
        .pos-container { display: grid; grid-template-columns: 280px 1fr 380px; flex: 1; overflow: hidden; }
        .pos-sidebar-left { background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; padding: 15px; }
        .pos-main { padding: 20px; overflow-y: auto; background: var(--bg); }
        .pos-sidebar-right { background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; }

        /* ── MOVIE & SHOWTIME ── */
        .movie-item { display: flex; gap: 12px; padding: 10px; border-radius: 12px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; margin-bottom: 8px; }
        .movie-item:hover { background: rgba(255,255,255,0.05); }
        .movie-item.active { background: rgba(229,19,58,0.1); border-color: var(--accent); }
        .movie-poster { width: 50px; height: 75px; border-radius: 6px; object-fit: cover; background: var(--card); }
        .movie-name { font-weight: 700; font-size: 0.85rem; color: #fff; margin-bottom: 2px; }
        
        .st-btn { background: var(--card); border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 10px; text-align: center; cursor: pointer; transition: 0.2s; }
        .st-btn:hover { border-color: var(--accent); }
        .st-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

        /* ── SEAT MAP ── */
        .seat-grid-pos { display: grid; gap: 4px; margin: 0 auto; width: fit-content; padding: 20px; }
        .seat-pos { width: 30px; height: 28px; border-radius: 5px; background: #2D3748; border: 1.5px solid #4A5568; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 700; color: #cbd5e0; }
        .seat-pos.selected { background: var(--accent) !important; border-color: var(--accent) !important; color: #fff !important; }
        .seat-pos.booked { background: #1A202C !important; border-color: #1A202C !important; color: transparent !important; cursor: not-allowed; }
        .seat-pos.vip { border-color: var(--accent-gold); color: var(--accent-gold); }
        .seat-pos.couple { width: 64px; border-color: #9B59B6; color: #9B59B6; }

        /* ── BILLING ── */
        .bill-footer { padding: 20px; background: var(--surface); border-top: 1px solid var(--border); }
        .total-row { display: flex; justify-content: space-between; font-size: 1.5rem; font-weight: 800; color: var(--accent); margin-top: 10px; }
        .btn-pay { width: 100%; height: 50px; border-radius: 12px; background: var(--gradient); color: #fff; border: none; font-weight: 700; margin-top: 15px; }
        .order-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem; color: #fff; }

        /* ── TOAST ── */
        .toast-container { position: fixed; top: 30px; right: 30px; z-index: 9999; }
        .toast-elite {
            min-width: 320px; background: rgba(31, 41, 64, 0.98); border: 1px solid var(--border); border-radius: 16px; padding: 16px 20px;
            display: flex; align-items: center; gap: 15px; margin-bottom: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            animation: toastIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes toastIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .ts-icon { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
        .ts-success { background: rgba(16,185,129,0.15); color: var(--success); }
        .ts-error { background: rgba(229,19,58,0.15); color: var(--accent); }
        .ts-info { background: rgba(59,130,246,0.15); color: var(--info); }
        .ts-content { flex: 1; }
        .ts-title { font-weight: 700; font-size: 0.9rem; color: #fff; margin-bottom: 2px; }
        .ts-msg { font-size: 0.8rem; color: var(--text-muted); }

        .d-none { display: none !important; }
        .row-label { width: 20px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: var(--text-muted); font-weight: 800; }
        .alert { border-radius: 12px; border: none; }
        .alert-success { background: rgba(16,185,129,0.1); color: var(--success); }
        .alert-danger { background: rgba(229,19,58,0.1); color: var(--accent); }
    </style>
</head>
<body>

<header class="pos-topbar">
    <div class="fw-bold fs-5">STAR<span class="text-danger">CINEMA</span> POS</div>
    <div class="pos-tabs">
        <div class="pos-tab active" onclick="switchTab('sales')">BÁN VÉ</div>
        <div class="pos-tab" onclick="switchTab('checkin')">SOÁT VÉ</div>
    </div>
    <div class="staff-info d-flex align-items-center gap-3">
        <span class="small text-muted" id="staffNameDisplay">Nhân viên</span>
        <button class="btn btn-sm btn-outline-danger" onclick="logout()"><i class="bi bi-box-arrow-right"></i></button>
    </div>
</header>

<div class="pos-container" id="salesContainer">
    <aside class="pos-sidebar-left">
        <div class="section-title mb-3 small fw-bold text-muted text-uppercase">Danh sách phim</div>
        <div id="movieList"></div>
    </aside>

    <main class="pos-main">
        <div id="showtimeArea" class="mb-4">
            <div class="section-title small fw-bold text-muted mb-3">CHỌN SUẤT CHIẾU <span id="activeMovieName" class="text-white ms-2"></span></div>
            <div id="showtimeGroups"><div class="text-center py-4 text-muted small">Vui lòng chọn phim ở cột bên trái</div></div>
        </div>
        <div id="seatArea" class="d-none mb-5">
            <div class="section-title small fw-bold text-muted mb-3">SƠ ĐỒ GHẾ: <span id="activeRoomName" class="text-white ms-2"></span></div>
            <div class="seat-grid-pos" id="posSeatGrid"></div>
        </div>
        <div id="comboArea" class="mt-4">
            <div class="section-title small fw-bold text-muted mb-3">BẮP NƯỚC & ĐỒ UỐNG</div>
            <div class="row g-3" id="posComboGrid"></div>
        </div>
    </main>

    <aside class="pos-sidebar-right">
        <div class="order-content">
            <div class="member-box p-3 rounded-4" style="background: rgba(255,255,255,0.03); border: 1px solid var(--border);">
                <div class="small fw-bold text-muted mb-2 text-uppercase" style="font-size: 0.65rem;">Ưu đãi & Hội viên</div>
                <div class="input-group input-group-sm mb-2">
                    <input type="text" id="memberPhone" class="form-control bg-dark border-secondary text-white" placeholder="SĐT khách hàng...">
                    <button class="btn btn-info text-white" onclick="lookupMember()"><i class="bi bi-search"></i></button>
                </div>
                <div class="input-group input-group-sm mb-2">
                    <input type="text" id="voucherCode" class="form-control bg-dark border-secondary text-white" placeholder="Mã giảm giá...">
                    <button class="btn btn-danger" onclick="applyVoucher()">ÁP DỤNG</button>
                </div>
                <div id="memberInfo" class="d-none mt-2 pt-2 border-top border-secondary">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fw-bold" style="color:#fff" id="memberName">...</span>
                        <i class="bi bi-x-circle text-danger cursor-pointer" onclick="clearMember()" style="cursor:pointer"></i>
                    </div>
                    <div class="small text-warning"><span id="memberTier">GOLD</span> Member</div>
                </div>
                <div id="appliedVoucherBadge" class="d-none mt-2 p-2 rounded bg-success bg-opacity-10 border border-success border-opacity-25 d-flex justify-content-between align-items-center">
                    <span class="small fw-bold text-success"><i class="bi bi-tag-fill me-1"></i><span id="appliedVoucherName">VOUCHER</span></span>
                    <i class="bi bi-x text-success cursor-pointer" onclick="removeVoucher()" style="cursor:pointer"></i>
                </div>
            </div>
            <div class="section-title small fw-bold text-muted mt-4 mb-3 text-uppercase">Chi tiết đơn hàng</div>
            <div id="orderItems"></div>
        </div>
        <div class="bill-footer">
            <div class="d-flex justify-content-between mb-1 small"><span class="text-muted">Tạm tính:</span><span id="billSubtotal" style="color:#fff">0đ</span></div>
            <div class="d-flex justify-content-between mb-1 small text-success"><span>Hạng thẻ:</span><span id="billDiscount">-0đ</span></div>
            <div class="d-flex justify-content-between mb-1 small text-success"><span>Voucher:</span><span id="billVoucher">-0đ</span></div>
            <div class="total-row"><span>TỔNG</span><span id="billTotal">0đ</span></div>
            <button class="btn-pay" id="btnFinalize" disabled onclick="finalizeSale()">XÁC NHẬN & IN VÉ</button>
        </div>
    </aside>
</div>

<div class="pos-main d-none" id="checkinContainer" style="width: 100%;">
    <div style="max-width: 500px; margin: 60px auto; text-align: center;">
        <div class="p-5 rounded-4" style="border: 2px dashed var(--border); background: var(--surface);">
            <i class="bi bi-qr-code-scan fs-1 text-danger mb-3"></i>
            <h4 class="fw-bold text-white">SOÁT VÉ VÀO PHÒNG</h4>
            <input type="text" id="checkinCode" class="form-control form-control-lg bg-dark text-white text-center mt-4 mb-3" placeholder="BKG-XXXXXXXX" style="letter-spacing: 2px; font-family: monospace;">
            <button class="btn btn-danger w-100 py-3 fw-bold" id="btnCheckin" onclick="validateCheckin()">XÁC NHẬN VÀO CỔNG</button>
        </div>
        <div id="checkinStatus" class="mt-4"></div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="/js/api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let allMovies = [], allShowtimes = [], allCombos = [];
    let selectedMovieId = null, selectedShowtime = null, selectedSeats = [], selectedCombos = {}, currentMember = null, appliedVoucher = null;

    function showNotify(title, msg, type='success') {
        const container = document.getElementById('toastContainer');
        const icons = { success: 'bi-check-circle-fill', error: 'bi-exclamation-triangle-fill', info: 'bi-info-circle-fill' };
        const toast = document.createElement('div');
        toast.className = 'toast-elite';
        toast.innerHTML = `
            <div class="ts-icon ts-${type}"><i class="bi ${icons[type]}"></i></div>
            <div class="ts-content">
                <div class="ts-title">${title}</div>
                <div class="ts-msg">${msg}</div>
            </div>`;
        container.appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(50px)'; setTimeout(() => toast.remove(), 400); }, 4000);
    }

    function getFullImageUrl(path) {
        if (!path) return 'https://placehold.co/300x450?text=No+Img';
        if (path.startsWith('http')) return path;
        const cleanPath = path.startsWith('/') ? path : '/' + path;
        return `https://image.tmdb.org/t/p/w500${cleanPath}`;
    }

    async function init() {
        const token = localStorage.getItem('cinemaToken');
        if(!token) window.location.href = 'auth.html';
        document.getElementById('staffNameDisplay').textContent = localStorage.getItem('cinemaUsername') || 'Nhân viên';
        try {
            const [mRes, stRes, cRes] = await Promise.all([api.get('/movies/showing'), api.get('/showtimes?date=' + new Date().toISOString().split('T')[0]), api.get('/combos')]);
            allMovies = mRes.data || []; allShowtimes = stRes.data || []; allCombos = cRes.data || [];
            renderMovies(); renderCombos();
        } catch(e) { showNotify('Lỗi hệ thống', 'Không thể kết nối đến máy chủ.', 'error'); }
    }

    function logout() {
        localStorage.removeItem('cinemaToken');
        localStorage.removeItem('cinemaUsername');
        localStorage.removeItem('cinemaRole');
        window.location.href = 'auth.html';
    }

    function renderMovies() {
        document.getElementById('movieList').innerHTML = allMovies.map(m => `
            <div class="movie-item ${selectedMovieId === m.id ? 'active' : ''}" onclick="selectMovie(${m.id})">
                <img src="${getFullImageUrl(m.posterUrl)}" class="movie-poster" onerror="this.src='https://placehold.co/50x75'">
                <div class="movie-info"><div class="movie-name">${m.title}</div><div class="movie-meta text-uppercase">${m.ageRating} • ${m.duration}p</div></div>
            </div>`).join('');
    }

    function renderCombos() {
        document.getElementById('posComboGrid').innerHTML = allCombos.map(c => `
            <div class="col-md-6">
                <div class="p-3 rounded-3" style="background: var(--card); border: 1px solid var(--border);">
                    <div class="fw-bold small text-truncate text-white">${c.name}</div>
                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <span class="text-warning fw-bold small">${c.price.toLocaleString()}đ</span>
                        <div class="d-flex align-items-center gap-2">
                            <div class="btn btn-sm btn-dark p-0" style="width:24px;height:24px;color:#fff" onclick="changeCombo(${c.id}, -1)">-</div>
                            <span class="fw-bold small text-white">${selectedCombos[c.id] || 0}</span>
                            <div class="btn btn-sm btn-dark p-0" style="width:24px;height:24px;color:#fff" onclick="changeCombo(${c.id}, 1)">+</div>
                        </div>
                    </div>
                </div>
            </div>`).join('');
    }

    function changeCombo(id, delta) {
        selectedCombos[id] = (selectedCombos[id] || 0) + delta;
        if(selectedCombos[id] <= 0) delete selectedCombos[id];
        renderCombos(); updateOrder();
    }

    function selectMovie(id) {
        selectedMovieId = id;
        const movie = allMovies.find(x => x.id === id);
        document.getElementById('activeMovieName').textContent = `— ${movie.title}`;
        selectedShowtime = null; selectedSeats = [];
        renderMovies(); renderShowtimeGroups(id);
        document.getElementById('seatArea').classList.add('d-none');
        updateOrder();
    }

    function renderShowtimeGroups(movieId) {
        const movieST = allShowtimes.filter(s => s.movieId === movieId);
        const futureST = movieST.filter(s => new Date(s.startTime) > new Date());
        if(!futureST.length) { document.getElementById('showtimeGroups').innerHTML = '<div class="text-center py-4 text-muted small">Không còn suất chiếu khả dụng</div>'; return; }
        const grouped = futureST.reduce((acc, s) => { const k = s.formatName || '2D'; if(!acc[k]) acc[k] = []; acc[k].push(s); return acc; }, {});
        document.getElementById('showtimeGroups').innerHTML = Object.entries(grouped).map(([fmt, list]) => `
            <div class="st-group">
                <div class="st-group-title">${fmt.replace('HALL_','')}</div>
                <div class="st-grid">${list.map(s => `
                    <div class="st-btn ${selectedShowtime?.id === s.id ? 'active' : ''}" onclick="selectShowtime(${s.id})">
                        <div class="st-time">${new Date(s.startTime).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
                        <div class="st-room">${s.roomName}</div>
                    </div>`).join('')}</div>
            </div>`).join('');
    }

    async function selectShowtime(id) {
        selectedShowtime = allShowtimes.find(x => x.id === id);
        selectedSeats = [];
        renderShowtimeGroups(selectedMovieId);
        document.getElementById('activeRoomName').textContent = selectedShowtime.roomName;
        document.getElementById('seatArea').classList.remove('d-none');
        const res = await api.get(`/showtimes/${id}/seats`);
        if(res.success) renderSeats(res.data);
        updateOrder();
    }

    function renderSeats(seats) {
        const grid = document.getElementById('posSeatGrid');
        const rows = [...new Set(seats.map(s => s.rowChar))].sort();
        const maxCol = Math.max(...seats.map(s => s.colNum));
        grid.style.gridTemplateColumns = `20px repeat(${maxCol}, 30px)`;
        grid.innerHTML = '';
        rows.forEach(r => {
            grid.insertAdjacentHTML('beforeend', `<div class="row-label">${r}</div>`);
            for(let c=1; c<=maxCol; c++) {
                const s = seats.find(x => x.rowChar === r && x.colNum === c);
                if(!s) { grid.insertAdjacentHTML('beforeend', '<div></div>'); continue; }
                const isSel = selectedSeats.find(x => x.id === s.id);
                const cls = `seat-pos ${s.seatType.toLowerCase()} ${!s.available?'booked':''} ${isSel?'selected':''}`;
                const el = document.createElement('div'); el.className = cls; el.textContent = s.available ? s.seatCode : '';
                if(s.available) el.onclick = () => toggleSeat(s);
                grid.appendChild(el);
            }
        });
    }

    function toggleSeat(s) {
        const idx = selectedSeats.findIndex(x => x.id === s.id);
        if(idx > -1) selectedSeats.splice(idx, 1); else selectedSeats.push(s);
        updateOrder();
        document.querySelectorAll('.seat-pos').forEach(el => { if(el.textContent === s.seatCode) el.classList.toggle('selected'); });
    }

    async function applyVoucher() {
        const code = document.getElementById('voucherCode').value.trim();
        if(!code) return;
        try {
            const res = await api.get(`/promotions/validate?code=${code}&amount=${calculateSubtotal()}`);
            if(res.success) { appliedVoucher = res.data; document.getElementById('appliedVoucherBadge').classList.remove('d-none'); document.getElementById('appliedVoucherName').textContent = code; showNotify('Thành công', 'Đã áp dụng mã giảm giá.'); updateOrder(); }
            else showNotify('Lỗi mã', res.message, 'error');
        } catch(e) { showNotify('Lỗi', 'Mã không hợp lệ hoặc đã hết hạn.', 'error'); }
    }

    function removeVoucher() { appliedVoucher = null; document.getElementById('appliedVoucherBadge').classList.add('d-none'); document.getElementById('voucherCode').value = ''; updateOrder(); showNotify('Đã gỡ', 'Đã xóa mã giảm giá.', 'info'); }

    function calculateSubtotal() {
        let sub = selectedSeats.reduce((sum, s) => sum + s.price, 0);
        Object.entries(selectedCombos).forEach(([id, q]) => { const c = allCombos.find(x => x.id == id); if(c) sub += c.price * q; });
        return sub;
    }

    function updateOrder() {
        const container = document.getElementById('orderItems');
        const sub = calculateSubtotal();
        const tiers = { STANDARD: 0, SILVER: 5, GOLD: 10, PLATINUM: 15 };
        const mDisc = sub * ((tiers[currentMember?.membershipTier] || 0) / 100);
        const vDisc = appliedVoucher ? appliedVoucher.appliedDiscountAmount : 0;
        const total = Math.max(0, sub - mDisc - vDisc);

        let html = selectedSeats.map(s => `<div class="order-item"><span>Ghế ${s.seatCode}</span><span>${s.price.toLocaleString()}đ</span></div>`).join('');
        Object.entries(selectedCombos).forEach(([id, q]) => { const c = allCombos.find(x => x.id == id); if(c) html += `<div class="order-item"><span>${c.name} x${q}</span><span>${(c.price * q).toLocaleString()}đ</span></div>`; });

        container.innerHTML = html || '<div class="text-center py-4 text-muted small italic">Giỏ hàng đang trống</div>';
        document.getElementById('billSubtotal').textContent = sub.toLocaleString() + 'đ';
        document.getElementById('billDiscount').textContent = `-${mDisc.toLocaleString()}đ`;
        document.getElementById('billVoucher').textContent = `-${vDisc.toLocaleString()}đ`;
        document.getElementById('billTotal').textContent = total.toLocaleString() + 'đ';
        document.getElementById('btnFinalize').disabled = (selectedSeats.length === 0 && Object.keys(selectedCombos).length === 0);
    }

    async function lookupMember() {
        const phone = document.getElementById('memberPhone').value; if(!phone) return;
        try {
            const res = await api.get(`/admin/customers/lookup?phone=${phone}`);
            if(res.success && res.data) { currentMember = res.data; document.getElementById('memberInfo').classList.remove('d-none'); document.getElementById('memberName').textContent = currentMember.fullName; document.getElementById('memberTier').textContent = currentMember.membershipTier; showNotify('Hội viên', 'Đã nhận diện: ' + currentMember.fullName); updateOrder(); }
            else showNotify('Không tìm thấy', 'Số điện thoại chưa đăng ký hội viên.', 'error');
        } catch(e) { showNotify('Lỗi tra cứu', 'Vui lòng kiểm tra lại kết nối.', 'error'); }
    }

    function clearMember() { currentMember = null; document.getElementById('memberInfo').classList.add('d-none'); updateOrder(); showNotify('Đã gỡ', 'Đã xóa thông tin hội viên.', 'info'); }

    async function finalizeSale() {
        const body = { showtimeId: selectedShowtime ? Number(selectedShowtime.id) : null, seatIds: selectedSeats.map(s => Number(s.id)), combos: Object.keys(selectedCombos).length ? selectedCombos : null, promotionCode: appliedVoucher?.code, paymentMethod: 'CASH', customerPhone: currentMember?.phone };
        const btn = document.getElementById('btnFinalize'); btn.disabled = true; btn.textContent = 'ĐANG XỬ LÝ...';
        try {
            const res = await api.post('/bookings', body);
            if(res.bookingCode) { await api.post(`/payments/${res.bookingCode}/confirm`); showNotify('Thành công', 'Đã đặt vé và in hóa đơn!', 'success'); setTimeout(() => location.reload(), 1500); }
        } catch(e) { showNotify('Lỗi đặt vé', e.message, 'error'); btn.disabled = false; btn.textContent = 'XÁC NHẬN & IN VÉ'; }
    }

    function switchTab(tab) {
        document.querySelectorAll('.pos-tab').forEach(t => t.classList.remove('active')); event.currentTarget.classList.add('active');
        document.getElementById('salesContainer').classList.toggle('d-none', tab !== 'sales');
        document.getElementById('checkinContainer').classList.toggle('d-none', tab !== 'checkin');
    }

    async function validateCheckin() {
        const code = document.getElementById('checkinCode').value.trim(); if(!code) return;
        const btn = document.getElementById('btnCheckin'); btn.disabled = true;
        try {
            const res = await api.put(`/bookings/${code}/checkin`);
            const statusDiv = document.getElementById('checkinStatus');
            if(res.success) { statusDiv.innerHTML = `<div class="alert alert-success fw-bold p-4 rounded-4">✅ VÉ HỢP LỆ!<br>Chào mừng khách vào phòng chiếu.</div>`; showNotify('Soát vé', 'Khách hàng đã vào phòng.', 'success'); }
            else { statusDiv.innerHTML = `<div class="alert alert-danger fw-bold p-4 rounded-4">❌ VÉ KHÔNG HỢP LỆ<br>${res.message}</div>`; showNotify('Thất bại', 'Vé không được phép vào cổng.', 'error'); }
        } catch(e) { showNotify('Lỗi', 'Không thể thực hiện soát vé.', 'error'); } finally { btn.disabled = false; document.getElementById('checkinCode').value = ''; }
    }

    init();
</script>
</body>
</html>
