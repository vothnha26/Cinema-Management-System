<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarCinema – Quản Lý Nhân Sự</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <link rel="icon" type="image/png" href="/favicon.png?v=2">
    <style>
        :root {
          --bg: #080B14; --surface: #0F1320; --card: #161B2E; --border: #252A3D;
          --accent: #E5133A; --accent-gold: #F5A623; --text: #E8EAF0; --text-muted: #7B82A0;
          --gradient: linear-gradient(135deg, #E5133A, #8B0020);
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; overflow-x: hidden; }
        
        .main-content { padding: 40px; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; letter-spacing: 1px; margin: 0; }

        .custom-table { background: var(--card); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
        .table { color: var(--text); margin-bottom: 0; vertical-align: middle; }
        .table thead { background: var(--surface); }
        .table th { border: none; padding: 20px; font-weight: 600; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
        .table td { border-top: 1px solid var(--border); padding: 20px; font-size: 0.95rem; }
        
        .role-badge { padding: 4px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .badge-manager { background: rgba(245,166,35,0.15); color: var(--accent-gold); border: 1px solid rgba(245,166,35,0.3); }
        .badge-staff { background: rgba(100,200,255,0.15); color: #64C8FF; border: 1px solid rgba(100,200,255,0.3); }

        .status-indicator { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .status-active { background: #50C864; box-shadow: 0 0 10px rgba(80,200,100,0.5); }
        .status-locked { background: #7B82A0; }

        .btn-add { background: var(--gradient); border: none; color: #fff; padding: 10px 24px; border-radius: 10px; font-weight: 600; }
        .action-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); width: 36px; height: 36px; border-radius: 8px; transition: all 0.2s; }
        .action-btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn-reset { color: var(--accent-gold) !important; }
        .btn-status-toggle { color: #64C8FF !important; }

        .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 20px; color: var(--text); }
        .form-control-custom { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px 16px; }
        .form-control-custom:focus { border-color: var(--accent); background: var(--surface); color: var(--text); box-shadow: none; }
    </style>
</head>
<body>

<aside class=\"sidebar\"></aside>

<main class="main-content">
    <div class="header-section">
        <div>
            <h1 class="page-title">Quản lý nhân sự</h1>
            <p class="text-muted m-0">Quản lý tài khoản, trạng thái và gửi mail bảo mật</p>
        </div>
        <button class="btn-add" onclick="showCreateModal()">
            <i class="bi bi-person-plus-fill me-2"></i> THÊM NHÂN VIÊN
        </button>
    </div>

    <div class="custom-table mt-4">
        <table class="table">
            <thead>
                <tr>
                    <th>Email liên hệ</th>
                    <th>Vai trò</th>
                    <th>Trạng thái</th>
                    <th class="text-end">Hành động</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <!-- Data will be loaded via JS -->
            </tbody>
        </table>
    </div>
</main>

<!-- Modals and Scripts -->
<div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold" id="modalTitle">Thêm nhân viên mới</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body pt-4">
                <form id="userForm">
                    <div class="mb-3">
                        <label class="form-label">Tên đăng nhập</label>
                        <input type="text" id="username" class="form-control form-control-custom" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email làm việc</label>
                        <input type="email" id="email" class="form-control form-control-custom" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Vai trò</label>
                        <select id="role" class="form-select form-control-custom" required>
                            <option value="STAFF">Nhân viên</option>
                            <option value="MANAGER">Quản lý rạp</option>
                        </select>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-danger py-2 fw-bold">XÁC NHẬN THỰC THI</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/sidebar.js"></script>
<script>
    if (!AuthGuard.requireRole(['ADMIN', 'MANAGER'])) {}

    let userModal;
    let editUserId = null;

    document.addEventListener('DOMContentLoaded', () => {
        userModal = new bootstrap.Modal(document.getElementById('userModal'));
        loadUsers();

        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                role: document.getElementById('role').value
            };

            const response = await api.post('/admin/users/staff', data);
            if (response.success) {
                userModal.hide();
                loadUsers();
            }
        });
    });

    async function loadUsers() {
        const response = await api.get('/admin/users');
        if (response.success) {
            renderUsers(response.data);
        }
    }

    function renderUsers(users) {
        const tbody = document.getElementById('userTableBody');
        tbody.innerHTML = users.map(user => `
            <tr>
                <td>
                    <div class="fw-bold">${user.username}</div>
                    <div class="text-muted small">${user.email}</div>
                </td>
                <td>
                    <span class="role-badge badge-${user.role.toLowerCase()}">${user.role}</span>
                </td>
                <td>
                    <span class="status-indicator ${user.status ? 'status-active' : 'status-locked'}"></span>
                    <span class="small">${user.status ? 'Hoạt động' : 'Đã khóa'}</span>
                </td>
                <td class="text-end">
                    <button class="action-btn btn-status-toggle me-2" onclick="toggleStatus(${user.id})" title="Khóa/Mở khóa">
                        <i class="bi bi-power"></i>
                    </button>
                    <button class="action-btn btn-reset" onclick="sendReset(${user.id})" title="Gửi mail Onboarding">
                        <i class="bi bi-envelope-at"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    function showCreateModal() {
        editUserId = null;
        document.getElementById('modalTitle').innerText = 'Thêm nhân viên mới';
        document.getElementById('userForm').reset();
        document.getElementById('username').disabled = false;
        userModal.show();
    }

    async function toggleStatus(id) {
        if (confirm('Xác nhận thay đổi trạng thái hoạt động của người dùng này?')) {
            const response = await api.put(`/admin/users/${id}/status`);
            if (response.success) loadUsers();
        }
    }

    async function sendReset(id) {
        if (confirm('Gửi email yêu cầu đặt lại mật khẩu (Onboarding) cho nhân viên này?')) {
            const response = await api.post(`/admin/users/${id}/reset-password-email`);
            if (response.success) alert('Đã gửi email thành công!');
        }
    }
</script>
</body>
</html>
