<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarCinema – Quản Lý Nhân Sự</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/sidebar.css">
    <style>
        :root {
          --bg: #080B14; --surface: #0F1320; --card: #161B2E; --border: #252A3D;
          --accent: #E5133A; --accent-gold: #F5A623; --text: #E8EAF0; --text-muted: #7B82A0;
          --gradient: linear-gradient(135deg, #E5133A, #8B0020);
        }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; }
        .main-content { padding: 40px; margin-left: 280px; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; letter-spacing: 1px; margin: 0; }
        .custom-table { background: var(--card); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
        .table { color: var(--text); margin-bottom: 0; vertical-align: middle; }
        .table thead { background: var(--surface); }
        .table th { border: none; padding: 20px; font-weight: 600; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }
        .table td { border-top: 1px solid var(--border); padding: 20px; }
        .btn-add { background: var(--gradient); border: none; color: #fff; padding: 10px 24px; border-radius: 10px; font-weight: 600; }
        .role-badge { padding: 4px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .badge-manager { background: rgba(245,166,35,0.15); color: var(--accent-gold); border: 1px solid rgba(245,166,35,0.3); }
        .badge-staff { background: rgba(100,200,255,0.15); color: #64C8FF; border: 1px solid rgba(100,200,255,0.3); }
        .branch-tag { font-size: 0.8rem; background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); padding: 2px 8px; border-radius: 4px; }
        .action-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); width: 36px; height: 36px; border-radius: 8px; }
        .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 20px; color: var(--text); }
        .form-control-custom { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px 16px; }
    </style>
</head>
<body>

<aside class="sidebar"></aside>

<main class="main-content">
    <div class="header-section">
        <div>
            <h1 class="page-title">Quản lý nhân sự</h1>
            <p class="text-muted m-0">Quản lý tài khoản, gán nhân viên vào rạp và phân quyền quản trị</p>
        </div>
        <button class="btn-add" onclick="showCreateModal()">
            <i class="bi bi-person-plus-fill me-2"></i> THÊM NHÂN VIÊN
        </button>
    </div>

    <div class="custom-table mt-4">
        <table class="table">
            <thead>
                <tr>
                    <th>Email liên hệ</th>
                    <th>Vai trò</th>
                    <th>Đơn vị (Chi nhánh)</th>
                    <th>Trạng thái</th>
                    <th class="text-end">Hành động</th>
                </tr>
            </thead>
            <tbody id="userTableBody"></tbody>
        </table>
    </div>
</main>

<!-- Modal -->
<div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold">Thông tin nhân sự</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body pt-4">
                <form id="userForm">
                    <div class="mb-3">
                        <label class="form-label">Tên đăng nhập</label>
                        <input type="text" id="username" class="form-control form-control-custom" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email làm việc</label>
                        <input type="email" id="email" class="form-control form-control-custom" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Vai trò</label>
                        <select id="role" class="form-select form-control-custom" onchange="toggleBranchSelection()" required>
                            <option value="STAFF">Nhân viên bán vé</option>
                            <option value="MANAGER">Quản lý rạp</option>
                            <option value="ADMIN">Quản trị viên (Hệ thống)</option>
                        </select>
                    </div>

                    <div id="branchSelection" class="p-3 border border-secondary rounded mb-3 bg-dark bg-opacity-10">
                        <h6 class="mb-3 small fw-bold text-muted uppercase">THÔNG TIN CÔNG TÁC</h6>
                        <div class="mb-3">
                            <label class="form-label small">Chi nhánh làm việc</label>
                            <select id="branchId" class="form-select form-control-custom"></select>
                        </div>
                        <div class="row">
                            <div class="col">
                                <label class="form-label small">Mã nhân viên</label>
                                <input type="text" id="staffCode" class="form-control form-control-custom" placeholder="STFXXX">
                            </div>
                            <div class="col">
                                <label class="form-label small">Vị trí cụ thể</label>
                                <input type="text" id="position" class="form-control form-control-custom" placeholder="VD: Lead Staff">
                            </div>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-danger py-2 fw-bold">XÁC NHẬN THỰC THI</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/sidebar.js"></script>
<script>
    AuthGuard.requireRole(['ADMIN']);
    let userModal;
    let staffMap = {};

    document.addEventListener('DOMContentLoaded', async () => {
        userModal = new bootstrap.Modal(document.getElementById('userModal'));
        await loadInitialData();

        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userData = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                role: document.getElementById('role').value
            };

            const userRes = await api.post('/admin/users/staff', userData);
            if (userRes.success) {
                const newUser = userRes.data;
                const role = document.getElementById('role').value;
                
                if (role === 'STAFF' || role === 'MANAGER') {
                    const staffData = {
                        userId: newUser.id,
                        branchId: document.getElementById('branchId').value,
                        staffCode: document.getElementById('staffCode').value,
                        position: document.getElementById('position').value
                    };
                    await api.post('/admin/staffs', staffData);
                }
                userModal.hide();
                loadUsers();
            }
        });
    });

    async function loadInitialData() {
        const branches = await api.get('/admin/branches');
        if (branches.success) {
            document.getElementById('branchId').innerHTML = branches.data.map(b => `<option value="${b.id}">${b.name} (${b.city})</option>`).join('');
        }
        await loadUsers();
    }

    async function loadUsers() {
        const assignmentsRes = await api.get('/admin/staffs/assignments');
        if (assignmentsRes.success) staffMap = assignmentsRes.data;

        const response = await api.get('/admin/users');
        if (response.success) renderUsers(response.data);
    }

    function renderUsers(users) {
        const tbody = document.getElementById('userTableBody');
        tbody.innerHTML = users.filter(u => u.role !== 'CUSTOMER').map(u => {
            const staffInfo = staffMap[u.id];
            return `
                <tr>
                    <td><div class="fw-bold">${u.username}</div><div class="text-muted small">${u.email}</div></td>
                    <td><span class="role-badge badge-${u.role.toLowerCase()}">${u.role}</span></td>
                    <td>
                        ${staffInfo ? `<div class="fw-bold">${staffInfo.branch.name}</div><div class="branch-tag">${staffInfo.position || 'Nhân viên'}</div>` : '<em class="text-muted">Toàn chuỗi (HQ)</em>'}
                    </td>
                    <td><span class="badge ${u.status ? 'bg-success' : 'bg-secondary'}">${u.status ? 'Hoạt động' : 'Khóa'}</span></td>
                    <td class="text-end">
                        <button class="action-btn me-2" onclick="toggleStatus(${u.id})"><i class="bi bi-power"></i></button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function toggleBranchSelection() {
        const role = document.getElementById('role').value;
        document.getElementById('branchSelection').style.display = (role === 'ADMIN') ? 'none' : 'block';
    }

    function showCreateModal() {
        document.getElementById('userForm').reset();
        toggleBranchSelection();
        userModal.show();
    }

    async function toggleStatus(id) {
        if (confirm('Thay đổi trạng thái người dùng này?')) {
            const response = await api.put(`/admin/users/${id}/status`);
            if (response.success) loadUsers();
        }
    }
</script>
</body>
</html>
