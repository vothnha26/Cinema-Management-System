<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Người dùng – StarCinema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <link rel="icon" type="image/png" href="/favicon.png?v=2">
    <style>
        :root {
          --bg: #080B14; --surface: #0F1320; --card: #161B2E; --border: #252A3D;
          --accent: #E5133A; --accent-gold: #F5A623; --text: #E8EAF0; --text-muted: #7B82A0;
          --gradient: linear-gradient(135deg, #E5133A, #8B0020);
          --sidebar-width: 260px;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; overflow-x: hidden; }
        .sidebar { width: var(--sidebar-width); background: var(--surface); border-right: 1px solid var(--border); height: 100vh; position: fixed; top: 0; left: 0; z-index: 1000; padding: 24px; display: flex; flex-direction: column; }
        .brand { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 3px; color: var(--text); margin-bottom: 40px; text-decoration: none; }
        .brand span { color: var(--accent); }
        .nav-link-admin { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text-muted); text-decoration: none; border-radius: 10px; transition: all 0.2s; font-weight: 500; margin-bottom: 8px; }
        .nav-link-admin:hover, .nav-link-admin.active { background: rgba(229,19,58,0.1); color: var(--accent); }
        .nav-link-admin.active { background: var(--gradient); color: #fff; }
        .user-panel { border-top: 1px solid var(--border); padding-top: 20px; margin-top: auto; }

        .main-content { margin-left: var(--sidebar-width); padding: 40px; min-height: 100vh; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; letter-spacing: 1px; margin: 0; }

        .btn-add { background: var(--gradient); border: none; color: #fff; padding: 10px 24px; border-radius: 10px; font-weight: 600; }
        .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
        .table { margin: 0; color: var(--text); }
        .table thead th { background: var(--surface); padding: 16px 24px; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }
        .table tbody td { padding: 16px 24px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        
        .role-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
        .role-admin { background: rgba(229,19,58,0.15); color: var(--accent); }
        .role-manager { background: rgba(245,166,35,0.15); color: var(--accent-gold); }
        .role-staff { background: rgba(100,180,255,0.15); color: #64B4FF; }
        .role-customer { background: rgba(80,200,100,0.15); color: #50C864; }

        .action-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); transition: 0.2s; }
        .action-btn:hover { border-color: var(--accent); color: var(--accent); }
    </style>
</head>
<body>

<aside class="sidebar">
    <!-- Rendered by sidebar.js -->
</aside>

<main class="main-content">
    <div class="header-section">
        <div>
            <h1 class="page-title">Quản lý người dùng</h1>
            <p class="text-muted m-0">Danh sách tài khoản trong hệ thống</p>
        </div>
        <button class="btn-add" data-bs-toggle="modal" data-bs-target="#userModal">
            <i class="bi bi-person-plus me-2"></i> TẠO TÀI KHOẢN
        </button>
    </div>

    <div class="table-container">
        <table class="table">
            <thead>
                <tr>
                    <th>Người dùng</th>
                    <th>Email</th>
                    <th>Vai trò</th>
                    <th>Trạng thái</th>
                    <th class="text-end">Thao tác</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <tr><td colspan="5" class="text-center py-5 text-muted">Đang tải dữ liệu...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<!-- USER MODAL (Basic structure) -->
<div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background:var(--card); border:1px solid var(--border); color:var(--text); border-radius:20px;">
            <div class="modal-header" style="border-bottom:1px solid var(--border); padding:24px;">
                <h5 class="modal-title">THÔNG TIN TÀI KHOẢN</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form id="userForm">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Tên đăng nhập</label>
                        <input type="text" name="username" class="form-control" style="background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:12px;" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Email</label>
                        <input type="email" name="email" class="form-control" style="background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:12px;" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Vai trò</label>
                        <select name="role" class="form-select" style="background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:12px;">
                            <option value="STAFF">NHÂN VIÊN (STAFF)</option>
                            <option value="MANAGER">QUẢN LÝ (MANAGER)</option>
                            <option value="ADMIN">QUẢN TRỊ VIÊN (ADMIN)</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer" style="border-top:1px solid var(--border); padding:24px;">
                <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Hủy</button>
                <button type="button" class="btn btn-danger px-4 fw-bold" onclick="saveUser()">LƯU TÀI KHOẢN</button>
            </div>
        </div>
    </div>
</div>

<script src="/js/auth-guard.js"></script>
<script>AuthGuard.requireRole(['ADMIN']);</script>
<script src="/js/sidebar.js"></script>
<script src="/js/api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const userModal = new bootstrap.Modal(document.getElementById('userModal'));

    document.addEventListener('DOMContentLoaded', loadUsers);

    async function loadUsers() {
        const res = await api.get('/users');
        if (res.success) {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = res.data.map(u => `
                <tr>
                    <td><div class="fw-bold">${u.username}</div><div class="small text-muted">${u.fullName || 'Chưa cập nhật'}</div></td>
                    <td>${u.email}</td>
                    <td><span class="role-badge role-${u.role.toLowerCase()}">${u.role}</span></td>
                    <td><span class="text-success small fw-bold">Đang hoạt động</span></td>
                    <td class="text-end">
                        <button class="action-btn me-1" onclick="editUser(${u.id})"><i class="bi bi-pencil-square"></i></button>
                        <button class="action-btn" onclick="deleteUser(${u.id})"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }
    }

    async function saveUser() {
        // Form handling logic
        userModal.hide();
        loadUsers();
    }
</script>
</body>
</html>
