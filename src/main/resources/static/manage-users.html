<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarCinema – Quản Lý Người Dùng</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <link rel="icon" type="image/png" href="/favicon.png?v=2">
    <style>
        :root {
          --bg: #080B14; --surface: #0F1320; --card: #161B2E; --border: #252A3D;
          --accent: #E5133A; --accent-gold: #F5A623; --text: #E8EAF0; --text-muted: #7B82A0;
          --gradient: linear-gradient(135deg, #E5133A, #8B0020);
          --sidebar-width: 260px;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; overflow-x: hidden; }
        
        .sidebar {
          width: var(--sidebar-width); background: var(--surface); border-right: 1px solid var(--border);
          height: 100vh; position: fixed; top: 0; left: 0; z-index: 1000; padding: 24px;
          display: flex; flex-direction: column;
        }
        .brand { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 3px; color: var(--text); margin-bottom: 40px; text-decoration: none; display: block; }
        .brand span { color: var(--accent); }
        .nav-menu { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
        .nav-item { margin-bottom: 8px; }
        .nav-link-admin {
          display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text-muted);
          text-decoration: none; border-radius: 10px; transition: all 0.2s; font-weight: 500;
        }
        .nav-link-admin i { font-size: 1.2rem; }
        .nav-link-admin:hover, .nav-link-admin.active { background: rgba(229,19,58,0.1); color: var(--accent); }
        .nav-link-admin.active { background: var(--gradient); color: #fff; }

        .user-panel { border-top: 1px solid var(--border); padding-top: 20px; margin-top: 20px; }
        .admin-profile { display: flex; align-items: center; gap: 12px; }
        .admin-avatar { width: 40px; height: 40px; border-radius: 10px; background: var(--gradient); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; }

        .main-content { margin-left: var(--sidebar-width); padding: 40px; min-height: 100vh; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; letter-spacing: 1px; margin: 0; }

        .nav-tabs-custom { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        .tab-item { padding: 8px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--text-muted); transition: all 0.2s; }
        .tab-item.active { background: rgba(229,19,58,0.1); color: var(--accent); }
        .tab-item:hover:not(.active) { color: var(--text); background: rgba(255,255,255,0.05); }

        .custom-table-container { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
        .table { margin: 0; color: var(--text); border-color: var(--border); }
        .table thead { background: var(--surface); }
        .table th { border: none; padding: 16px 24px; color: var(--text-muted); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; }
        .table td { border-top: 1px solid var(--border); padding: 16px 24px; vertical-align: middle; }
        
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-avatar-round { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border); }
        .user-name { font-weight: 600; color: var(--text); display: block; }
        .user-email { font-size: 0.8rem; color: var(--text-muted); }

        .role-badge { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .role-admin { background: rgba(229,19,58,0.15); color: var(--accent); }
        .role-staff { background: rgba(100,180,255,0.15); color: #64B4FF; }
        .role-customer { background: rgba(245,166,35,0.15); color: var(--accent-gold); }

        .status-pill { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
        .status-active { background: rgba(80,200,100,0.1); color: #50C864; }
        .status-locked { background: rgba(255,255,255,0.05); color: var(--text-muted); }

        .btn-action { width: 32px; height: 32px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); transition: all 0.2s; }
        .btn-action:hover { border-color: var(--accent); color: var(--accent); }

        .modal-content { background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 16px; }
        .modal-header { border-bottom: 1px solid var(--border); padding: 24px; }
        .modal-footer { border-top: 1px solid var(--border); padding: 20px 24px; }
        
        .form-label { font-size: 0.85rem; font-weight: 500; color: var(--text-muted); margin-bottom: 8px; }
        .form-control, .form-select { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 12px 16px; }
        .form-control:focus, .form-select:focus { background: var(--surface); border-color: var(--accent); color: var(--text); box-shadow: 0 0 0 3px rgba(229,19,58,0.1); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    </style>
</head>
<body>

<aside class="sidebar">
    <a href="index.html" class="brand">STAR<span>CINEMA</span></a>
    <ul class="nav-menu">
        <li class="nav-item"><a href="dashboard.html" class="nav-link-admin"><i class="bi bi-grid-1x2-fill"></i> Bảng điều khiển</a></li>
        <li class="nav-item"><a href="manage-movies.html" class="nav-link-admin"><i class="bi bi-film"></i> Quản lý phim</a></li>
        <li class="nav-item"><a href="manage-showtimes.html" class="nav-link-admin"><i class="bi bi-calendar-event"></i> Suất chiếu</a></li>
        <li class="nav-item"><a href="manage-rooms.html" class="nav-link-admin"><i class="bi bi-door-open"></i> Phòng chiếu</a></li>
        <li class="nav-item"><a href="#" class="nav-link-admin"><i class="bi bi-ticket-perforated"></i> Quản lý vé</a></li>
        <li class="nav-item"><a href="manage-users.html" class="nav-link-admin active"><i class="bi bi-people"></i> Người dùng</a></li>
    </ul>
    <div class="user-panel">
        <div class="admin-profile">
            <div class="admin-avatar">AD</div>
            <div>
                <div style="font-size:0.9rem;font-weight:600">Admin User</div>
                <div style="font-size:0.75rem;color:var(--text-muted)">Quản trị viên</div>
            </div>
        </div>
    </div>
</aside>

<main class="main-content">
    <div class="header-section">
        <h1 class="page-title">Quản lý người dùng</h1>
        <button class="btn btn-danger px-4 py-2" style="border-radius:10px; font-weight:600; background:var(--gradient); border:none" data-bs-toggle="modal" data-bs-target="#addUserModal">
            <i class="bi bi-person-plus me-2"></i> Thêm nhân viên
        </button>
    </div>

    <div class="nav-tabs-custom">
        <div class="tab-item active" onclick="switchUserTab('STAFF', this)">Nhân viên</div>
        <div class="tab-item" onclick="switchUserTab('CUSTOMER', this)">Khách hàng</div>
    </div>

    <div class="custom-table-container">
        <table class="table">
            <thead>
                <tr>
                    <th>Người dùng</th>
                    <th>Số điện thoại</th>
                    <th>Vai trò</th>
                    <th>Trạng thái</th>
                    <th class="text-end">Thao tác</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <tr><td colspan="5" class="text-center py-4 text-muted">Đang tải dữ liệu...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<script src="/js/api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentRoleTab = 'STAFF';

    document.addEventListener('DOMContentLoaded', loadUsers);

    async function loadUsers() {
        const response = await api.get('/admin/users'); // Giả định endpoint admin
        if (response.success) {
            renderUsers(response.data);
        } else {
            document.getElementById('userTableBody').innerHTML = '<tr><td colspan="5" class="text-center py-4 text-danger">Không thể tải dữ liệu</td></tr>';
        }
    }

    function renderUsers(users) {
        const tbody = document.getElementById('userTableBody');
        const filtered = users.filter(u => u.role === currentRoleTab || (currentRoleTab === 'STAFF' && u.role === 'MANAGER'));
        
        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">Trống</td></tr>';
            return;
        }

        tbody.innerHTML = filtered.map(u => `
            <tr>
                <td>
                    <div class="user-info">
                        <div class="admin-avatar" style="width:40px; height:40px; font-size:0.8rem">${u.username.substring(0,2).toUpperCase()}</div>
                        <div>
                            <span class="user-name">${u.fullName || u.username}</span>
                            <span class="user-email">${u.email || 'N/A'}</span>
                        </div>
                    </div>
                </td>
                <td>${u.phoneNumber || 'N/A'}</td>
                <td><span class="role-badge ${getRoleClass(u.role)}">${u.role}</span></td>
                <td>
                    <span class="status-pill ${u.enabled ? 'status-active' : 'status-locked'}">
                        <i class="bi bi-circle-fill"></i> ${u.enabled ? 'Hoạt động' : 'Đã khóa'}
                    </span>
                </td>
                <td class="text-end">
                    <div class="d-flex justify-content-end gap-2">
                        <button class="btn-action"><i class="bi bi-pencil-square"></i></button>
                        <button class="btn-action"><i class="bi ${u.enabled ? 'bi-lock' : 'bi-unlock'}"></i></button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    function getRoleClass(role) {
        if (role === 'ADMIN' || role === 'MANAGER') return 'role-admin';
        if (role === 'STAFF') return 'role-staff';
        return 'role-customer';
    }

    function switchUserTab(role, el) {
        currentRoleTab = role;
        document.querySelectorAll('.tab-item').forEach(item => item.classList.remove('active'));
        el.classList.add('active');
        loadUsers();
    }
</script>
</body>
</html>
