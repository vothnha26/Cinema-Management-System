# Test configuration (Real-world Integration)
server.port=8082

# MySQL Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/cinema_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
# Đặt là update để không xóa dữ liệu thực tế đang dùng
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration
jwt.secret=${JWT_SECRET:StarCinemaUltraSecretKey2024_PleaseChangeMe}
jwt.expiration=86400000

# Cloudinary Configuration (Real)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# JavaMailSender configuration (Real)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USER}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# TMDB Configuration (Real)
tmdb.api.key=${TMDB_API_KEY:919a2431095ad1d5a5a0bfe94b56acb3}
tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.api.image-base=https://image.tmdb.org/t/p/w500

# Disable regular data seeder for tests
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
